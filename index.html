w, labour, architecture, the calendar — was subordinated to that one job centuries ago. Nobody decided this. Geography decided it and the institutions caught up.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Black cliffs above the only pass in or out of the north.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Stone and construction. They build everything that must not fall.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Garrison command. Military and civic authority are the same office.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Hold the line. There is always something behind you worth standing for.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Fortification and standard. Every wall to specification, every structure carrying the name of who built it. The architecture is a record of accountability.<\/td><\/tr>\n<tr><th>The house<\/th><td>State-owned. The garrison controls every Loom.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Rigid, dependable, joyless.<\/td><\/tr>\n<tr><th>Fear<\/th><td>The line breaking. Being the last defence that failed.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Bears and big cats — rare and dangerous. Harvested by the garrison only.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Closing. The last day of the year: the gates shut, then reopen.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Every building carries the name of who built it. Failure is traceable.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Uniform. All black, structured, military. Boots, insignia that means something, rank visible.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Ne person becomes the engineer who improves the wall without authorisation, and is either promoted or court-martialled depending entirely on whether it held.<\/p>\n<h3>What they teach<\/h3>\n<p>Hold the line; nothing gets past. Position first, then structure. Roles are assigned and absolute — this player covers this, that player covers that, and neither crosses. Discipline is the skill and the shot is secondary to being in the right place. An error is leaving your assignment, even to win a point.<\/p>\n<p><strong>What they never train.<\/strong> Play last. Superb against the attack they prepared for. Against something not in the manual, nobody has authority to improvise.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#ruby-nation\">Ruby<\/a>. Both claim to be the strongest land, and their powers are exact opposites.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#onyx\">the Onyx edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#2A2A2E"},{"i":"shot-counting","t":"Shot counting","c":"Build","s":"","l":"Four wearables comparing loudness across one court. The test is not how loud, it is how uneven.","h":"<p><a href=\"#rally-length\">Rally-length scoring<\/a> needs a shot count during the rally, on a display. In live play net crossings and shots are the same number — every shot that stays in play crosses the net exactly once — so counting shots gives the crossing count directly.<\/p>\n<h3>Year one: a human counter<\/h3>\n<p>One dedicated counter per court, keeping the count in their head and entering it at the end of each rally. Testing showed clicking during a rally is harder than counting in your head, because operating a device splits attention away from watching. For a live display, use two people: one watches and calls the count aloud, one drives the display — speaking is closer to automatic than clicking.<\/p>\n<p><strong>Record audio and video from every court throughout year one.<\/strong> The human counts become labelled ground truth for the automated system.<\/p>\n<h3>The automated design<\/h3>\n<p>Four wearable sensors, one per player. Each is an ESP32 with a MEMS microphone and a radio.<\/p>\n<ol><li>Each sensor listens continuously through its own mic.<\/li>\n<li>A sound passing the filters triggers a reading: <strong>peak loudness plus a timestamp.<\/strong><\/li>\n<li>That number is broadcast — not audio, just a value and a time.<\/li>\n<li>Readings arriving within the same short window (30–50ms) are grouped as one event.<\/li>\n<li><strong>Compare the four readings.<\/strong> One much louder than the other three means a player on this court hit it, and the loudest sensor identifies who. All four roughly equal means the sound came from off court — discard.<\/li>\n<li>Count it as one shot. Rally ends when nothing is detected for about three seconds.<\/li><\/ol>\n<h3>Why a ratio and not a threshold<\/h3>\n<p>A sensor is roughly 40cm from its own player's paddle and 3–5m from the others, so an own-hit is <em>much<\/em> louder at one sensor than the rest — a large ratio. A hit on an adjacent court is 8m from everyone and arrives at all four at roughly equal strength — a small ratio.<\/p>\n<p><strong>So the question is not &ldquo;how loud&rdquo; but &ldquo;how uneven.&rdquo;<\/strong> That distinction is what makes the design work:<\/p>\n<ul><li><strong>Adjacent courts<\/strong> are rejected by evenness, regardless of how hard the neighbour hits.<\/li>\n<li><strong>Soft dinks<\/strong> are still detected, because even a quiet hit is far louder at the hitter's own wrist than at anyone else's.<\/li>\n<li><strong>Simultaneous hits on adjacent courts<\/strong> do not mask each other, because no single loudest event is being selected across a pooled signal. Each court's comparison is independent.<\/li>\n<li><strong>Faked swings<\/strong> register nothing — no contact, no sound.<\/li>\n<li><strong>Floor bounces<\/strong> are duller and softer, and are filtered out.<\/li><\/ul>\n<h3>The filters<\/h3>\n<p>Applied on each device before anything is reported, in this order:<\/p>\n<p><strong>High-pass filter, cutoff around 1.5kHz.<\/strong> Speech lives mostly below 1kHz; a paddle strike is 2–5kHz. This removes voices, crowd noise and low rumble before any measurement is taken. A standard biquad — the <code>esp-dsp<\/code> library has it built in.<\/p>\n<p><strong>Onset detection.<\/strong> Keep a running average of recent loudness and trigger when a new sample is roughly 20× it. A paddle strike reaches full volume in about a millisecond; a voice takes over a hundred. Nothing a person can shout rises fast enough to pass.<\/p>\n<p><strong>Blanking period, around 50ms<\/strong> after each detection, so one impact does not register twice as it rings.<\/p>\n<p>Order matters — high-pass first, or a loud voice can trip the onset detector before the frequency filter removes it.<\/p>\n<h3>Hardware<\/h3>\n<p><strong>ESP32<\/strong> — around $5, radio built in, handles I2S microphones natively.<\/p>\n<p><strong>A digital MEMS microphone, I2S output, omnidirectional, with an acoustic overload point of 130dB or higher.<\/strong> The AOP spec is the one that matters: a paddle strike at 40cm exceeds 120dB and an ordinary microphone clips, and clipped signals all read identical, so the ratio test fails exactly when it is needed. Candidates: Knowles SPH0645LM4H, TDK ICS-43434, Infineon IM69D130, ICS-52000. The common INMP441 is about 120dB — fine for a first test, since dinks will not clip it.<\/p>\n<p>Avoid consumer wireless lavalier microphones. They compress loud sounds, apply automatic gain, and often mix channels, all of which destroy the measurement.<\/p>\n<p>The four sensors must agree on time to within a few milliseconds or readings cannot be grouped. One device broadcasts a clock signal periodically and the others sync to it — standard practice with ESP-NOW.<\/p>\n<h3>Build order<\/h3>\n<p><strong>Test with two sensors before building four.<\/strong> The hardest case is a dinking player and their partner a metre apart at the net, where the distance ratio is smallest. Two ESP32s on USB power, no battery, no enclosure, printing peak values to a serial monitor.<\/p>\n<p>If the hitter's reading is clearly larger than their partner's on a soft dink, the design is proven and everything after is packaging. About $30 of parts and a weekend.<\/p>\n<h3>Later: an accelerometer<\/h3>\n<p>An accelerometer in the same unit would add swing speed, and with it a genuine analytics product — shots per rally by player, who ends points, how swing speed decays through a match. Players will want this, and it would work anywhere without installing cameras. Deliberately out of scope until the counting works.<\/p>\n<p>See <a href=\"#ruled-out\">Approaches ruled out<\/a> for the approaches that failed and why.<\/p>","x":null},{"i":"ruled-out","t":"Approaches ruled out","c":"Build","s":"","l":"Recorded with reasons, so the same suggestions do not come back in six months.","h":"<p>Every one of these was considered seriously and failed for a specific reason. Recorded so the reasoning is not relitigated.<\/p>\n<table><thead><tr><th>Approach<\/th><th>Why not<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Radar<\/strong><\/td><td>A hollow plastic ball with holes gives almost no radio return — plastic is nearly transparent to radio waves, and the holes make it partly air. Ruled out on physics, not difficulty.<\/td><\/tr>\n<tr><td><strong>Instrumented ball<\/strong><\/td><td>Cannot distinguish a paddle hit from a floor bounce, and pickleball's two-bounce rule makes bounces constant. This was the decisive objection.<\/td><\/tr>\n<tr><td><strong>Paddle-mounted accelerometer<\/strong><\/td><td>Tried, and did not work well.<\/td><\/tr>\n<tr><td><strong>Wrist accelerometer<\/strong><\/td><td>Would give physical isolation from adjacent courts, since vibration does not travel through air — but it detects the swing far better than the contact, and the approach was ruled out by earlier testing.<\/td><\/tr>\n<tr><td><strong>Pose estimation alone<\/strong><\/td><td>Counts swings, which players could fake. Unusable when the count decides the match.<\/td><\/tr>\n<tr><td><strong>Audio without the ratio test<\/strong><\/td><td>Defeated by adjacent courts, crowd noise, and the wide gap between muted and loud paddles. Quiet paddles are engineered to remove the sharp transient the detector depends on.<\/td><\/tr>\n<tr><td><strong>Shotgun microphone<\/strong><\/td><td>Directionality depends on wavelength, so a shotgun mic is nearly omnidirectional below 500Hz and a paddle strike has energy across that range. And a narrow cone cannot track a moving player.<\/td><\/tr>\n<tr><td><strong>Camera at a net post, looking along the net<\/strong><\/td><td>A crossing ball travels toward or away from the lens, which is the hardest motion to read. Side-to-side motion in that view is a ball travelling <em>along<\/em> the net, which is not what you want to count.<\/td><\/tr>\n<tr><td><strong>Yellow bandpass filter on a camera<\/strong><\/td><td>Sunlight is broadband, so a yellow filter passes yellow shirts, court paint and sunlit dust too. Retroreflective and fluorescent approaches work because the light source is controlled, not because of the wavelength.<\/td><\/tr>\n<tr><td><strong>IR break-beam curtain<\/strong><\/td><td>Genuinely good indoors and worth prototyping: it observes the crossing rather than reconstructing it, a floor bounce does not cross the net, and nothing can fake it. Limits are lob height and, outdoors, sunlight swamping IR — solvable with modulated emitters.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>The underlying difficulty<\/h3>\n<p>&ldquo;Ball crossed the net&rdquo; is not a physical event, it is a <em>rules<\/em> event. It depends on whether contact was paddle or floor, on which side the ball is, on the two-bounce rule. Only something that understands the game can count it — which is why the working design counts <em>hits<\/em> and lets the game's own structure supply the rest.<\/p>\n<h3>Commercial alternative<\/h3>\n<p>Worth pursuing in parallel. <strong>PlayReplay<\/strong> already runs live on court with net-post cameras, announcing calls through loudspeakers, and computes shot counts as part of its analytics. If they will expose a live shot count via API, this stops being a build.<\/p>\n<p>Ask specifically: can the edge unit output a live shot count during a rally, can it drive an external display, and can it be configured for a format where the count matters more than line calls. Frame it as a partnership — a twelve-event annual series in a growing Asian market, built around their live capability, is a good showcase. <strong>DinkVision<\/strong> is worth the same question, though it appears to be post-match analysis.<\/p>","x":null},{"i":"open-items","t":"Open items","c":"Build","s":"","l":"What still needs deciding, roughly in order of urgency.","h":"<h3>Before anything else is printed<\/h3>\n<ul><li><strong>Trademark clearance<\/strong> in class 41 (sporting and cultural events) at the Thai DIP, and ideally EU and US. A web search is not a trademark search, and Thailand's register is poorly indexed. Budget for a Thai trademark agent.<\/li>\n<li><strong>Verify the dates<\/strong> for the launch year against a calendar.<\/li>\n<li><strong>The Winter year boundary<\/strong> — state explicitly in the rules which calendar year a February title belongs to.<\/li><\/ul>\n<h3>Format<\/h3>\n<ul><li><strong>The <a href=\"#team-deathmatch\">Team deathmatch<\/a> rotation trigger.<\/strong> The biggest open question in the formats, and one stopwatch settles it.<\/li>\n<li>Matchup selection, the time-limit tiebreak, and whether teams are fixed across a season.<\/li>\n<li><strong>The <a href=\"#painite\">Painite<\/a> life count<\/strong>, which needs measuring from real rally lengths at the highest level available.<\/li><\/ul>\n<h3>Products<\/h3>\n<ul><li><strong>The fourth garment.<\/strong> Jacket, cap and shirt are settled.<\/li>\n<li><strong>The unlock architecture above the edition layer<\/strong> — season, Crown, Master, Full Spectrum and Diamond collections are a framework, not a decision. See <a href=\"#earned-access\">Earned access<\/a>.<\/li>\n<li><strong>Whether an open catalogue exists<\/strong> for spectators, families and non-winning entrants — or whether entering is itself the first gate, which would make the collection meaningful while still giving every entrant something to buy.<\/li>\n<li><strong>Retroactive purchase.<\/strong> Can a past champion buy that year's design, marked, later? A limited window seems right, or the archive never closes.<\/li>\n<li><strong>Resale.<\/strong> If a jacket is genuinely rare, a secondary market appears whether sanctioned or not, and a visible resale price is the clearest proof the system has value.<\/li><\/ul>\n<h3>Design<\/h3>\n<ul><li><strong>The twelve <a href=\"#the-marks\">marks<\/a><\/strong>, drawn as one batch rather than one a month.<\/li>\n<li><strong><a href=\"#peridot\">Peridot<\/a> and <a href=\"#emerald\">Emerald<\/a><\/strong> are the two greens. Mock up both posters as real artwork before locking the palette. Same for <a href=\"#ruby\">Ruby<\/a> into <a href=\"#amber\">Amber<\/a>.<\/li>\n<li><strong>Summer sequencing.<\/strong> All four summer editions are warm — pink, gold, red, honey — so at a glance they will start to look like the same piece graded four ways. The separator has to be light and terrain, not colour: flat diffuse daylight, hard overhead glare, low firelight on black rock, dappled shade under canopy.<\/li><\/ul>\n<h3>Naming and lore<\/h3>\n<ul><li>The series name is not final.<\/li>\n<li>November is <strong>Moonstone<\/strong> in the tournament and <strong>Adularia<\/strong> in the fiction, with the Lantern Lake as the common name. Same stone, three registers — worth keeping straight in asset names.<\/li>\n<li>The documents still say SPECTRA MANI throughout, including filenames. A rename pass is outstanding.<\/li><\/ul>\n<h3>Verify before sponsor materials<\/h3>\n<ul><li>The zircon dating claim.<\/li>\n<li>Whether Chanthaburi sapphire is still actively mined or now primarily a cutting and trading centre.<\/li>\n<li>The นพรัตน์ overlap, which is six of twelve — pitch as <em>anchored in<\/em> the tradition rather than <em>based on<\/em> it.<\/li><\/ul>","x":null},{"i":"prototypes","t":"Prototypes","c":"Build","s":"","l":"Working interfaces, kept as their own pages rather than folded in here.","h":"<p>These are live interfaces rather than documents, so they live as their own pages — a reference wiki would flatten them.<\/p>\n<ul class=\"protos\">\n<li><a href=\"https://claude.ai/artifact/VeoB2ZhqV153tza1sQnchP\">Moonstone App Changes<\/a> — app<\/li>\n<li><a href=\"https://claude.ai/artifact/29itgfciLXoznuQaUjA2m8\">Court Touch Screens<\/a> — on-court<\/li>\n<li><a href=\"https://claude.ai/artifact/Mf3VCR6rJ9kDH7nPTLWfjJ\">Front-End UI Test<\/a> — design canvas<\/li>\n<\/ul>\n<h3>Asset pipeline<\/h3>\n<p>The Moonstone stinger was made by generating stills, animating them, then adding smoke transitions. Its title card reads <strong>MOONSTONE / THE LANTERN LAKE<\/strong> — stone, then place, which turns out to be a reusable format for all twelve. Separate from the event lockup: series-stone-year for posters and entry material, stone-place for title cards.<\/p>","x":null},{"i":"index","t":"All pages","c":"Overview","s":"","l":"Every page in this wiki, by section.","h":"<h3>Overview<\/h3>\n<ul class=\"idx\"><li><a href=\"#home\">Twelve Harvests<\/a> <span class=\"tiny\">A pickleball series of twelve monthly gemstone editions, run across Thailand's three real seasons.<\/span><\/li><li><a href=\"#seasons\">The three seasons<\/a> <span class=\"tiny\">Thailand has three seasons of about four months each, which fits twelve editions without forcing anything.<\/span><\/li><li><a href=\"#schedule\">Schedule<\/a> <span class=\"tiny\">Mid-month weekend, every month — always inside the 15th to the 22nd.<\/span><\/li><li><a href=\"#editions-index\">The twelve editions<\/a> <span class=\"tiny\">All twelve stones with their months, colours and places.<\/span><\/li><li><a href=\"#experiences\">Twelve experiences<\/a> <span class=\"tiny\">Each edition needs one thing the others do not have. This is the most commercially important part of the series.<\/span><\/li><li><a href=\"#naming\">Naming rules<\/a> <span class=\"tiny\">One trade name per stone, no colour qualifiers, and the stone is always the event name.<\/span><\/li><\/ul>\n<h3>Editions<\/h3>\n<ul class=\"idx\"><li><a href=\"#kunzite\">Kunzite<\/a> <span class=\"tiny\">March · Summer · The Flowering Scrub<\/span><\/li><li><a href=\"#citrine\">Citrine<\/a> <span class=\"tiny\">April · Summer · The Salt Markets<\/span><\/li><li><a href=\"#ruby\">Ruby<\/a> <span class=\"tiny\">May · Summer · The Ember Valley<\/span><\/li><li><a href=\"#amber\">Amber<\/a> <span class=\"tiny\">June · Summer · The Resin Forest<\/span><\/li><li><a href=\"#peridot\">Peridot<\/a> <span class=\"tiny\">July · Rain · The Terraces<\/span><\/li><li><a href=\"#aquamarine\">Aquamarine<\/a> <span class=\"tiny\">August · Rain · The Shifting Delta<\/span><\/li><li><a href=\"#sapphire\">Sapphire<\/a> <span class=\"tiny\">September · Rain · The Storm Coast<\/span><\/li><li><a href=\"#emerald\">Emerald<\/a> <span class=\"tiny\">October · Rain · The Flooded Basin<\/span><\/li><li><a href=\"#moonstone\">Moonstone<\/a> <span class=\"tiny\">November · Winter · The Lantern Lake<\/span><\/li><li><a href=\"#amethyst\">Amethyst<\/a> <span class=\"tiny\">December · Winter · The Violet Ridges<\/span><\/li><li><a href=\"#zircon\">Zircon<\/a> <span class=\"tiny\">January · Winter · The Frost Peaks<\/span><\/li><li><a href=\"#onyx\">Onyx<\/a> <span class=\"tiny\">February · Winter · The Black Cliffs<\/span><\/li><\/ul>\n<h3>Formats<\/h3>\n<ul class=\"idx\"><li><a href=\"#formats-index\">The four formats<\/a> <span class=\"tiny\">Fixed by position in the season, so every season tests the same four things.<\/span><\/li><li><a href=\"#team-deathmatch\">Team deathmatch<\/a> <span class=\"tiny\">Four players make six pairs, and the pairs are the team's lives.<\/span><\/li><li><a href=\"#rally-length\">Rally-length scoring<\/a> <span class=\"tiny\">The longer the rally you win, the more it is worth. The spectacle format.<\/span><\/li><li><a href=\"#rally-11\">Rally to 11, best of three<\/a> <span class=\"tiny\">The short, fast format. Win by serve at 10–10.<\/span><\/li><li><a href=\"#side-out\">Side-out to 11<\/a> <span class=\"tiny\">Standard, unmodified, and it decides every Crown.<\/span><\/li><li><a href=\"#painite\">Painite<\/a> <span class=\"tiny\">One invitational a year, for that year's podium finishers. Rally length is the damage it does.<\/span><\/li><li><a href=\"#titles\">Titles<\/a> <span class=\"tiny\">Crown, Master, Full Spectrum and the Diamond.<\/span><\/li><\/ul>\n<h3>Kit<\/h3>\n<ul class=\"idx\"><li><a href=\"#earned-access\">Earned access<\/a> <span class=\"tiny\">Apparel cannot be bought. Placing at an edition unlocks that edition's collection.<\/span><\/li><li><a href=\"#the-marks\">The twelve marks<\/a> <span class=\"tiny\">Insignia from facet geometry, not logos. One colour, no sparkle, legible at 15mm.<\/span><\/li><li><a href=\"#medals\">Medals<\/a> <span class=\"tiny\">Real stones set into them, which is also the strongest sponsor conversation in the project.<\/span><\/li><li><a href=\"#production\">Production and the refresh<\/a> <span class=\"tiny\">Print on demand, staggered release, and an annual colourway refresh that is the real ongoing design job.<\/span><\/li><li><a href=\"#the-website\">The website<\/a> <span class=\"tiny\">Collection pages link to results pages. Results are the only place names live.<\/span><\/li><\/ul>\n<h3>World<\/h3>\n<ul class=\"idx\"><li><a href=\"#world\">The world<\/a> <span class=\"tiny\">A fiction built on the same twelve stones. It shares them with the tournament and nothing else.<\/span><\/li><li><a href=\"#spectra\">Spectra<\/a> <span class=\"tiny\">The name of the sport inside the fiction. Never pickleball.<\/span><\/li><li><a href=\"#guardians\">Guardians<\/a> <span class=\"tiny\">The land's accumulated energy and memory, taking form with a raw gem at its heart.<\/span><\/li><li><a href=\"#looms-and-guides\">Looms and Guides<\/a> <span class=\"tiny\">Both weave prediction. One makes a harvest possible; the other talks.<\/span><\/li><li><a href=\"#the-harvest\">The harvest<\/a> <span class=\"tiny\">Touch the stone and a garden opens with a court in it. Win, and two stones form.<\/span><\/li><li><a href=\"#stones\">Stones<\/a> <span class=\"tiny\">A stone cuts itself to whoever receives it. Grade times loyalty sets what it can do.<\/span><\/li><li><a href=\"#weapons\">Weapons and the law<\/a> <span class=\"tiny\">Why a civilisation with gemstone power plays a game instead of fighting.<\/span><\/li><li><a href=\"#the-harvest-economy\">The harvest economy<\/a> <span class=\"tiny\">A closed loop, three parties, and the world's central political fault line.<\/span><\/li><li><a href=\"#the-counting\">The Counting<\/a> <span class=\"tiny\">A twelve-day gathering six hundred years ago. Twelve is just how many were still standing at the end.<\/span><\/li><li><a href=\"#the-unchosen\">The unchosen player<\/a> <span class=\"tiny\">A player no guardian has ever chosen, whose failure is becoming valuable to other people.<\/span><\/li><\/ul>\n<h3>Nations<\/h3>\n<ul class=\"idx\"><li><a href=\"#nations-index\">The twelve nations<\/a> <span class=\"tiny\">Twelve countries, each famous for one stone — and each with a grievance about how that happened.<\/span><\/li><li><a href=\"#kunzite-nation\">Kunzite<\/a> <span class=\"tiny\">The Flowering Scrub<\/span><\/li><li><a href=\"#citrine-nation\">Citrine<\/a> <span class=\"tiny\">The Salt Markets<\/span><\/li><li><a href=\"#ruby-nation\">Ruby<\/a> <span class=\"tiny\">The Ember Valley<\/span><\/li><li><a href=\"#amber-nation\">Amber<\/a> <span class=\"tiny\">The Resin Forest<\/span><\/li><li><a href=\"#peridot-nation\">Peridot<\/a> <span class=\"tiny\">The Terraces<\/span><\/li><li><a href=\"#aquamarine-nation\">Aquamarine<\/a> <span class=\"tiny\">The Shifting Delta<\/span><\/li><li><a href=\"#sapphire-nation\">Sapphire<\/a> <span class=\"tiny\">The Storm Coast<\/span><\/li><li><a href=\"#emerald-nation\">Emerald<\/a> <span class=\"tiny\">The Flooded Basin<\/span><\/li><li><a href=\"#moonstone-nation\">Moonstone<\/a> <span class=\"tiny\">The Lantern Lake<\/span><\/li><li><a href=\"#amethyst-nation\">Amethyst<\/a> <span class=\"tiny\">The Violet Ridges<\/span><\/li><li><a href=\"#zircon-nation\">Zircon<\/a> <span class=\"tiny\">The Frost Peaks<\/span><\/li><li><a href=\"#onyx-nation\">Onyx<\/a> <span class=\"tiny\">The Black Cliffs<\/span><\/li><\/ul>\n<h3>Build<\/h3>\n<ul class=\"idx\"><li><a href=\"#shot-counting\">Shot counting<\/a> <span class=\"tiny\">Four wearables comparing loudness across one court. The test is not how loud, it is how uneven.<\/span><\/li><li><a href=\"#ruled-out\">Approaches ruled out<\/a> <span class=\"tiny\">Recorded with reasons, so the same suggestions do not come back in six months.<\/span><\/li><li><a href=\"#open-items\">Open items<\/a> <span class=\"tiny\">What still needs deciding, roughly in order of urgency.<\/span><\/li><li><a href=\"#prototypes\">Prototypes<\/a> <span class=\"tiny\">Working interfaces, kept as their own pages rather than folded in here.<\/span><\/li><\/ul>\n","x":null}],"search":[{"i":"home","t":"Twelve Harvests","c":"Overview","x":"a pickleball series of twelve monthly gemstone editions, run across thailand's three real seasons.  twelve tournaments a year, one a month. each is its own  edition , named after a gemstone, and the stone sets that month's colour, poster, court dressing, medals and merchandise. main branding stays fixed all year; the edition changes monthly. \n the business problem the whole thing solves:  sell the same tournament twelve times a year and make each one feel like a different event worth coming back for.  the gemstones are the mechanism — the same model fashion uses for seasonal collections and festivals use for editions. what changes monthly is the experience; what never changes is courts, registration, staff, rules and scoring, which is where the money goes. \n if the only difference between  ruby  in may and  sapphire  in september were the poster and the medal colour, players would work that out by the fourth month. so each edition carries one thing the others do not: see  twelve experiences . \n start here \n  the twelve editions  ·  the three seasons  ·  schedule  ·  the four formats  ·  titles  ·  earned access  ·  the world  ·  the twelve nations  \n two separate worlds \n the tournament is real: thailand, real venues, real seasons, real weekends. the fiction built on the same twelve stones is an invented country with its own geography and history. they share the stones and noth"},{"i":"seasons","t":"The three seasons","c":"Overview","x":"thailand has three seasons of about four months each, which fits twelve editions without forcing anything.  thailand has three seasons, not four, and each runs roughly four months. four editions per season, three seasons, twelve editions. \n    season  thai  months  editions    \n  summer  ฤดูร้อน  march – june   kunzite ,  citrine ,  ruby ,  amber   \n  rain  ฤดูฝน  july – october   peridot ,  aquamarine ,  sapphire ,  emerald   \n  winter  ฤดูหนาว  november – february   moonstone ,  amethyst ,  zircon ,  onyx   \n  \n why rain and not monsoon \n summer and winter are what thai speakers already say in english.  rain  replaces the spring of the original draft, because spring corresponds to nothing in thailand while the rains are a third of the year. \n rain beat monsoon for two reasons. monsoon technically names the seasonal wind reversal rather than the wet season, so thailand has both a southwest and a northeast monsoon — the word is less precise than it looks. more practically, much of the field reads english as a second language and many do not know the word. summer, rain and winter are understood by anyone with basic english and sit at the same register. \n the year boundary \n winter spans a calendar year, running november to february. the rules must state explicitly which year a february title belongs to:  onyx  in february closes the preceding year's winter season rather than ope"},{"i":"schedule","t":"Schedule","c":"Overview","x":"mid-month weekend, every month — always inside the 15th to the 22nd.   mid-month weekend, every month.  always somewhere in the 15th to the 22nd. \n the third weekend of any month always falls inside that window, so the rule is checkable against any calendar without counting. &ldquo;third weekend&rdquo; sounds simple until someone has to work out whether a saturday on the 1st counts as the first one. \n three layers, three audiences \n   players see  twelve dates on one page. that page is what gets screenshotted into a group chat, and it is what a sponsor sees when deciding what they are buying. \n  marketing says  mid-month weekend, every month. \n  operations uses  the weekend falling within the 15th to the 22nd.  \n why the middle of the month \n thai public holidays cluster at the start of months — chakri day on 6 april, labour day and coronation day in early may, the 5th and 10th of december, 1 january. the first weekend keeps colliding with them. the last weekend is worse: payday weekend, when people travel home, and some months have five weekends so the date drifts by a fortnight. the second weekend runs into songkran on 13–15 april. the mid-month weekend dodges all of it and gives a clean four-week gap. \n exceptions to plan for \n  november.  loy krathong is set by the full moon and moves every year.  moonstone  is the one month where the stone and the festival genuinely belong"},{"i":"editions-index","t":"The twelve editions","c":"Overview","x":"all twelve stones with their months, colours and places.       stone  month  place      summer · ฤดูร้อน · march – june         kunzite   march  the flowering scrub         citrine   april  the salt markets         ruby   may  the ember valley         amber   june  the resin forest    rain · ฤดูฝน · july – october         peridot   july  the terraces         aquamarine   august  the shifting delta         sapphire   september  the storm coast         emerald   october  the flooded basin    winter · ฤดูหนาว · november – february         moonstone   november  the lantern lake         amethyst   december  the violet ridges         zircon   january  the frost peaks         onyx   february  the black cliffs    \n all single words, no colour qualifiers — see  naming rules . diamond sits outside the twelve as the career award; see  titles . "},{"i":"experiences","t":"Twelve experiences","c":"Overview","x":"each edition needs one thing the others do not have. this is the most commercially important part of the series.  colour is not an experience. if an edition differs from its neighbours only by palette, the series is one tournament with twelve paint jobs and players will notice. \n format is fixed by position in the season, which gives every season the same four-beat shape —  social, spectacle, hard, prestige  — three times a year. the experience amplifies the format rather than fighting it. \n names in quotes below are campaign descriptors,  not  event names. the event is always the stone, and the lockup never changes. separate event names like &ldquo;redline open&rdquo; would break the collection, because the entire value of twelve stones is that they are a set somebody can complete. \n   kunzite  — &ldquo;first bloom&rdquo;  march · team deathmatch  daytime, outdoors, soft lilac everywhere. dress code is pastels. teams are drawn and formed on the day, so nobody arrives committed and everyone meets someone new. the year's first serve, and a team draft that doubles as the social mixer.  \n   citrine  — &ldquo;gold hour&rdquo;  april · rally-length scoring  gold and white, hard bright light, day-festival energy, water everywhere because it is april in thailand and there is no fighting it. the rally counter's loudest outing of the year, and the longest-rally board goes up and stays u"},{"i":"naming","t":"Naming rules","c":"Overview","x":"one trade name per stone, no colour qualifiers, and the stone is always the event name.  all twelve are single words. no colour qualifiers. \n the actual rule: one trade name each \n it is not one stone per mineral.  ruby  and  sapphire  are both corundum.  citrine  and  amethyst  are both quartz.  aquamarine  and  emerald  are both beryl. three doubles, all deliberate. \n what is enforced is that no stone shares a  name  with another. ruby and sapphire share a mineral but not a name, so neither needs a qualifier. yellow sapphire and blue sapphire share a name, so both would. that is the line, and it is why the twelve all sit comfortably as single words. \n stones considered and rejected \n \n  sunstone  — passes the naming rule, but sun and moon in the same twelve is the one pairing a reader clocks instantly and makes the list look assembled. its warm orange is also already covered twice by citrine's gold and amber's honey. \n  tiger's eye and hawk's eye  — two words with a possessive, and both carry &ldquo;eye&rdquo; so they would need qualifiers. chatoyancy is also a  moving  band of light, which cannot be drawn under the flat single-colour rules for  the twelve marks . better used as the tracker's stone: hawk's eye is the unoxidised form and turns gold as the iron rusts, so a new tracker carries blue and it goes gold over a career. \n  heliodor and demantoid  — elegant single words"},{"i":"kunzite","t":"Kunzite","c":"Editions","x":"march · summer · the flowering scrub   \n  month  march  \n  season  summer (ฤดูร้อน)  \n  colour   #d9a3c4   \n  format  team deathmatch  \n  concept  &ldquo;first bloom&rdquo;  \n  in the fiction  the flowering scrub  \n  \n why this stone, this month \n the youngest stone in the calendar, unknown to the trade before 1902, so it still carries associations of beginnings rather than centuries of symbolism. march opens the hot season and the competitive year: first event, first points, everything still available. the palest stone for the month when nothing has been decided. \n as an event \n daytime, outdoors, soft lilac everywhere. dress code is pastels. teams are drawn and formed on the day, so nobody arrives committed and everyone meets someone new. the year's first serve, and a team draft that doubles as the social mixer. \n power on court \n  waking.  the ball accelerates after the bounce. soft off the paddle, fast off the court. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the flowering scrub. &ldquo;nothing's decided yet.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"citrine","t":"Citrine","c":"Editions","x":"april · summer · the salt markets   \n  month  april  \n  season  summer (ฤดูร้อน)  \n  colour   #e0a417   \n  format  rally-length scoring  \n  concept  &ldquo;gold hour&rdquo;  \n  in the fiction  the salt markets  \n  \n why this stone, this month \n the merchant's stone, associated with abundance and the sun. april is songkran, when the country stops for the water festival and the light is at its hardest — and it is the hottest month of the thai year. the most festive month gets the most golden stone, and the edition most likely to draw entrants who have never played the series. \n as an event \n gold and white, hard bright light, day-festival energy, water everywhere because it is april in thailand and there is no fighting it. the rally counter's loudest outing of the year, and the longest-rally board goes up and stays up. \n power on court \n  velocity.  raw speed, flat and immediate. no time to set your feet. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the salt markets. &ldquo;somebody had to pay for it.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"ruby","t":"Ruby","c":"Editions","x":"may · summer · the ember valley   \n  month  may  \n  season  summer (ฤดูร้อน)  \n  colour   #c0202e   \n  format  rally to 11  \n  concept  &ldquo;the furnace&rdquo;  \n  in the fiction  the ember valley  \n  \n why this stone, this month \n the stone of courage and vital heat, called the king of gems for as long as gems have been ranked. may is not the hottest month — april is. may is the month the heat stops being a novelty: weeks of it, no rain yet, nothing left in reserve, and the summer crown still undecided. endurance fits that better than peak temperature ever did. \n as an event \n the event moves to night and leans into the heat. red light, black court dressing, short brutal matches. the hardest physical conditions of the year, framed as a badge rather than apologised for. \n power on court \n  weight.  the ball arrives heavy. it jars the paddle back on contact, regardless of its speed. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the ember valley. &ldquo;we got there first.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"amber","t":"Amber","c":"Editions","x":"june · summer · the resin forest   \n  month  june  \n  season  summer (ฤดูร้อน)  \n  colour   #c97b18   \n  format  side-out · summer crown  \n  concept  &ldquo;the sealing&rdquo;  \n  in the fiction  the resin forest  \n  \n why this stone, this month \n resin that has held its contents for forty million years: the stone of preservation. june is the last heavy month before the rains break, and it closes the summer season. what is won here is the summer crown, and amber suits a title that is kept rather than merely taken. \n as an event \n formal, warm, slower. honey tones, evening light, the first crown of the year decided, medals set with real stones. \n power on court \n  holding.  the ball keeps whatever state it was given. it does not bleed speed, and it resists spin the opponent tries to put on it. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the resin forest. &ldquo;we have the only complete record.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"peridot","t":"Peridot","c":"Editions","x":"july · rain · the terraces   \n  month  july  \n  season  rain (ฤดูฝน)  \n  colour   #9cc441   \n  format  team deathmatch  \n  concept  &ldquo;green season&rdquo;  \n  in the fiction  the terraces  \n  \n why this stone, this month \n a stone of renewal since the egyptians called it the gem of the sun. july is when the rains arrive and the fields turn — khao phansa, and young rice coming up pale and bright. the rains open on the colour of new growth, in the month the growing year begins. \n as an event \n the rains arrive and the event does not hide from them. bright yellow-green, outdoors, wet, messy, team chaos. play continues in the rain, and that is the point. \n power on court \n  compounding.  effects grow across a rally. each exchange adds a little. rewards long points and punishes anyone who cannot end one. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the terraces. &ldquo;the work came first.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"aquamarine","t":"Aquamarine","c":"Editions","x":"august · rain · the shifting delta   \n  month  august  \n  season  rain (ฤดูฝน)  \n  colour   #7fc9c9   \n  format  rally-length scoring  \n  concept  &ldquo;the flood&rdquo;  \n  in the fiction  the shifting delta  \n  \n why this stone, this month \n carried by sailors for safe passage; the name is simply the water of the sea. august is when the rains stop being an event and become the condition. the season has settled into itself. \n as an event \n pale teal, water staging, the wettest-looking event of the year. water as the entire design language: reflective surfaces, poured light, the counter running over it. \n power on court \n  flow.  the ball curves smoothly and visibly in flight, and the player moves the same way. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the shifting delta. &ldquo;we argued our way in.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"sapphire","t":"Sapphire","c":"Editions","x":"september · rain · the storm coast   \n  month  september  \n  season  rain (ฤดูฝน)  \n  colour   #1d5fa8   \n  format  rally to 11  \n  concept  &ldquo;deep blue&rdquo;  \n  in the fiction  the storm coast  \n  \n why this stone, this month \n clarity and judgement, worn by kings and clergy, and thailand's own sapphires come from chanthaburi and kanchanaburi. september is the heaviest rain of the year: wet courts, delays, wind. the deepest stone for the month that tests composure rather than power. \n as an event \n heaviest rain, so it moves indoors and becomes the most formal competitive event of the year. full officiating, line judges, silence between points. this is where you come to be judged properly. \n power on court \n  reading.  not a ball effect. you perceive the opponent's shot earlier than you should. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the storm coast. &ldquo;it was lawful, and i'm tired of being asked.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"emerald","t":"Emerald","c":"Editions","x":"october · rain · the flooded basin   \n  month  october  \n  season  rain (ฤดูฝน)  \n  colour   #0e7a4e   \n  format  side-out · rain crown  \n  concept  &ldquo;the harvest&rdquo;  \n  in the fiction  the flooded basin  \n  \n why this stone, this month \n growth and rebirth in nearly every tradition that has one. october is ok phansa, when the rains stop and the country is at its greenest. the season closes here and the rain crown is decided on the month that shows what the rains were for. \n as an event \n end of the rains, everything green, the second crown decided. deep green, formal. \n power on court \n  cutting.  the ball dies on the bounce. almost no rebound. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the flooded basin. &ldquo;nobody's explained it and we're not going to.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"moonstone","t":"Moonstone","c":"Editions","x":"november · winter · the lantern lake   \n  month  november  \n  season  winter (ฤดูหนาว)  \n  colour   #dce3ec   \n  format  team deathmatch  \n  concept  &ldquo;white night&rdquo;  \n  in the fiction  the lantern lake  \n  \n why this stone, this month \n its glow is light held inside the stone rather than reflected off it. november is loy krathong, when the country floats candles down its rivers under the full moon. winter opens on light carried through darkness. \n as an event \n everyone dresses in white. twilight start running into darkness, lanterns, water, silver light. the social event of the year, and the edition people bring friends to. \n power on court \n  float.  the ball hangs, briefly losing weight in the air. lobs and resets follow from this. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the lantern lake. &ldquo;we weren't competing.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"amethyst","t":"Amethyst","c":"Editions","x":"december · winter · the violet ridges   \n  month  december  \n  season  winter (ฤดูหนาว)  \n  colour   #6b4b9e   \n  format  rally-length scoring  \n  concept  &ldquo;the long night&rdquo;  \n  in the fiction  the violet ridges  \n  \n why this stone, this month \n from the greek for  not drunken : clarity in the middle of celebration, and a bishop's and a royal stone for most of its history. december is thailand's peak season, the year's most crowded month, and likely the largest international field. \n as an event \n peak tourist season and the largest international field. violet and black, night event, music, the biggest crowd of the year. loudest, latest, most watched. \n power on court \n  deception.  the spin is concealed. the ball breaks the opposite way to what the swing showed. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the violet ridges. &ldquo;i never asked for a place.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"zircon","t":"Zircon","c":"Editions","x":"january · winter · the frost peaks   \n  month  january  \n  season  winter (ฤดูหนาว)  \n  colour   #6fb3d9   \n  format  rally to 11  \n  concept  &ldquo;cold open&rdquo;  \n  in the fiction  the frost peaks  \n  \n why this stone, this month \n among the oldest known materials on earth, and thailand sits at the centre of the world's blue zircon trade. january is the coldest and clearest month, when the north genuinely turns cold. a new calendar year, and a stone that has outlasted everything. \n as an event \n the coldest clearest month. early morning start, icy blue and white, technical kit, no decoration. the purest competitive event of the year, stripped back on purpose after december. \n power on court \n  drain.  robs the opponent's pace. a returned zircon ball comes off their paddle slow and heavy. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the frost peaks. &ldquo;the list is illegitimate.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"onyx","t":"Onyx","c":"Editions","x":"february · winter · the black cliffs   \n  month  february  \n  season  winter (ฤดูหนาว)  \n  colour   #2a2a2e   \n  format  side-out · winter crown  \n  concept  &ldquo;the closing&rdquo;  \n  in the fiction  the black cliffs  \n  \n why this stone, this month \n strength and steadiness since greek soldiers carried it into battle. february is the last weekend of the competitive year: the winter crown is decided here, and with it the last chance at a full spectrum. the darkest stone on the final event. \n as an event \n the final event of the competitive year. all black. night finals under lights, the winter crown decided, and with it the full spectrum. the year-end gala. \n power on court \n  the wall.  absorbs force. power shots die against an onyx defence rather than being returned. \n in the fiction the stone's power sets only the  kind  of effect; each player develops their own technique within it. see  stones . \n the kingdom \n the black cliffs. &ldquo;the matter is closed.&rdquo; —  full profile . \n see also \n  the twelve editions  ·  the three seasons  ·  twelve experiences  ·  the twelve marks  "},{"i":"formats-index","t":"The four formats","c":"Formats","x":"fixed by position in the season, so every season tests the same four things.  format is fixed to position in the season rather than to the month. every season runs the same four-beat shape, so a  crown  always means the same thing: winning four different kinds of match, not the same match four times. that is the argument for why a crown is hard. \n    #  format  character  editions    \n  1   team deathmatch   social   kunzite ,  peridot ,  moonstone   \n  2   rally-length scoring   spectacle   citrine ,  aquamarine ,  amethyst   \n  3   rally to 11, best of three   hard   ruby ,  sapphire ,  zircon   \n  4   side-out to 11   prestige   amber ,  emerald ,  onyx   \n  \n why this order \n the social format opens each season, when the field is largest and everyone still has a crown available. the spectacle format lands on songkran and december, the two highest-attendance months. the shortest format lands on may and september, the hottest and the wettest. the traditional format decides every crown, because the season title should be settled on the game serious players consider the real test. \n it also means operations can plan: march, july and november need the most court hours; april, august and december need the counters and camera setup. \n see also:  painite , the annual invitational that fuses two of the four. "},{"i":"team-deathmatch","t":"Team deathmatch","c":"Formats","x":"four players make six pairs, and the pairs are the team's lives.  played at the opening edition of each season:  kunzite ,  peridot ,  moonstone . \n the idea \n four players make a team. those four form  six pairs  — every possible combination. the six pairs are the team's lives. when all six are gone, the team is out. \n with players a, b, c and d the pairs are  ab · ac · ad · bc · bd · cd , so every player appears in exactly three and no pair repeats. \n one strong pair can carry a team a long way. but a team winning through its best pairing is leaning on the same bodies over and over, so depth and fatigue are built into the structure without needing a rule for either. \n lives \n  each pair has four lives.  a pair loses one when it is sided out. side-out scoring throughout. \n  24 lives per team \n 48 side-outs across a full match \n 12 side-outs per individual player — roughly one standard game's worth of serving  \n a pair at zero lives is eliminated and cannot return. \n structure \n each team fields its six pairs against the opposing six, and pairs play in sequence until all six matchups have been contested. surviving pairs are then reordered by their team, and cycles continue until one team has no pairs left. the team with pairs remaining wins. \n the losing pair rotates off and the winner stays on, so a pair on a run is visibly dominant and the rally that finally breaks the streak"},{"i":"rally-length","t":"Rally-length scoring","c":"Formats","x":"the longer the rally you win, the more it is worth. the spectacle format.  played at the second edition of each season:  citrine ,  aquamarine ,  amethyst . \n rally scoring, with points awarded by how long the rally lasted. longer rally won, more points. \n why it must be rally scoring \n under side-out, stalling only costs you your own serve and the payout only applies to the serving team, so the receiving team has no reason to extend anything. rally scoring is the only version where the incentive applies to both sides. \n counting \n  net crossings, not paddle touches.  in live play these are the same number anyway — every shot that stays in play crosses the net exactly once — and crossings are easier to see and harder to dispute. \n  capped.  without a cap, one freak rally decides a match and the rest stops mattering. a cap also removes the reward for extending a rally past the top band, which is where farming would start. \n  staffed.  one dedicated counter per court, calling the number aloud at the end of each rally so both teams hear it before play resumes. testing showed counting in your head and entering it at the rally's end beats clicking during play, because operating a device splits attention away from watching. for a live display, use two people: one watches and calls, one drives the board. \n the counter is the content \n a courtside number climbing through a twenty-cross"},{"i":"rally-11","t":"Rally to 11, best of three","c":"Formats","x":"the short, fast format. win by serve at 10–10.  played at the third edition of each season:  ruby ,  sapphire ,  zircon . \n rally scoring, games to 11, best of three. \n  at 10–10 the game is won by serve.  a receiving team winning the rally scores nothing and only gains serve. this caps game length while keeping tension, which is smarter than win-by-two. \n it lands on the hottest and wettest months of the year by design. may and september both need matches that finish fast. "},{"i":"side-out","t":"Side-out to 11","c":"Formats","x":"standard, unmodified, and it decides every crown.  played at the closing edition of each season:  amber ,  emerald ,  onyx . \n standard side-out scoring, games to 11. no modifications. \n it is the longest and most traditional of the four formats, and it decides every  crown  — because the season title should be settled on the game serious players consider the real test. "},{"i":"painite","t":"Painite","c":"Formats","x":"one invitational a year, for that year's podium finishers. rally length is the damage it does.  painite was for decades the rarest mineral known on earth, with only a handful of specimens in existence. the event sits outside the twelve editions and outside the season structure. one event, once a year. \n the format \n painite fuses the two most distinctive formats in the series:  team deathmatch  and  rally-length scoring . in the monthly editions these are separate events; here they combine into one mechanic. \n  a rally's length is the damage it does.  \n rally scoring throughout: every rally has a loser, and the losing pair takes damage equal to the  exact number of net crossings . one net crossing, one life. a four-crossing rally costs four lives; a twenty-crossing rally costs twenty. no cap, no banding — the number on the counter is the damage. \n why this inverts the problem \n this is the opposite of ordinary rally-length scoring, and it is better. nobody is rewarded for extending a rally — the loser is  punished  for it. \n so a pair unsure of winning wants the rally over quickly, and only extends when confident. there is no reason to stall, no reason to farm length, and no way to game the counter. the pressure sits entirely on the pair that is losing control of the point, and a long rally is genuinely dangerous to both sides while everyone on court watches the number climb. \n"},{"i":"titles","t":"Titles","c":"Formats","x":"crown, master, full spectrum and the diamond.     title  how it is earned    \n  crown  all four editions of one season, in the same year. summer crown, rain crown, winter crown.  \n  master  all four of one season, across any number of years. summer master, rain master, winter master.  \n  full spectrum  all three crowns in a single year.  \n  the diamond  all twelve editions over a career.  \n   painite   one invitational a year, open only to that year's podium finishers. does not count toward the above.  \n  \n crown against master \n crown is dominance in one year. master is mastery over time. because the four editions of a season use four different  formats , either means winning across four different tests — traditional, rally, endurance and team. \n the diamond \n diamond is deliberately  not  one of the twelve. it is the colourless stone that contains every colour, for the player who has taken them all. pulling it out of the rotation is what lets it mean that — spent on a month it would be one edition among twelve. \n a diamond does split white light into spectral colours, which is the &ldquo;fire&rdquo; you see in a cut stone. it is not the most dispersive gem — sphene, demantoid and zircon all disperse more — so do not claim that in copy. the part that matters is true: the stone has no colour of its own yet shows all of them. \n triple crown \n left untouched. it keeps its existin"},{"i":"earned-access","t":"Earned access","c":"Kit","x":"apparel cannot be bought. placing at an edition unlocks that edition's collection.  not membership tiers.  earned unlocks  — winning is the only way in, and different achievements open different doors. two players who have both won can have completely different purchasing access depending on what they accomplished, so what somebody owns becomes a visible record of what they did. \n  every achievement can become a key to something.  \n the four items \n four garments per stone, designed once and produced in twelve colourways. jacket, cap and shirt are settled; the fourth is open. \n what a placing unlocks \n podium placing sets the  metal trim , and every placing unlocks all four items in that metal. \n    placing  access    \n  bronze  all four items, bronze trim  \n  silver  all four items, silver trim  \n  gold  all four items, gold trim  \n  \n this was a deliberate reversal of an earlier draft that withheld items from lower placings. most entrants are not athletes, and if the good pieces are reserved for the top bracket then the majority of people who win something can never own the thing that says so. a bronze at 3.0 and a bronze at open level own the same object: the shared ground is the placing, not the level. \n the division mark \n a small separate mark showing division — 3.0, 3.5, 4.0, open — which marks  the current year's winners only . past winners keep permanent access to the "},{"i":"the-marks","t":"The twelve marks","c":"Kit","x":"insignia from facet geometry, not logos. one colour, no sparkle, legible at 15mm.  insignia, not logos. the reference is military badging: fixed positions, composable, legible at a glance to anyone who knows the system and meaningless to everyone else. a stranger sees a pattern; a player sees exactly which edition somebody won. \n where the geometry comes from \n each mark derives from that stone's  real crystal structure or characteristic cut , seen from directly above or in profile — the flat geometric figure underneath, not a drawing of a gem and not a sparkle. \n this constraint is what makes twelve marks feel inevitable rather than arbitrary, and it produces genuine differentiation for free, because these stones really do have different structures. \n hard constraints \n   one colour on one background.  no gradients, no transparency, no sparkle. colour is carried by the palette elsewhere; the mark must survive in black on white. \n  legible at 15mm embroidered and at two metres printed.  test both before delivering. \n no text, no numerals, no literal gem illustrations. \n consistent optical weight, so no mark disappears next to another.  \n how the twelve separate \n seven are unique by silhouette before any styling decision: \n    stone  structure  distinct because    \n   zircon   tetragonal — a square prism  the only four-fold mark, where almost everything else is six-fold  \n   em"},{"i":"medals","t":"Medals","c":"Kit","x":"real stones set into them, which is also the strongest sponsor conversation in the project.  set an actual gem in each medal. a medal with a real stone does not go in a drawer, and somebody chasing a  crown  is collecting four real gems rather than four discs. \n    tier  stones  cost    \n  cheap and easy  amber, amethyst, onyx, citrine, peridot  a 6–8mm cabochon at bangkok wholesale costs tens of baht  \n  moderate  aquamarine, zircon, moonstone, kunzite  low hundreds of baht in small calibrated sizes  \n  viable with commercial-grade material  ruby, sapphire, emerald  chanthaburi has volume in exactly this  \n  \n two honest approaches where cost bites: real stones for champions with enamel or coloured glass elsewhere on the podium, or lab-created stones stated openly. lab stones are chemically identical and nobody serious objects. \n  this is probably the strongest sponsor conversation available.  a gem house supplying twelve months of stones gets a concrete story rather than a logo on a banner. price it with a chanthaburi setter early. \n six of the twelve — ruby, sapphire, emerald, zircon, moonstone and amethyst — have some claim to นพรัตน์ or thai trade provenance. worth verifying with a thai gemologist, and pitching as  anchored in  the tradition rather than  based on  it. "},{"i":"production","t":"Production and the refresh","c":"Kit","x":"print on demand, staggered release, and an annual colourway refresh that is the real ongoing design job.  print on demand for everything gated \n locked items have tiny populations by design, so holding stock is the worst possible model. make each piece when it is ordered. it costs more per unit and takes longer to arrive, but there is no inventory risk and it allows far more variety than stock economics would. \n stagger the release \n each edition's collection appears in the month of that edition. twelve small launches instead of one enormous one, spreading the work across the year and giving each month a commercial moment. \n the annual refresh \n  this is the ongoing design job.  the champion population only grows, so in a few years there will be hundreds of past winners with permanent access and nothing new to buy. a fresh design each year gives every one of them something, every year, without anybody having to win again — recurring revenue from a group that has already proven it will spend. \n rules for the refresh: same four garments, same twelve  marks , only colourway and detailing change, timed to february so the new range lands with the new season in march. without that constraint, a new designer will want to redesign the garments and the collection stops looking like a collection. \n hire for a retained relationship, not a one-off commission. the system gets built in year "},{"i":"the-website","t":"The website","c":"Kit","x":"collection pages link to results pages. results are the only place names live.   no separate holder list.  a collection page names the events that unlock it and links directly to those results pages. results are the only place names live, and everything else points at them. \n   link explicitly.  if somebody has to search the archive, verification stops being real. \n  keep results urls permanent.  the 2026 page must still work in 2034 at the same address — a hosting decision to make now, not after a rebuild breaks every link. \n  locked pages should be browsable, not hidden.  somebody who has not won onyx should see the onyx collection and be unable to buy it. hiding it removes the aspiration; showing it is the whole incentive.  \n scarcity is knowable in advance \n the calendar does the maths. onyx open is won once a year, forever, which tells somebody what a piece will be worth in ten years rather than just today. make it visible with a line on each collection page —  awarded once per year, to the onyx open champion  — rather than a counter to maintain. \n pdpa \n names appear on results pages, so the entry form needs a specific consent tick: name, division, edition and year may be published on the site. opt-out available with results withheld by request, and separate parental consent for minors, with first name and initial worth considering for under-18s. \n worth a thai lawyer rev"},{"i":"world","t":"The world","c":"World","x":"a fiction built on the same twelve stones. it shares them with the tournament and nothing else.  the tournament and the story are  not the same world . they share the twelve stones and nothing else. \n      the tournament  the story    \n  where  thailand, real  an invented country  \n  seasons  three, real thai ones  whatever the story needs  \n  calendar  twelve editions, one a month  the stones need not sit in months at all  \n  festivals  real thai ones  its own  \n  \n nothing in the story has to line up with the tournament.  ruby  need not be may; there need not be three seasons, or twelve regions, or a neat one-stone-per-month arrangement. the tidiness of the tournament calendar is a decision an organisation made in the real world, not a fact the story has to explain or honour. \n that matters because twelve stones, twelve months and twelve nations all lining up is too neat to believe in a real world. in the tournament it is fine, because somebody chose it. in the story it should not be assumed at all. \n in the fiction \n  spectra  is the sport.  guardians  are what the land becomes.  looms and guides  make a harvest possible,  the harvest  is how a stone is won, and  stones  run everything afterwards.  weapons and the law  explains why anybody plays at all, and  the harvest economy  explains who profits.  the counting  is how twelve nations became the twelve, and  the unchosen p"},{"i":"spectra","t":"Spectra","c":"World","x":"the name of the sport inside the fiction. never pickleball.   spectra is the sport.  inside the world it is the only name used: a spectra court, a spectra player, a spectra match, spectra doubles. \n harvesting uses spectra. a  loom  teaches a  guardian  the rules of spectra, and the harvesters defeat it in a spectra doubles match. the twelve stone powers are part of spectra play, not additions to it. \n  never write &ldquo;pickleball&rdquo; in the fiction  — not in narration, not in dialogue, not as an aside explaining what spectra resembles. the word does not exist in that world, and a reader will understand what they are looking at without being told. \n the real-world series is a pickleball series. that is a fact about the business, not about the world. \n what the game actually is \n the constitution is tiny:  two sides, divided by something, and one bounce.  \n everything else is whatever the garden gives you — see  the harvest . that is also exactly the right amount of invariant to cover tennis, padel and pickleball, because those three already only share about that much. everything that distinguishes them is court furniture. \n there is a real precedent, which makes it feel researched rather than invented: every surviving real tennis court is different. hampton court and falkland palace are not the same dimensions, the penthouses and tambours vary by venue, and the game accomm"},{"i":"guardians","t":"Guardians","c":"World","x":"the land's accumulated energy and memory, taking form with a raw gem at its heart.  the world builds up energy. sometimes it erupts as a volcano; sometimes it becomes a  guardian  — the land's accumulated energy and memory taking form, with a raw gem at its heart. memory gives it its shape and style; energy gives it its strength. \n a guardian is not a species and cannot be driven extinct by losing a single harvest. if one is lost, the land can eventually build enough energy to form another. \n mirroring is intrinsic \n a guardian mirrors what it is shown. this exists before any  loom  and cannot be removed. attack one and it mirrors the violence, releasing everything at once like a volcano —  weapons never work on guardians.  play with one and it plays back. \n an altered or illegal loom can teach different rules, but it cannot remove mirroring. teach a guardian a different game and it plays that game back; teach it to fight and it fights back. which is why changing the rules is no easy route to overpowering them. \n animal forms, and the moral engine \n guardians take the shapes of creatures from their own land.  this is the world's moral engine and must be kept.  \n what the land remembers depends on what actually lives there. as animals and environments disappear, the guardian forms associated with them grow rarer, then stop appearing altogether.  a form lost from the wild is even"},{"i":"looms-and-guides","t":"Looms and Guides","c":"World","x":"both weave prediction. one makes a harvest possible; the other talks.  both weave prediction. the loom weaves memory and energy into form; the guide weaves words. they work on the same principle — guessing what comes next — and this shared basis is deliberate. they are one family of craft, not two unrelated inventions. \n both are built by skilled makers in workshops, from many empty  stones . they look woven and handmade, closer to craft than to machines. \n the loom \n set up near a wild  guardian , it gives the guardian a body and teaches it the rules. it guesses the guardian's next move from the land's memory, which is why guardians have tendencies players can learn to read. \n a loom does  not  create two guardians. it gives one guardian  two projected bodies  so it can play doubles. both are expressions of the same being, sharing energy and memory. \n a loom is built with stones from the land it harvests in, so a ruby loom works on ruby guardians — and a ruby loom cannot raise a lake shore. device quality matters: cheap or damaged looms teach the rules badly, which makes cracking a forming gem far more likely. \n  the loom does not own the court.  its job is the guardian; the garden comes from the stone and the land, and nobody made it. so the houses own the looms but not the court. nobody owns the court, and it is the only limit on them — see  the harvest economy . \n the guide"},{"i":"the-harvest","t":"The harvest","c":"World","x":"touch the stone and a garden opens with a court in it. win, and two stones form.  touch the gem and the energy that has been building there lets go, and what it makes is a  garden with a court in it . it is the same pressure that makes a volcano, released the other way: volcano or garden. \n it will probably look like the land around it, because the energy came from there. the exception is the interesting part: the land remembers further back than whatever is currently growing on it, so a harvest in dry scrub that opens into wetland is showing you what that ground used to be. spawn a garden full of creatures nobody has seen alive and you are standing in a landscape that is gone, for as long as the harvest lasts. \n that gives scholars and conservationists a reason to care about harvests that has nothing to do with money, and it makes the strange ones valuable — most harvests give a slightly heightened version of where you are standing, and occasionally one opens somewhere else entirely. \n what you know walking in \n  two sides, divided by something. one bounce.  that is the whole constitution. \n everything else is whatever the garden gives you: what the divider is made of, how tall it stands, whether it has gaps, where out begins and how gradually, how big the court is, whether there are walls, how the score works, when it stops. \n out is not a line but a  gradient  — where the gr"},{"i":"stones","t":"Stones","c":"World","x":"a stone cuts itself to whoever receives it. grade times loyalty sets what it can do.  a stone cuts itself to whoever receives it, so no two are ever alike. the stone brings its origin, grade and inclusions; the person brings the cut, and a stone can re-cut if its owner changes deeply. \n cuts shape power: a brilliant cut scatters it into many small effects, a step cut is precise and direct, a cabochon is steady and long-lasting. inclusions give each stone one quirk no other stone has. grades run from cloudy to flawless. \n      guardian stone  empty stone    \n  holds a guardian  yes  no  \n  power  full  raw only  \n  unique technique  yes  no  \n  can reach flawless  yes  no  \n  main uses  competing  industry, feeding other stones, cheaper play  \n  \n powers \n the stone type sets the  kind  of power; each player develops their own technique. conditions a player sets on themselves make a technique stronger — the harder the condition, the stronger the power. flawless is the peak: player and stone in perfect sync, and the guardian emerges on court. short, and costly. \n  power always goes through the ball, never at a person.  see  weapons and the law . \n grade and loyalty \n real power is grade times a percentage, and the percentage is a ceiling familiarity has to earn. a stone gives everything to the hand that won and selected it, less to any other hand, and least when it is not selecte"},{"i":"weapons","t":"Weapons and the law","c":"World","x":"why a civilisation with gemstone power plays a game instead of fighting.   a body releases only a little of a stone's power. a weapon releases all of it. the weakest person with a stone weapon beats the strongest stone holder. always.  \n all stone weapons are lethal. there are no tiers. \n grade, loyalty, guardian stones, empty stones — none of it scales a weapon's output. a weapon is a weapon, the way a gun is a gun. any stone in a weapon kills anyone holding a stone in their hand. \n this is deliberate. weapons are a  sealed door, not a back room : \n  no weapon-versus-weapon matchups, because that would rebuild the combat system the rule exists to prevent. \n no interesting armed encounters. armed encounters are simply over. \n no arms race, no weapon techniques, no weapon-grade market.  \n weapons should be boring. their entire narrative function is to be the thing that is not allowed, so that power has nowhere to go but the court. \n the central logic \n this chain explains why a civilisation with gemstone power plays  spectra . it should be legible in the world without being lectured about. \n   gemstones create power. weapons make that power dangerous. law controls weapons. spectra gives people a legal way to use and compete with power.   \n it holds because of the rule that sits under everything:  power affects play, never players.  \n stone powers act on the ball and the play aro"},{"i":"the-harvest-economy","t":"The harvest economy","c":"World","x":"a closed loop, three parties, and the world's central political fault line.  the closed loop \n harvests produce empty stones. makers consume empty stones to build  looms . looms make harvests possible. \n the system eats its own output, which means demand never ends and whoever controls looms controls access to everything. \n three parties to every harvest \n  the landowner.  guardians form where they form. private land means the landowner decides whether a harvest happens at all, and takes a share. \n  the house.  looms are land-specific — a ruby loom only works on ruby guardians — so each of the twelve lands has its own workshops, makers and loom tradition. these are the houses. they own the looms, employ the trackers, and hold the relationships with landowners. \n  the harvesters.  two living players. they take all the physical risk and are the only people who can complete the work. \n the standard contract \n  the house takes the empty stone. the harvesters keep the guardian stone.  \n this is elegant because it matches the harvest exactly — one guardian stone, one empty stone, and the house needs empty stones to build more looms. it is also brutal, because nobody knows which partner will be chosen until it is over. the chosen partner walks away with a guardian; the other walks away with nothing. \n variations exist: cheaper houses on worse land take a smaller share, some let harves"},{"i":"the-counting","t":"The Counting","c":"World","x":"a twelve-day gathering six hundred years ago. twelve is just how many were still standing at the end.  before the counting nobody agrees how many stones mattered.  amber 's records say nine.  sapphire 's say fourteen. a fragment kept in  emerald  lists seventeen, and three of those names mean nothing to anyone now. \n what is agreed: there was a gathering, it lasted twelve days, and at the end of it there was a list. \n sapphire convened it and wrote the record — which is why the record is in sapphire's hand, and why nobody entirely trusts it.  citrine  paid for it, which citrine has never stopped mentioning and nobody else has ever stopped resenting. the delegations stayed in  amethyst , because delegations always stay in amethyst. \n  nobody set out to found twelve.  twelve is just how many kingdoms were still standing at the end of it with a stone and a player. \n years are counted from the counting. it is now the six hundred and forty-first — except in  zircon , which does not date its years from it and will tell you which year it actually is. \n what each one did \n     kunzite   sent a different delegation on each of the twelve days.     citrine   funded the counting and has never let anyone forget. the word for sponsor in three kingdoms is a citrine loanword.     ruby   arrived first, and has mentioned it every year since.     amber   kept the only complete record of all twelv"},{"i":"the-unchosen","t":"The unchosen player","c":"World","x":"a player no guardian has ever chosen, whose failure is becoming valuable to other people.   every gem chooses someone. never him.  \n by every rule he should have been chosen, many times over. he never is. he owns a bag of empty stones and not one guardian. \n every partner he has harvested with received the guardian instead, and all of them became top harvesters. none of them practise with him now. \n how the pattern develops \n at first people simply see him as unlucky or weak. as the number of harvests grows, the pattern becomes statistically and socially remarkable and difficult to dismiss. \n then it becomes  valuable . players may actively want him as a harvesting partner, because partnering with him seems to guarantee the guardian will choose them. his failure becomes economically valuable to other people — which gives some of them a reason not to want him to improve, or to discover why guardians refuse him. \n his reputation develops along a line:  unlucky → joke → superstition → valuable partner → anomaly.  \n the mystery should stay one \n why guardians refuse him is the central mystery, and it should not be documented. \n the lesson is tolkien's. explanation does not just reveal machinery, it changes the register — &ldquo;servant of the secret fire&rdquo; is liturgy, and the same facts restated as an org chart are unusable. tolkien's own depth is historical and linguistic rat"},{"i":"nations-index","t":"The twelve nations","c":"Nations","x":"twelve countries, each famous for one stone — and each with a grievance about how that happened.  twelve countries with their own borders, histories and governments. not regions of one state, and not twelve tribes of one people. \n  but the number twelve belongs to the stones, not to the map.  there are more than twelve countries. twelve stones became economically indispensable and twelve nations became famous for producing them — two separate facts that happen to produce the same number, the way &ldquo;the oil states&rdquo; is a real category without meaning there are exactly as many oil states as uses for oil. \n   there are other countries.  places with no significant deposit, which buy everything they use. most of the world lives in them. \n  the fit is imperfect.  some of the twelve produce two or three stones. some share a deposit that straddles a border, which is permanent trouble. \n  deposits follow geology, not borders.  nobody drew these lines around the stones. the stones were already there, and the nations grew where the wealth was or conquered their way to it. \n  the twelve are not equals.  some are large and old, some small and rich only because of what lies under them. nothing requires them to be balanced.  \n they became the twelve at  the counting . \n      nation  they say           kunzite  the flowering scrub   &ldquo;nothing's decided yet.&rdquo;         citrine"},{"i":"kunzite-nation","t":"Kunzite","c":"Nations","x":"the flowering scrub  &ldquo;nothing's decided yet.&rdquo; \n  \n  stone   kunzite   \n  power   waking  — the ball accelerates after the bounce. soft off the paddle, fast off the court.  \n  coaching tradition   mf-ne/fi-cp/s(b) · energy dominant   \n  \n at the counting \n sent a different delegatio
