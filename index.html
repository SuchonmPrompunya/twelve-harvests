n on each of the twelve days. see  the counting . \n what forced it \n a land that flowers violently for a few weeks and is brown the rest of the year. nothing here rewards a long plan, because the conditions never hold long enough for one to pay off. seed stock is speculative by nature: you back next season's crop before you know what next season is. boom and bust, over and over, until improvisation became the only sane posture. \n the country \n  \n  terrain  dry scrub plain that floods with flowers for a few weeks a year, then goes brown again.  \n  livelihood  seed-growing and nurseries. they start what everyone else transplants.  \n  governance  annual councils that dissolve every year. nothing is permanent by design.  \n  belief  everything is owed a beginning. nothing is judged by its first year.  \n  built form  nothing finished. buildings half-raised, repurposed, abandoned when the idea moves on. no monuments, because a monument is a commitment.  \n  the house  many tiny houses, constantly failing and reforming. cheapest entry in the country, highest churn.  \n  reputation  naive. promising."},{"i":"citrine-nation","t":"Citrine","c":"Nations","x":"the salt markets  &ldquo;somebody had to pay for it.&rdquo; \n  \n  stone   citrine   \n  power   velocity  — raw speed, flat and immediate. no time to set your feet.  \n  coaching tradition   mm-te/se-pb/s(c) · energy dominant   \n  \n at the counting \n funded the counting and has never let anyone forget. the word for sponsor in three kingdoms is a citrine loanword. see  the counting . \n what forced it \n salt flats and no shade. nothing grows, so everything must be bought, which means everything must first be sold. a nation that cannot feed itself becomes a nation that trades or dies, and centuries of that make the ledger the only moral document. \n the country \n  \n  terrain  open salt flats and sun-baked market towns. glare off white ground, no shade anywhere.  \n  livelihood  trade, markets, money. they store sunlight in stones and sell light and heat.  \n  governance  merchant guilds. wealth votes.  \n  belief  light is borrowed and must be repaid. debt is sacred.  \n  built form  warehouses, market halls, weighbridges. everything scaled for volume and stripped of ornament, because ornament is not load-bearing.  \n  the house  openly commercial. harvest rights are auctioned to the highest bidder. the most transparent house in the country and the most brutal.  \n  reputation  dazzling and greedy. everything has a price.  \n  fear  a market that stops. being poor again.  \n  guardians  gold"},{"i":"ruby-nation","t":"Ruby","c":"Nations","x":"the ember valley  &ldquo;we got there first.&rdquo; \n  \n  stone   ruby   \n  power   weight  — the ball arrives heavy. it jars the paddle back on contact, regardless of its speed.  \n  coaching tradition   mm-si/te-bs/c(p) · info dominant   \n  \n at the counting \n arrived first, and has mentioned it every year since. see  the counting . \n what forced it \n volcanic ground, warm underfoot, and a fuel supply that made smelting possible before anyone else could manage it. a monopoly held long enough stops being an advantage and becomes an identity. when the method is the whole national wealth, changing the method is treason with extra steps. \n the country \n  \n  terrain  a volcanic valley of black rock. the ground is warm underfoot. old lava fields, deep mines.  \n  livelihood  forges, smelting, metalwork, gem cutting.  \n  governance  one forge-master's line, inherited.  \n  belief  what is made in fire is true. endurance sanctifies.  \n  built form  heavy, unchanged, blackened. forges built on the footprint of older forges. nothing has been redesigned in living memory and nobody considers this a problem.  \n  the house  one old hereditary house. arrogant, and makes the best looms in the country.  \n  reputation  proud, hot-tempered, and the best in the world at one thing.  \n  fear  cold forges. being surpassed.  \n  guardians  gaur and water buffalo — heavy animals. near-veneration.  \n  fes"},{"i":"amber-nation","t":"Amber","c":"Nations","x":"the resin forest  &ldquo;we have the only complete record.&rdquo; \n  \n  stone   amber   \n  power   holding  — the ball keeps whatever state it was given. it does not bleed speed, and it resists spin the opponent tries to put on it.  \n  coaching tradition   ff-si/ti-sc/b(p) · info dominant   \n  \n at the counting \n kept the only complete record of all twelve days, and has never let anyone read it. see  the counting . \n what forced it \n slow-growing forest where the resource takes generations to mature. you cannot rush amber and you cannot plant your way out of a bad decade. a nation whose wealth arrives on a hundred-year cycle learns to think in hundred-year terms, and to write everything down because the person who needs the information has not been born yet. \n the country \n  \n  terrain  dry deciduous forest of very old trees. resin, slow growth, deep shade.  \n  livelihood  preservation — curing, drying, storing — and making the guides, which take amber cores.  \n  governance  a council of elders. the oldest decide, and slowly.  \n  belief  nothing that is kept is truly lost.  \n  built form  deep interiors. storehouses, archives, cold rooms, everything labelled and nothing discarded. the buildings go downward and backward rather than upward.  \n  the house  makers rather than owners. they build looms and guides for all twelve lands, which gives them leverage over everyone.  \n  repu"},{"i":"peridot-nation","t":"Peridot","c":"Nations","x":"the terraces  &ldquo;the work came first.&rdquo; \n  \n  stone   peridot   \n  power   compounding  — effects grow across a rally. each exchange adds a little. rewards long points and punishes anyone who cannot end one.  \n  coaching tradition   fm-fe/si-bp/s(c) · energy dominant   \n  \n at the counting \n sent farmers, because it was planting season and the fields don't wait for a gathering. they nearly didn't make the list. bring it up and watch what happens. see  the counting . \n what forced it \n terraced irrigation. one channel serves many fields, and a terrace above you can ruin a terrace below you without meaning to. cooperation here is not a value, it is hydraulics — the physical layout makes unilateral action impossible, so consensus became the only functioning technology. \n the country \n  \n  terrain  terraced river valleys, flooded green for half the year.  \n  livelihood  rice, at national scale. the country's grain.  \n  governance  watershed assemblies. everyone who shares water has a vote.  \n  belief  what grows slowly grows right. patience is the only real strength.  \n  built form  communal and terraced. shared halls, shared channels, everything built by many hands over many seasons. few private structures of any size.  \n  the house  a cooperative. harvesters hold shares. the only land where harvesters have real power.  \n  reputation  dull, patient, and much richer than t"},{"i":"aquamarine-nation","t":"Aquamarine","c":"Nations","x":"the shifting delta  &ldquo;we argued our way in.&rdquo; \n  \n  stone   aquamarine   \n  power   flow  — the ball curves smoothly and visibly in flight, and the player moves the same way.  \n  coaching tradition   mf-se/ti-cp/s(b) · energy dominant   \n  \n at the counting \n arrived four days late because the channels moved, argued for a day and a half, and got on anyway. see  the counting . \n what forced it \n a delta whose channels move. a village sited correctly this decade is stranded the next, and a chart is out of date before it is finished. permanence is a bet on geography that the geography keeps winning, so nobody takes it. what survives is knowledge held in a person rather than written down. \n the country \n  \n  terrain  a braided delta of shifting channels. villages float and move.  \n  livelihood  shipping and river piloting. they move everything everyone else produces.  \n  governance  no fixed capital. authority travels with the convoys, held by the pilots' guild.  \n  belief  water finds a way. resistance is a failure of imagination.  \n  built form  almost nothing permanent. floating villages, boats, structures that can be moved before the channel shifts.  \n  the house  mobile houses on boats. hard to regulate, harder to tax.  \n  reputation  charming and slippery. never where you left them.  \n  fear  still water. a closed channel. being stuck.  \n  guardians  otters and rive"},{"i":"sapphire-nation","t":"Sapphire","c":"Nations","x":"the storm coast  &ldquo;it was lawful, and i'm tired of being asked.&rdquo; \n  \n  stone   sapphire   \n  power   reading  — not a ball effect. you perceive the opponent's shot earlier than you should.  \n  coaching tradition   ff-ti/ni-sc/b(p) · info dominant   \n  \n at the counting \n convened the gathering, kept the minutes, and is still being accused of it. the record is in sapphire's hand, which is why nobody entirely trusts it. see  the counting . \n what forced it \n deep harbours on a storm coast, which made it the place where foreign ships had to shelter and foreign disputes had to be settled. a nation that adjudicates other people's quarrels for a living cannot afford to be seen taking sides, so procedure became the export and impartiality became the product. \n the country \n  \n  terrain  storm coast with deep natural harbours. the wettest place in the country.  \n  livelihood  law and water. they supply the country's judges and its clean water.  \n  governance  magistrates appointed by examination. the most formal government in the country.  \n  belief  clear judgement is a duty, not a gift.  \n  built form  formal, geometric, stone, built to a plan that was argued over for a decade. every public building states its purpose in its shape.  \n  the house  licensed, audited, heavily regulated. the fairest house and the slowest.  \n  reputation  incorruptible, sanctimonious, no sense "},{"i":"emerald-nation","t":"Emerald","c":"Nations","x":"the flooded basin  &ldquo;nobody's explained it and we're not going to.&rdquo; \n  \n  stone   emerald   \n  power   cutting  — the ball dies on the bounce. almost no rebound.  \n  coaching tradition   fm-te/ni-bs/c(p) · info dominant   \n  \n at the counting \n attended as physicians, not as players. nobody can explain how they ended up on the list, and emerald has never offered. see  the counting . \n what forced it \n a flooded basin where everything grows, including the diseases. endemic fever made medicine a survival trade rather than a profession, and centuries of treating more patients than there were physicians made triage the national habit of mind — applied to everything, not only to the sick. \n the country \n  \n  terrain  a flooded jungle basin. dense, tangled, everything grows over everything.  \n  livelihood  medicine, herbs, surgery.  \n  governance  the physicians' college holds civic authority.  \n  belief  cutting is care. what is removed lets the rest live.  \n  built form  wards, teaching halls, dispensaries. functional, but designed around a purpose measured in decades rather than in use.  \n  the house  controlled by the physicians' college. you need a qualification to harvest.  \n  reputation  cold and necessary. they decide who lives.  \n  fear  cutting the wrong thing.  \n  guardians  pythons, civets, forest cats. harvested clinically.  \n  festival  the cutting. harvest d"},{"i":"moonstone-nation","t":"Moonstone","c":"Nations","x":"the lantern lake  &ldquo;we weren't competing.&rdquo; \n  \n  stone   moonstone   \n  power   float  — the ball hangs, briefly losing weight in the air. lobs and resets follow from this.  \n  coaching tradition   ff-ni/fe-bp/s(c) · energy dominant   \n  \n at the counting \n attended as a rite rather than a contest and did not appear to be competing at any point. they are on the list. see  the counting . \n what forced it \n a caldera lake under near-permanent mist, where for half the year you cannot see the far shore. light was not decoration but infrastructure, and lamp-keeping was a public duty before it was a religious one. a society that must coordinate in poor visibility develops ritual, because ritual is how you know what everyone else is doing without being able to see them. \n the country \n  \n  terrain  a high lake in an old caldera, usually under mist. formally adularia; everyone calls it the lantern lake.  \n  livelihood  lamps, lighting, glass. night work of every kind.  \n  governance  a lay order that keeps the lamps. religious and civil at once.  \n  belief  light must be carried through the dark. no one should walk at night alone.  \n  built form  everything shaped for meaning and for being seen together after dark. lamps set into walls, courtyards oriented on the lake, structures whose function is to be looked at from across the water.  \n  the house  the lamp order owns the "},{"i":"amethyst-nation","t":"Amethyst","c":"Nations","x":"the violet ridges  &ldquo;i never asked for a place.&rdquo; \n  \n  stone   amethyst   \n  power   deception  — the spin is concealed. the ball breaks the opposite way to what the swing showed.  \n  coaching tradition   ff-fe/ni-bp/c(s) · info dominant   \n  \n at the counting \n hosted every delegation and argued for nothing. nobody can recall amethyst asking for a place. amethyst has a place. see  the counting . \n what forced it \n cloud forest ridges with no defensible border and nothing worth invading for. survival came from being useful to everyone and threatening to no one, which over centuries became a deliberate industry: neutrality, discretion, and a place where rivals could both stay without meeting. opacity is not a character flaw here, it is the national defence. \n the country \n  \n  terrain  cloud forest ridges. long violet dusks that last an hour.  \n  livelihood  hospitality. rest-houses, entertainment, recovery. the country goes there to stop.  \n  governance  a decorative court with a figurehead. real power sits wherever the houses are, and nobody is certain where that is.  \n  belief  rest is sacred. a mind must be allowed to close.  \n  built form  rest-houses, screens, layered interiors, approaches that turn twice before arriving. nothing displays its ownership and nothing is built to be understood from outside.  \n  the house  ownership is opaque. nobody is certain who h"},{"i":"zircon-nation","t":"Zircon","c":"Nations","x":"the frost peaks  &ldquo;the list is illegitimate.&rdquo; \n  \n  stone   zircon   \n  power   drain  — robs the opponent's pace. a returned zircon ball comes off their paddle slow and heavy.  \n  coaching tradition   fm-si/fi-sc/p(b) · energy dominant   \n  \n at the counting \n did not come. was listed anyway — in absentia, by a show of hands, on the eleventh day. has never acknowledged the list, does not date its years from it, and will tell you which year it actually is if you ask. see  the counting . \n what forced it \n a six-week growing season at altitude. getting it wrong once kills people, and there is no second attempt within the same year. caution was rewarded for a thousand years until it became law, then custom, then simply correct. outsiders were historically a net drain in a place with no surplus, and the closure long outlived the scarcity that justified it. \n the country \n  \n  terrain  the highest peaks. frost, thin air, bare rock, the oldest ground in the country.  \n  livelihood  cold storage, and mining the oldest stone. amber keeps things shelf-stable; zircon keeps them fresh.  \n  governance  clan heads and precedent. the most conservative place in the country.  \n  belief  the land is older than all of us. we are guests on it.  \n  built form  stone cut into the mountain, unchanged for centuries. thick walls, small openings, buildings that assume the weather will win e"},{"i":"onyx-nation","t":"Onyx","c":"Nations","x":"the black cliffs  &ldquo;the matter is closed.&rdquo; \n  \n  stone   onyx   \n  power   the wall  — absorbs force. power shots die against an onyx defence rather than being returned.  \n  coaching tradition   mm-te/si-bs/c(p) · info dominant   \n  \n at the counting \n arrived on the appointed day, in formation, and considers the matter closed. see  the counting . \n what forced it \n the only pass into the north. a nation that exists because of a chokepoint is a nation permanently organised around holding it, and everything else — law, labour, architecture, the calendar — was subordinated to that one job centuries ago. nobody decided this. geography decided it and the institutions caught up. \n the country \n  \n  terrain  black cliffs above the only pass in or out of the north.  \n  livelihood  stone and construction. they build everything that must not fall.  \n  governance  garrison command. military and civic authority are the same office.  \n  belief  hold the line. there is always something behind you worth standing for.  \n  built form  fortification and standard. every wall to specification, every structure carrying the name of who built it. the architecture is a record of accountability.  \n  the house  state-owned. the garrison controls every loom.  \n  reputation  rigid, dependable, joyless.  \n  fear  the line breaking. being the last defence that failed.  \n  guardians  bears and bi"},{"i":"shot-counting","t":"Shot counting","c":"Build","x":"four wearables comparing loudness across one court. the test is not how loud, it is how uneven.   rally-length scoring  needs a shot count during the rally, on a display. in live play net crossings and shots are the same number — every shot that stays in play crosses the net exactly once — so counting shots gives the crossing count directly. \n year one: a human counter \n one dedicated counter per court, keeping the count in their head and entering it at the end of each rally. testing showed clicking during a rally is harder than counting in your head, because operating a device splits attention away from watching. for a live display, use two people: one watches and calls the count aloud, one drives the display — speaking is closer to automatic than clicking. \n  record audio and video from every court throughout year one.  the human counts become labelled ground truth for the automated system. \n the automated design \n four wearable sensors, one per player. each is an esp32 with a mems microphone and a radio. \n  each sensor listens continuously through its own mic. \n a sound passing the filters triggers a reading:  peak loudness plus a timestamp.  \n that number is broadcast — not audio, just a value and a time. \n readings arriving within the same short window (30–50ms) are grouped as one event. \n  compare the four readings.  one much louder than the other three means a player on "},{"i":"ruled-out","t":"Approaches ruled out","c":"Build","x":"recorded with reasons, so the same suggestions do not come back in six months.  every one of these was considered seriously and failed for a specific reason. recorded so the reasoning is not relitigated. \n    approach  why not    \n   radar   a hollow plastic ball with holes gives almost no radio return — plastic is nearly transparent to radio waves, and the holes make it partly air. ruled out on physics, not difficulty.  \n   instrumented ball   cannot distinguish a paddle hit from a floor bounce, and pickleball's two-bounce rule makes bounces constant. this was the decisive objection.  \n   paddle-mounted accelerometer   tried, and did not work well.  \n   wrist accelerometer   would give physical isolation from adjacent courts, since vibration does not travel through air — but it detects the swing far better than the contact, and the approach was ruled out by earlier testing.  \n   pose estimation alone   counts swings, which players could fake. unusable when the count decides the match.  \n   audio without the ratio test   defeated by adjacent courts, crowd noise, and the wide gap between muted and loud paddles. quiet paddles are engineered to remove the sharp transient the detector depends on.  \n   shotgun microphone   directionality depends on wavelength, so a shotgun mic is nearly omnidirectional below 500hz and a paddle strike has energy across that range. and a narrow cone c"},{"i":"open-items","t":"Open items","c":"Build","x":"what still needs deciding, roughly in order of urgency.  before anything else is printed \n   trademark clearance  in class 41 (sporting and cultural events) at the thai dip, and ideally eu and us. a web search is not a trademark search, and thailand's register is poorly indexed. budget for a thai trademark agent. \n  verify the dates  for the launch year against a calendar. \n  the winter year boundary  — state explicitly in the rules which calendar year a february title belongs to.  \n format \n   the  team deathmatch  rotation trigger.  the biggest open question in the formats, and one stopwatch settles it. \n matchup selection, the time-limit tiebreak, and whether teams are fixed across a season. \n  the  painite  life count , which needs measuring from real rally lengths at the highest level available.  \n products \n   the fourth garment.  jacket, cap and shirt are settled. \n  the unlock architecture above the edition layer  — season, crown, master, full spectrum and diamond collections are a framework, not a decision. see  earned access . \n  whether an open catalogue exists  for spectators, families and non-winning entrants — or whether entering is itself the first gate, which would make the collection meaningful while still giving every entrant something to buy. \n  retroactive purchase.  can a past champion buy that year's design, marked, later? a limited window seems right, or "},{"i":"prototypes","t":"Prototypes","c":"Build","x":"working interfaces, kept as their own pages rather than folded in here.  these are live interfaces rather than documents, so they live as their own pages — a reference wiki would <script>
(function(){
  var D = JSON.parse(document.getElementById("data").textContent);
  var BY = {}; D.arts.forEach(function(a){ BY[a.i] = a; });
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");
  var q = document.getElementById("q");

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function buildNav(filter){
    var f = (filter || "").trim().toLowerCase();
    var html = "", any = false;
    D.cats.forEach(function(c){
      var items = D.arts.filter(function(a){
        if (a.c !== c || a.i === "index") return false;
        if (!f) return true;
        return (a.t + " " + a.s).toLowerCase().indexOf(f) !== -1;
      });
      if (!items.length) return;
      any = true;
      html += '<div class="cat">' + esc(c) + "</div><ul>";
      items.forEach(function(a){
        html += '<li><a href="#' + a.i + '">' +
          (a.x ? '<span class="sw" style="background:' + esc(a.x) + '"></span>' : "") +
          esc(a.t) + "</a></li>";
      });
      html += "</ul>";
    });
    if (!any) html = '<div class="none">No pages match.</div>';
    nav.innerHTML = html;
    mark();
  }

  function mark(){
    var id = cur();
    Array.prototype.forEach.call(nav.querySelectorAll("a"), function(a){
      if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function wrapTables(){
    Array.prototype.forEach.call(main.querySelectorAll("table"), function(t){
      if (t.parentNode && t.parentNode.className === "table-wrap") return;
      var d = document.createElement("div");
      d.className = "table-wrap";
      t.parentNode.insertBefore(d, t);
      d.appendChild(t);
    });
  }

  function render(id){
    var a = BY[id] || BY.home;
    main.innerHTML =
      '<div class="crumb">' + esc(a.c) + (a.s ? " · " + esc(a.s) : "") + "</div>" +
      "<h1>" + (a.x ? '<span class="sw" style="background:' + esc(a.x) + '"></span>' : "") + esc(a.t) + "</h1>" +
      '<p class="lead">' + a.l + "</p>" + a.h +
      "<footer>Twelve stones. Three seasons. One year.</footer>";
    wrapTables();
    mark();
  }

  function search(term){
    var f = term.trim().toLowerCase();
    if (f.length < 2) return false;
    var hits = D.search.map(function(s){
      var score = 0;
      if (s.t.toLowerCase().indexOf(f) !== -1) score += 100;
      var k = s.x.indexOf(f);
      if (k !== -1) score += 20;
      return score ? { s: s, score: score } : null;
    }).filter(Boolean).sort(function(a, b){ return b.score - a.score; }).slice(0, 30);

    var html = '<div class="crumb">Search</div><h1>' + esc(term) + "</h1>" +
      '<p class="lead">' + hits.length + " page" + (hits.length === 1 ? "" : "s") + " found.</p>";
    if (hits.length) {
      html += '<div class="results">';
      hits.forEach(function(h){
        var a = BY[h.s.i];
        html += '<a href="#' + a.i + '"><span class="rt">' + esc(a.t) + "</span>" +
          '<span class="rc">' + esc(a.c) + "</span>" +
          '<span class="rl">' + a.l.replace(/<[^>]+>/g, "") + "</span></a>";
      });
      html += "</div>";
    }
    main.innerHTML = html + "<footer>Twelve stones. Three seasons. One year.</footer>";
    return true;
  }

  function cur(){ return (location.hash || "").replace(/^#/, "") || "home"; }

  buildNav("");
  render(cur());

  window.addEventListener("hashchange", function(){
    render(cur());
    window.scrollTo(0, 0);
  });

  var t;
  q.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      var v = q.value;
      buildNav(v);
      if (v.trim().length >= 2) search(v);
      else render(cur());
    }, 120);
  });
})();
</script>
