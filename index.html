<style>
  /* Dark ground, the way stones are shown on cloth; the twelve colours are the only saturation.
     Sidebar index + hash-routed articles. Single committed dark theme. */
  :root {
    color-scheme: dark;
    --ground:#0B0B0D; --raised:#141416; --line:#26262A; --soft:#1C1C20;
    --ink:#E9E7E2; --dim:#9A968E; --faint:#6A6762;
    --display:"Cormorant Garamond",Georgia,serif;
    --body:"Barlow","Noto Sans Thai",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;margin:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--ground)}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  a:hover{border-bottom-color:var(--dim)}
  a:focus-visible{outline:2px solid var(--dim);outline-offset:2px}

  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--ground);border-bottom:1px solid var(--line)}
  .bar-in{max-width:70rem;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:.7rem;display:flex;align-items:center;gap:.75rem 1.25rem;flex-wrap:wrap}
  .bar a.brand{font-family:var(--display);font-size:1.1rem;white-space:nowrap;border:0}
  .bar .allpages{font-size:.72rem;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);border:0}
  .bar .allpages:hover{color:var(--dim)}
  #q{flex:1 1 11rem;min-width:0;margin-left:auto;background:var(--raised);border:1px solid var(--line);
     border-radius:var(--radius,3px);color:var(--ink);font:inherit;font-size:.9rem;padding:.4rem .6rem}
  #q::placeholder{color:var(--faint)}

  .shell{max-width:70rem;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:2.5rem 5rem;display:grid;grid-template-columns:1fr;gap:3rem}
  @media (min-width:62rem){ .shell{grid-template-columns:14rem 1fr;gap:4rem} }

  aside{display:none;font-size:.9rem}
  @media (min-width:62rem){ aside{display:block;align-self:start;position:sticky;top:5.5rem;max-height:calc(100vh - 8rem);overflow-y:auto} }
  aside .cat{font-size:.66rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
             margin-top:1.4rem;margin-bottom:.4rem}
  aside .cat:first-child{margin-top:0}
  aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  aside li a{display:flex;align-items:center;gap:.5rem;padding:.18rem 0;color:var(--dim);border:0;font-size:.88rem}
  aside li a:hover{color:var(--ink)}
  aside li a[aria-current="page"]{color:var(--ink);font-weight:500}
  aside .sw{width:.6rem;height:.6rem;border-radius:50%;flex:0 0 auto;border:1px solid rgba(255,255,255,.16)}
  aside .none{color:var(--faint);font-size:.85rem;padding-top:.5rem}

  main{min-width:0}
  .crumb{font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.6rem}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
  h1{font-size:clamp(2.1rem,7vw,3.1rem);line-height:1.04;letter-spacing:-.012em;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  h1 .sw{width:1.1rem;height:1.1rem;border-radius:50%;flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
  main h3{font-size:1.2rem;margin-top:2.2rem}
  main h4{font-size:1rem;margin-top:1.5rem}
  .lead{font-family:var(--display);font-size:clamp(1.1rem,3.4vw,1.35rem);line-height:1.45;color:var(--dim);margin-top:.7rem}
  main p{margin:.9rem 0 0;max-width:42rem}
  .dim{color:var(--dim)}
  .said-big{font-family:var(--display);font-size:1.35rem;color:var(--ink)}
  blockquote{margin:1.2rem 0 0;padding-left:1.1rem;border-left:1px solid var(--line);font-family:var(--display);font-size:1.15rem}
  blockquote p{margin:0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;color:var(--dim)}
  em{font-style:italic}

  main ul,main ol{margin:.9rem 0 0;padding-left:1.15rem;color:var(--dim);display:flex;flex-direction:column;gap:.45rem}
  main ul li,main ol li{max-width:42rem}
  main ol{counter-reset:none}
  ul.idx{gap:.3rem}
  ul.idx .tiny{display:block}
  ul.protos{list-style:none;padding:0}

  .tiny{font-size:.78rem;color:var(--faint)}
  .table-wrap{overflow-x:auto;margin-top:1.2rem}
  table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:18rem}
  th,td{text-align:left;vertical-align:top;padding:.55rem .8rem .55rem 0;border-bottom:1px solid var(--soft)}
  thead th{font-size:.68rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
           border-bottom:1px solid var(--line)}
  tbody th{font-weight:500;color:var(--ink);white-space:nowrap;padding-right:1.2rem}
  td{color:var(--dim)}
  tr.grp th{font-family:var(--display);font-size:1rem;color:var(--ink);letter-spacing:0;text-transform:none;
            padding-top:1.3rem;border-bottom:1px solid var(--line)}
  table.ed td:first-child{width:1.5rem;padding-right:.4rem}
  .sw{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;border:1px solid rgba(255,255,255,.16);vertical-align:middle}

  .xp{margin-top:1.4rem;display:flex;flex-direction:column;gap:.2rem}
  .xp-h{font-family:var(--display);font-size:1.12rem}
  .xp-m{font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .xp p{margin-top:.3rem}

  .results{margin-top:1.5rem;display:flex;flex-direction:column;gap:.1rem}
  .results a{display:block;padding:.65rem 0;border-bottom:1px solid var(--soft);border-top:0;border-left:0;border-right:0}
  .results .rt{font-family:var(--display);font-size:1.1rem}
  .results .rc{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-left:.6rem}
  .results .rl{display:block;font-size:.85rem;color:var(--dim)}

  figure.stone{margin:1.6rem 0 0;max-width:26rem}
  figure.stone img{display:block;width:auto;max-width:100%;max-height:22rem;height:auto;border-radius:4px;background:var(--raised)}
  figure.stone figcaption{margin-top:.45rem;font-size:.75rem;color:var(--faint)}
  figure.stone figcaption a{color:var(--faint)}
  footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--faint);font-size:.85rem}
</style>

<script id="data" type="application/json">{"cats":["Overview","Editions","Formats","Kit","World","Nations","Build"],"arts":[{"i":"home","t":"Twelve Harvests","c":"Overview","s":"","l":"A pickleball series of twelve monthly gemstone editions, run across Thailand's three real seasons.","h":"<p>Twelve tournaments a year, one a month. Each is its own <strong>edition<\/strong>, named after a gemstone, and the stone sets that month's colour, poster, court dressing, medals and merchandise. Main branding stays fixed all year; the edition changes monthly.<\/p>\n<p>The business problem the whole thing solves: <em>sell the same tournament twelve times a year and make each one feel like a different event worth coming back for.<\/em> The gemstones are the mechanism — the same model fashion uses for seasonal collections and festivals use for editions. What changes monthly is the experience; what never changes is courts, registration, staff, rules and scoring, which is where the money goes.<\/p>\n<p>If the only difference between <a href=\"#ruby\">Ruby<\/a> in May and <a href=\"#sapphire\">Sapphire<\/a> in September were the poster and the medal colour, players would work that out by the fourth month. So each edition carries one thing the others do not: see <a href=\"#experiences\">Twelve experiences<\/a>.<\/p>\n<h3>Start here<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#schedule\">Schedule<\/a> · <a href=\"#formats-index\">The four formats<\/a> · <a href=\"#titles\">Titles<\/a> · <a href=\"#earned-access\">Earned access<\/a> · <a href=\"#world\">The world<\/a> · <a href=\"#nations-index\">The twelve nations<\/a><\/p>\n<h3>Two separate worlds<\/h3>\n<p>The tournament is real: Thailand, real venues, real seasons, real weekends. The fiction built on the same twelve stones is an invented country with its own geography and history. They share the stones and nothing else — see <a href=\"#world\">The world<\/a>. In the fiction the sport is called <a href=\"#spectra\">Spectra<\/a>, never pickleball.<\/p>","x":null},{"i":"seasons","t":"The three seasons","c":"Overview","s":"","l":"Thailand has three seasons of about four months each, which fits twelve editions without forcing anything.","h":"<p>Thailand has three seasons, not four, and each runs roughly four months. Four editions per season, three seasons, twelve editions.<\/p>\n<table><thead><tr><th>Season<\/th><th>Thai<\/th><th>Months<\/th><th>Editions<\/th><\/tr><\/thead><tbody>\n<tr><td>Summer<\/td><td>ฤดูร้อน<\/td><td>March – June<\/td><td><a href=\"#kunzite\">Kunzite<\/a>, <a href=\"#citrine\">Citrine<\/a>, <a href=\"#ruby\">Ruby<\/a>, <a href=\"#amber\">Amber<\/a><\/td><\/tr>\n<tr><td>Rain<\/td><td>ฤดูฝน<\/td><td>July – October<\/td><td><a href=\"#peridot\">Peridot<\/a>, <a href=\"#aquamarine\">Aquamarine<\/a>, <a href=\"#sapphire\">Sapphire<\/a>, <a href=\"#emerald\">Emerald<\/a><\/td><\/tr>\n<tr><td>Winter<\/td><td>ฤดูหนาว<\/td><td>November – February<\/td><td><a href=\"#moonstone\">Moonstone<\/a>, <a href=\"#amethyst\">Amethyst<\/a>, <a href=\"#zircon\">Zircon<\/a>, <a href=\"#onyx\">Onyx<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why Rain and not Monsoon<\/h3>\n<p>Summer and Winter are what Thai speakers already say in English. <strong>Rain<\/strong> replaces the Spring of the original draft, because spring corresponds to nothing in Thailand while the rains are a third of the year.<\/p>\n<p>Rain beat Monsoon for two reasons. Monsoon technically names the seasonal wind reversal rather than the wet season, so Thailand has both a southwest and a northeast monsoon — the word is less precise than it looks. More practically, much of the field reads English as a second language and many do not know the word. Summer, Rain and Winter are understood by anyone with basic English and sit at the same register.<\/p>\n<h3>The year boundary<\/h3>\n<p>Winter spans a calendar year, running November to February. The rules must state explicitly which year a February title belongs to: <a href=\"#onyx\">Onyx<\/a> in February closes the preceding year's Winter season rather than opening a new one.<\/p>","x":null},{"i":"schedule","t":"Schedule","c":"Overview","s":"","l":"Mid-month weekend, every month — always inside the 15th to the 22nd.","h":"<p><strong>Mid-month weekend, every month.<\/strong> Always somewhere in the 15th to the 22nd.<\/p>\n<p>The third weekend of any month always falls inside that window, so the rule is checkable against any calendar without counting. &ldquo;Third weekend&rdquo; sounds simple until someone has to work out whether a Saturday on the 1st counts as the first one.<\/p>\n<h3>Three layers, three audiences<\/h3>\n<ul><li><strong>Players see<\/strong> twelve dates on one page. That page is what gets screenshotted into a group chat, and it is what a sponsor sees when deciding what they are buying.<\/li>\n<li><strong>Marketing says<\/strong> mid-month weekend, every month.<\/li>\n<li><strong>Operations uses<\/strong> the weekend falling within the 15th to the 22nd.<\/li><\/ul>\n<h3>Why the middle of the month<\/h3>\n<p>Thai public holidays cluster at the start of months — Chakri Day on 6 April, Labour Day and Coronation Day in early May, the 5th and 10th of December, 1 January. The first weekend keeps colliding with them. The last weekend is worse: payday weekend, when people travel home, and some months have five weekends so the date drifts by a fortnight. The second weekend runs into Songkran on 13–15 April. The mid-month weekend dodges all of it and gives a clean four-week gap.<\/p>\n<h3>Exceptions to plan for<\/h3>\n<p><strong>November.<\/strong> Loy Krathong is set by the full moon and moves every year. <a href=\"#moonstone\">Moonstone<\/a> is the one month where the stone and the festival genuinely belong together, so it may be worth chasing the moon rather than holding the slot.<\/p>\n<p><strong>Heat.<\/strong> April and May weekends will often be 38–40°C. Early morning and evening sessions, or covered courts, belong in the plan from the start rather than being added after someone collapses.<\/p>","x":null},{"i":"editions-index","t":"The twelve editions","c":"Overview","s":"","l":"All twelve stones with their months, colours and places.","h":"<table class=\"ed\"><thead><tr><th><\/th><th>Stone<\/th><th>Month<\/th><th>Place<\/th><\/tr><\/thead><tbody><tr class=\"grp\"><th colspan=\"4\">Summer · ฤดูร้อน · March – June<\/th><\/tr><tr><td><span class=\"sw\" style=\"background:#D9A3C4\"><\/span><\/td><td><a href=\"#kunzite\">Kunzite<\/a><\/td><td>March<\/td><td>The Flowering Scrub<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#E0A417\"><\/span><\/td><td><a href=\"#citrine\">Citrine<\/a><\/td><td>April<\/td><td>The Salt Markets<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#C0202E\"><\/span><\/td><td><a href=\"#ruby\">Ruby<\/a><\/td><td>May<\/td><td>The Ember Valley<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#C97B18\"><\/span><\/td><td><a href=\"#amber\">Amber<\/a><\/td><td>June<\/td><td>The Resin Forest<\/td><\/tr><tr class=\"grp\"><th colspan=\"4\">Rain · ฤดูฝน · July – October<\/th><\/tr><tr><td><span class=\"sw\" style=\"background:#9CC441\"><\/span><\/td><td><a href=\"#peridot\">Peridot<\/a><\/td><td>July<\/td><td>The Terraces<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#7FC9C9\"><\/span><\/td><td><a href=\"#aquamarine\">Aquamarine<\/a><\/td><td>August<\/td><td>The Shifting Delta<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#1D5FA8\"><\/span><\/td><td><a href=\"#sapphire\">Sapphire<\/a><\/td><td>September<\/td><td>The Storm Coast<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#0E7A4E\"><\/span><\/td><td><a href=\"#emerald\">Emerald<\/a><\/td><td>October<\/td><td>The Flooded Basin<\/td><\/tr><tr class=\"grp\"><th colspan=\"4\">Winter · ฤดูหนาว · November – February<\/th><\/tr><tr><td><span class=\"sw\" style=\"background:#DCE3EC\"><\/span><\/td><td><a href=\"#moonstone\">Moonstone<\/a><\/td><td>November<\/td><td>The Lantern Lake<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#6B4B9E\"><\/span><\/td><td><a href=\"#amethyst\">Amethyst<\/a><\/td><td>December<\/td><td>The Violet Ridges<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#6FB3D9\"><\/span><\/td><td><a href=\"#zircon\">Zircon<\/a><\/td><td>January<\/td><td>The Frost Peaks<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#2A2A2E\"><\/span><\/td><td><a href=\"#onyx\">Onyx<\/a><\/td><td>February<\/td><td>The Black Cliffs<\/td><\/tr><\/tbody><\/table>\n<p>All single words, no colour qualifiers — see <a href=\"#naming\">Naming rules<\/a>. Diamond sits outside the twelve as the career award; see <a href=\"#titles\">Titles<\/a>.<\/p>","x":null},{"i":"experiences","t":"Twelve experiences","c":"Overview","s":"","l":"Each edition needs one thing the others do not have. This is the most commercially important part of the series.","h":"<p>Colour is not an experience. If an edition differs from its neighbours only by palette, the series is one tournament with twelve paint jobs and players will notice.<\/p>\n<p>Format is fixed by position in the season, which gives every season the same four-beat shape — <strong>social, spectacle, hard, prestige<\/strong> — three times a year. The experience amplifies the format rather than fighting it.<\/p>\n<p>Names in quotes below are campaign descriptors, <em>not<\/em> event names. The event is always the stone, and the lockup never changes. Separate event names like &ldquo;Redline Open&rdquo; would break the collection, because the entire value of twelve stones is that they are a set somebody can complete.<\/p>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#kunzite\">Kunzite<\/a> — &ldquo;First Bloom&rdquo;<\/span><span class=\"xp-m\">March · Team deathmatch<\/span><p class=\"dim\">Daytime, outdoors, soft lilac everywhere. Dress code is pastels. Teams are drawn and formed on the day, so nobody arrives committed and everyone meets someone new. The year's first serve, and a team draft that doubles as the social mixer.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#citrine\">Citrine<\/a> — &ldquo;Gold Hour&rdquo;<\/span><span class=\"xp-m\">April · Rally-length scoring<\/span><p class=\"dim\">Gold and white, hard bright light, day-festival energy, water everywhere because it is April in Thailand and there is no fighting it. The rally counter's loudest outing of the year, and the longest-rally board goes up and stays up.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#ruby\">Ruby<\/a> — &ldquo;The Furnace&rdquo;<\/span><span class=\"xp-m\">May · Rally to 11<\/span><p class=\"dim\">The event moves to night and leans into the heat. Red light, black court dressing, short brutal matches. The hardest physical conditions of the year, framed as a badge rather than apologised for.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#amber\">Amber<\/a> — &ldquo;The Sealing&rdquo;<\/span><span class=\"xp-m\">June · Side-out · Summer Crown<\/span><p class=\"dim\">Formal, warm, slower. Honey tones, evening light, the first Crown of the year decided, medals set with real stones.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#peridot\">Peridot<\/a> — &ldquo;Green Season&rdquo;<\/span><span class=\"xp-m\">July · Team deathmatch<\/span><p class=\"dim\">The rains arrive and the event does not hide from them. Bright yellow-green, outdoors, wet, messy, team chaos. Play continues in the rain, and that is the point.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#aquamarine\">Aquamarine<\/a> — &ldquo;The Flood&rdquo;<\/span><span class=\"xp-m\">August · Rally-length scoring<\/span><p class=\"dim\">Pale teal, water staging, the wettest-looking event of the year. Water as the entire design language: reflective surfaces, poured light, the counter running over it.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#sapphire\">Sapphire<\/a> — &ldquo;Deep Blue&rdquo;<\/span><span class=\"xp-m\">September · Rally to 11<\/span><p class=\"dim\">Heaviest rain, so it moves indoors and becomes the most formal competitive event of the year. Full officiating, line judges, silence between points. This is where you come to be judged properly.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#emerald\">Emerald<\/a> — &ldquo;The Harvest&rdquo;<\/span><span class=\"xp-m\">October · Side-out · Rain Crown<\/span><p class=\"dim\">End of the rains, everything green, the second Crown decided. Deep green, formal.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#moonstone\">Moonstone<\/a> — &ldquo;White Night&rdquo;<\/span><span class=\"xp-m\">November · Team deathmatch<\/span><p class=\"dim\">Everyone dresses in white. Twilight start running into darkness, lanterns, water, silver light. The social event of the year, and the edition people bring friends to.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#amethyst\">Amethyst<\/a> — &ldquo;The Long Night&rdquo;<\/span><span class=\"xp-m\">December · Rally-length scoring<\/span><p class=\"dim\">Peak tourist season and the largest international field. Violet and black, night event, music, the biggest crowd of the year. Loudest, latest, most watched.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#zircon\">Zircon<\/a> — &ldquo;Cold Open&rdquo;<\/span><span class=\"xp-m\">January · Rally to 11<\/span><p class=\"dim\">The coldest clearest month. Early morning start, icy blue and white, technical kit, no decoration. The purest competitive event of the year, stripped back on purpose after December.<\/p><\/div>\n<div class=\"xp\"><span class=\"xp-h\"><a href=\"#onyx\">Onyx<\/a> — &ldquo;The Closing&rdquo;<\/span><span class=\"xp-m\">February · Side-out · Winter Crown<\/span><p class=\"dim\">The final event of the competitive year. All black. Night finals under lights, the Winter Crown decided, and with it the Full Spectrum. The year-end gala.<\/p><\/div>\n\n<h3>Notes<\/h3>\n<p><strong>The dress codes are free.<\/strong> White Night and The Closing cost nothing to run — they are instructions, not productions — and generate more photography than any amount of staging would.<\/p>\n<p><strong>The experience and the merchandise are the same idea.<\/strong> Moonstone is white, the Moonstone collection is silver-white, and somebody wearing their Moonstone jacket to next year's White Night is the moment <a href=\"#earned-access\">Earned access<\/a> pays off. The dress code is not arbitrary; it is the collection, worn.<\/p>\n<p><strong>Time of day is the cheapest differentiator available.<\/strong> A dawn start in January and a night final in February feel like completely different events and cost the same as anything else.<\/p>\n<p><strong>Three should be bigger than the rest:<\/strong> <a href=\"#moonstone\">Moonstone<\/a> for the social, <a href=\"#amethyst\">Amethyst<\/a> for the crowd, <a href=\"#onyx\">Onyx<\/a> for the finale. Budget accordingly rather than spreading evenly across twelve.<\/p>","x":null},{"i":"naming","t":"Naming rules","c":"Overview","s":"","l":"One trade name per stone, no colour qualifiers, and the stone is always the event name.","h":"<p>All twelve are single words. No colour qualifiers.<\/p>\n<h3>The actual rule: one trade name each<\/h3>\n<p>It is not one stone per mineral. <a href=\"#ruby\">Ruby<\/a> and <a href=\"#sapphire\">Sapphire<\/a> are both corundum. <a href=\"#citrine\">Citrine<\/a> and <a href=\"#amethyst\">Amethyst<\/a> are both quartz. <a href=\"#aquamarine\">Aquamarine<\/a> and <a href=\"#emerald\">Emerald<\/a> are both beryl. Three doubles, all deliberate.<\/p>\n<p>What is enforced is that no stone shares a <em>name<\/em> with another. Ruby and Sapphire share a mineral but not a name, so neither needs a qualifier. Yellow Sapphire and Blue Sapphire share a name, so both would. That is the line, and it is why the twelve all sit comfortably as single words.<\/p>\n<h3>Stones considered and rejected<\/h3>\n<ul>\n<li><strong>Sunstone<\/strong> — passes the naming rule, but Sun and Moon in the same twelve is the one pairing a reader clocks instantly and makes the list look assembled. Its warm orange is also already covered twice by Citrine's gold and Amber's honey.<\/li>\n<li><strong>Tiger's eye and hawk's eye<\/strong> — two words with a possessive, and both carry &ldquo;eye&rdquo; so they would need qualifiers. Chatoyancy is also a <em>moving<\/em> band of light, which cannot be drawn under the flat single-colour rules for <a href=\"#the-marks\">The twelve marks<\/a>. Better used as the tracker's stone: hawk's eye is the unoxidised form and turns gold as the iron rusts, so a new tracker carries blue and it goes gold over a career.<\/li>\n<li><strong>Heliodor and demantoid<\/strong> — elegant single words, originally chosen for April and July. Replaced by Citrine and Peridot because neither can be sourced or set in a medal, and both were unrecognisable. Kept as an upgrade path for when sourcing allows.<\/li>\n<li><strong>Adularia<\/strong> — the mineral most fine moonstone actually is, and briefly used for November. Reverted: Moonstone is the better-known word and Loy Krathong is the strongest cultural anchor in the year. Adularia survives as the kingdom's formal name in the fiction.<\/li>\n<li><strong>Jade<\/strong> — a muted mid-green too close to Emerald, and culturally Chinese rather than Thai.<\/li>\n<\/ul>\n<h3>The event lockup<\/h3>\n<p>Series name, then stone, then year — three lines, series mark small and identical across all twelve, stone name as the large element. No &ldquo;Edition&rdquo; on the poster; the structure makes it obvious, and the word is kept for prose and merchandise copy where length costs nothing.<\/p>\n<p>A second format exists for title cards and video stingers: <strong>stone, then place<\/strong>. Moonstone / The Lantern Lake. Two formats doing two jobs — series-stone-year for posters and entry material, stone-place for titles.<\/p>\n<h3>The birthstone question<\/h3>\n<p>Lead with what the system is, not how it differs. One line does most of the work: <em>the stones follow Thailand's three seasons, not the birthstone calendar.<\/em><\/p>\n<p>For anyone who wants more: birthstones come from a list set by an American jewellers' trade association in 1912 and revised since — tanzanite was added to December as recently as 2002 — and it follows a Northern Hemisphere calendar. Never build a comparison table; it turns a non-issue into a debate. And let people keep their birthstone: theirs belongs to them, these belong to the months.<\/p>","x":null},{"i":"kunzite","t":"Kunzite","c":"Editions","s":"March","l":"March · Summer · The Flowering Scrub","h":"<figure class=\"stone\"><img src=\"stones/kunzite.jpg\" alt=\"A marquise-cut pink kunzite\" width=\"720\" height=\"575\" loading=\"lazy\"><figcaption>Photo: Stickpen · <a href=\"https://commons.wikimedia.org/wiki/File:Kunzite-marquiscut.jpg\">Wikimedia Commons<\/a> · Public domain<\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>March<\/td><\/tr>\n<tr><th>Season<\/th><td>Summer (ฤดูร้อน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#D9A3C4<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Team deathmatch<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;First Bloom&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Flowering Scrub<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>The youngest stone in the calendar, unknown to the trade before 1902, so it still carries associations of beginnings rather than centuries of symbolism. March opens the hot season and the competitive year: first event, first points, everything still available. The palest stone for the month when nothing has been decided.<\/p>\n<h3>As an event<\/h3>\n<p>Daytime, outdoors, soft lilac everywhere. Dress code is pastels. Teams are drawn and formed on the day, so nobody arrives committed and everyone meets someone new. The year's first serve, and a team draft that doubles as the social mixer.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Waking.<\/strong> The ball accelerates after the bounce. Soft off the paddle, fast off the court.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Flowering Scrub. &ldquo;Nothing's decided yet.&rdquo; — <a href=\"#kunzite-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#D9A3C4"},{"i":"citrine","t":"Citrine","c":"Editions","s":"April","l":"April · Summer · The Salt Markets","h":"<figure class=\"stone\"><img src=\"stones/citrine.jpg\" alt=\"A faceted citrine\" width=\"720\" height=\"570\" loading=\"lazy\"><figcaption>Photo: Didier Descouens · <a href=\"https://commons.wikimedia.org/wiki/File:Citrine_taillee.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>April<\/td><\/tr>\n<tr><th>Season<\/th><td>Summer (ฤดูร้อน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#E0A417<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally-length scoring<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;Gold Hour&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Salt Markets<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>The merchant's stone, associated with abundance and the sun. April is Songkran, when the country stops for the water festival and the light is at its hardest — and it is the hottest month of the Thai year. The most festive month gets the most golden stone, and the edition most likely to draw entrants who have never played the series.<\/p>\n<h3>As an event<\/h3>\n<p>Gold and white, hard bright light, day-festival energy, water everywhere because it is April in Thailand and there is no fighting it. The rally counter's loudest outing of the year, and the longest-rally board goes up and stays up.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Velocity.<\/strong> Raw speed, flat and immediate. No time to set your feet.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Salt Markets. &ldquo;Somebody had to pay for it.&rdquo; — <a href=\"#citrine-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#E0A417"},{"i":"ruby","t":"Ruby","c":"Editions","s":"May","l":"May · Summer · The Ember Valley","h":"<figure class=\"stone\"><img src=\"stones/ruby.jpg\" alt=\"A faceted ruby\" width=\"432\" height=\"324\" loading=\"lazy\"><figcaption>Photo: Humanfeather · <a href=\"https://commons.wikimedia.org/wiki/File:Ruby_gem.JPG\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by/3.0\">CC BY 3.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>May<\/td><\/tr>\n<tr><th>Season<\/th><td>Summer (ฤดูร้อน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#C0202E<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally to 11<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Furnace&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Ember Valley<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>The stone of courage and vital heat, called the king of gems for as long as gems have been ranked. May is not the hottest month — April is. May is the month the heat stops being a novelty: weeks of it, no rain yet, nothing left in reserve, and the Summer Crown still undecided. Endurance fits that better than peak temperature ever did.<\/p>\n<h3>As an event<\/h3>\n<p>The event moves to night and leans into the heat. Red light, black court dressing, short brutal matches. The hardest physical conditions of the year, framed as a badge rather than apologised for.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Weight.<\/strong> The ball arrives heavy. It jars the paddle back on contact, regardless of its speed.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Ember Valley. &ldquo;We got there first.&rdquo; — <a href=\"#ruby-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#C0202E"},{"i":"amber","t":"Amber","c":"Editions","s":"June","l":"June · Summer · The Resin Forest","h":"<figure class=\"stone\"><img src=\"stones/amber.jpg\" alt=\"Baltic amber with an insect preserved inside\" width=\"480\" height=\"720\" loading=\"lazy\"><figcaption>Photo: Anders L. Damgaard · <a href=\"https://commons.wikimedia.org/wiki/File:Amber2.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>June<\/td><\/tr>\n<tr><th>Season<\/th><td>Summer (ฤดูร้อน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#C97B18<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Side-out · Summer Crown<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Sealing&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Resin Forest<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Resin that has held its contents for forty million years: the stone of preservation. June is the last heavy month before the rains break, and it closes the summer season. What is won here is the Summer Crown, and amber suits a title that is kept rather than merely taken.<\/p>\n<h3>As an event<\/h3>\n<p>Formal, warm, slower. Honey tones, evening light, the first Crown of the year decided, medals set with real stones.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Holding.<\/strong> The ball keeps whatever state it was given. It does not bleed speed, and it resists spin the opponent tries to put on it.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Resin Forest. &ldquo;We have the only complete record.&rdquo; — <a href=\"#amber-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#C97B18"},{"i":"peridot","t":"Peridot","c":"Editions","s":"July","l":"July · Rain · The Terraces","h":"<figure class=\"stone\"><img src=\"stones/peridot.jpg\" alt=\"A peridot crystal\" width=\"523\" height=\"720\" loading=\"lazy\"><figcaption>Photo: Robert M. Lavinsky · <a href=\"https://commons.wikimedia.org/wiki/File:Forsterite-Olivine-tmu14a.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/3.0\">CC BY-SA 3.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>July<\/td><\/tr>\n<tr><th>Season<\/th><td>Rain (ฤดูฝน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#9CC441<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Team deathmatch<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;Green Season&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Terraces<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>A stone of renewal since the Egyptians called it the gem of the sun. July is when the rains arrive and the fields turn — Khao Phansa, and young rice coming up pale and bright. The rains open on the colour of new growth, in the month the growing year begins.<\/p>\n<h3>As an event<\/h3>\n<p>The rains arrive and the event does not hide from them. Bright yellow-green, outdoors, wet, messy, team chaos. Play continues in the rain, and that is the point.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Compounding.<\/strong> Effects grow across a rally. Each exchange adds a little. Rewards long points and punishes anyone who cannot end one.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Terraces. &ldquo;The work came first.&rdquo; — <a href=\"#peridot-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#9CC441"},{"i":"aquamarine","t":"Aquamarine","c":"Editions","s":"August","l":"August · Rain · The Shifting Delta","h":"<figure class=\"stone\"><img src=\"stones/aquamarine.jpg\" alt=\"Aquamarine crystals on rock\" width=\"720\" height=\"540\" loading=\"lazy\"><figcaption>Photo: Gunnar Ries Amphibol · <a href=\"https://commons.wikimedia.org/wiki/File:Aquamarine_P1000141.JPG\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/2.5\">CC BY-SA 2.5<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>August<\/td><\/tr>\n<tr><th>Season<\/th><td>Rain (ฤดูฝน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#7FC9C9<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally-length scoring<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Flood&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Shifting Delta<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Carried by sailors for safe passage; the name is simply the water of the sea. August is when the rains stop being an event and become the condition. The season has settled into itself.<\/p>\n<h3>As an event<\/h3>\n<p>Pale teal, water staging, the wettest-looking event of the year. Water as the entire design language: reflective surfaces, poured light, the counter running over it.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Flow.<\/strong> The ball curves smoothly and visibly in flight, and the player moves the same way.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Shifting Delta. &ldquo;We argued our way in.&rdquo; — <a href=\"#aquamarine-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#7FC9C9"},{"i":"sapphire","t":"Sapphire","c":"Editions","s":"September","l":"September · Rain · The Storm Coast","h":"<figure class=\"stone\"><img src=\"stones/sapphire.jpg\" alt=\"The Logan Sapphire, a large blue sapphire set in diamonds\" width=\"534\" height=\"720\" loading=\"lazy\"><figcaption>Photo: Chip Clark, Smithsonian staff · <a href=\"https://commons.wikimedia.org/wiki/File:Logan_Sapphire_10956420_cropped.png\">Wikimedia Commons<\/a> · Public domain<\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>September<\/td><\/tr>\n<tr><th>Season<\/th><td>Rain (ฤดูฝน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#1D5FA8<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally to 11<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;Deep Blue&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Storm Coast<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Clarity and judgement, worn by kings and clergy, and Thailand's own sapphires come from Chanthaburi and Kanchanaburi. September is the heaviest rain of the year: wet courts, delays, wind. The deepest stone for the month that tests composure rather than power.<\/p>\n<h3>As an event<\/h3>\n<p>Heaviest rain, so it moves indoors and becomes the most formal competitive event of the year. Full officiating, line judges, silence between points. This is where you come to be judged properly.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Reading.<\/strong> Not a ball effect. You perceive the opponent's shot earlier than you should.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Storm Coast. &ldquo;It was lawful, and I'm tired of being asked.&rdquo; — <a href=\"#sapphire-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#1D5FA8"},{"i":"emerald","t":"Emerald","c":"Editions","s":"October","l":"October · Rain · The Flooded Basin","h":"<figure class=\"stone\"><img src=\"stones/emerald.jpg\" alt=\"Five cut Colombian emeralds\" width=\"720\" height=\"659\" loading=\"lazy\"><figcaption>Photo: Mauro Cateb · <a href=\"https://commons.wikimedia.org/wiki/File:5_Emeralds_from_Colombia.JPG\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/3.0\">CC BY-SA 3.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>October<\/td><\/tr>\n<tr><th>Season<\/th><td>Rain (ฤดูฝน)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#0E7A4E<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Side-out · Rain Crown<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Harvest&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Flooded Basin<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Growth and rebirth in nearly every tradition that has one. October is Ok Phansa, when the rains stop and the country is at its greenest. The season closes here and the Rain Crown is decided on the month that shows what the rains were for.<\/p>\n<h3>As an event<\/h3>\n<p>End of the rains, everything green, the second Crown decided. Deep green, formal.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Cutting.<\/strong> The ball dies on the bounce. Almost no rebound.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Flooded Basin. &ldquo;Nobody's explained it and we're not going to.&rdquo; — <a href=\"#emerald-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#0E7A4E"},{"i":"moonstone","t":"Moonstone","c":"Editions","s":"November","l":"November · Winter · The Lantern Lake","h":"<figure class=\"stone\"><img src=\"stones/moonstone.jpg\" alt=\"A blue-sheen moonstone cabochon\" width=\"720\" height=\"488\" loading=\"lazy\"><figcaption>Photo: Gemsphoto · <a href=\"https://commons.wikimedia.org/wiki/File:Natural_Blue_Moonstone_loose_gemstone.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>November<\/td><\/tr>\n<tr><th>Season<\/th><td>Winter (ฤดูหนาว)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#DCE3EC<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Team deathmatch<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;White Night&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Lantern Lake<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Its glow is light held inside the stone rather than reflected off it. November is Loy Krathong, when the country floats candles down its rivers under the full moon. Winter opens on light carried through darkness.<\/p>\n<h3>As an event<\/h3>\n<p>Everyone dresses in white. Twilight start running into darkness, lanterns, water, silver light. The social event of the year, and the edition people bring friends to.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Float.<\/strong> The ball hangs, briefly losing weight in the air. Lobs and resets follow from this.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Lantern Lake. &ldquo;We weren't competing.&rdquo; — <a href=\"#moonstone-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#DCE3EC"},{"i":"amethyst","t":"Amethyst","c":"Editions","s":"December","l":"December · Winter · The Violet Ridges","h":"<figure class=\"stone\"><img src=\"stones/amethyst.jpg\" alt=\"A faceted amethyst\" width=\"720\" height=\"476\" loading=\"lazy\"><figcaption>Photo: James St. John · <a href=\"https://commons.wikimedia.org/wiki/File:Amethyst_(faceted)_1.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by/2.0\">CC BY 2.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>December<\/td><\/tr>\n<tr><th>Season<\/th><td>Winter (ฤดูหนาว)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#6B4B9E<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally-length scoring<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Long Night&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Violet Ridges<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>From the Greek for <em>not drunken<\/em>: clarity in the middle of celebration, and a bishop's and a royal stone for most of its history. December is Thailand's peak season, the year's most crowded month, and likely the largest international field.<\/p>\n<h3>As an event<\/h3>\n<p>Peak tourist season and the largest international field. Violet and black, night event, music, the biggest crowd of the year. Loudest, latest, most watched.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Deception.<\/strong> The spin is concealed. The ball breaks the opposite way to what the swing showed.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Violet Ridges. &ldquo;I never asked for a place.&rdquo; — <a href=\"#amethyst-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#6B4B9E"},{"i":"zircon","t":"Zircon","c":"Editions","s":"January","l":"January · Winter · The Frost Peaks","h":"<figure class=\"stone\"><img src=\"stones/zircon.jpg\" alt=\"A cut blue zircon\" width=\"720\" height=\"720\" loading=\"lazy\"><figcaption>Photo: 千玄 · <a href=\"https://commons.wikimedia.org/wiki/File:0.45cts_gem_grade_blue_zircon.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\">CC BY-SA 4.0<\/a> · cropped<\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>January<\/td><\/tr>\n<tr><th>Season<\/th><td>Winter (ฤดูหนาว)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#6FB3D9<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Rally to 11<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;Cold Open&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Frost Peaks<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Among the oldest known materials on Earth, and Thailand sits at the centre of the world's blue zircon trade. January is the coldest and clearest month, when the north genuinely turns cold. A new calendar year, and a stone that has outlasted everything.<\/p>\n<h3>As an event<\/h3>\n<p>The coldest clearest month. Early morning start, icy blue and white, technical kit, no decoration. The purest competitive event of the year, stripped back on purpose after December.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>Drain.<\/strong> Robs the opponent's pace. A returned Zircon ball comes off their paddle slow and heavy.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Frost Peaks. &ldquo;The list is illegitimate.&rdquo; — <a href=\"#zircon-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#6FB3D9"},{"i":"onyx","t":"Onyx","c":"Editions","s":"February","l":"February · Winter · The Black Cliffs","h":"<figure class=\"stone\"><img src=\"stones/onyx.jpg\" alt=\"Polished black onyx cabochons\" width=\"720\" height=\"540\" loading=\"lazy\"><figcaption>Photo: W.carter · <a href=\"https://commons.wikimedia.org/wiki/File:Black_oval_onyx_cabochons_2.jpg\">Wikimedia Commons<\/a> · <a href=\"https://creativecommons.org/licenses/by/4.0\">CC BY 4.0<\/a><\/figcaption><\/figure>\n<table><tbody>\n<tr><th>Month<\/th><td>February<\/td><\/tr>\n<tr><th>Season<\/th><td>Winter (ฤดูหนาว)<\/td><\/tr>\n<tr><th>Colour<\/th><td><code>#2A2A2E<\/code><\/td><\/tr>\n<tr><th>Format<\/th><td>Side-out · Winter Crown<\/td><\/tr>\n<tr><th>Concept<\/th><td>&ldquo;The Closing&rdquo;<\/td><\/tr>\n<tr><th>In the fiction<\/th><td>The Black Cliffs<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this stone, this month<\/h3>\n<p>Strength and steadiness since Greek soldiers carried it into battle. February is the last weekend of the competitive year: the Winter Crown is decided here, and with it the last chance at a Full Spectrum. The darkest stone on the final event.<\/p>\n<h3>As an event<\/h3>\n<p>The final event of the competitive year. All black. Night finals under lights, the Winter Crown decided, and with it the Full Spectrum. The year-end gala.<\/p>\n<h3>Power on court<\/h3>\n<p><strong>The Wall.<\/strong> Absorbs force. Power shots die against an Onyx defence rather than being returned.<\/p>\n<p>In the fiction the stone's power sets only the <em>kind<\/em> of effect; each player develops their own technique within it. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<h3>The kingdom<\/h3>\n<p>The Black Cliffs. &ldquo;The matter is closed.&rdquo; — <a href=\"#onyx-nation\">full profile<\/a>.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#editions-index\">The twelve editions<\/a> · <a href=\"#seasons\">The three seasons<\/a> · <a href=\"#experiences\">Twelve experiences<\/a> · <a href=\"#the-marks\">The twelve marks<\/a><\/p>","x":"#2A2A2E"},{"i":"formats-index","t":"The four formats","c":"Formats","s":"","l":"Fixed by position in the season, so every season tests the same four things.","h":"<p>Format is fixed to position in the season rather than to the month. Every season runs the same four-beat shape, so a <a href=\"#titles\">Crown<\/a> always means the same thing: winning four different kinds of match, not the same match four times. That is the argument for why a Crown is hard.<\/p>\n<table><thead><tr><th>#<\/th><th>Format<\/th><th>Character<\/th><th>Editions<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td><a href=\"#team-deathmatch\">Team deathmatch<\/a><\/td><td>Social<\/td><td><a href=\"#kunzite\">Kunzite<\/a>, <a href=\"#peridot\">Peridot<\/a>, <a href=\"#moonstone\">Moonstone<\/a><\/td><\/tr>\n<tr><td>2<\/td><td><a href=\"#rally-length\">Rally-length scoring<\/a><\/td><td>Spectacle<\/td><td><a href=\"#citrine\">Citrine<\/a>, <a href=\"#aquamarine\">Aquamarine<\/a>, <a href=\"#amethyst\">Amethyst<\/a><\/td><\/tr>\n<tr><td>3<\/td><td><a href=\"#rally-11\">Rally to 11, best of three<\/a><\/td><td>Hard<\/td><td><a href=\"#ruby\">Ruby<\/a>, <a href=\"#sapphire\">Sapphire<\/a>, <a href=\"#zircon\">Zircon<\/a><\/td><\/tr>\n<tr><td>4<\/td><td><a href=\"#side-out\">Side-out to 11<\/a><\/td><td>Prestige<\/td><td><a href=\"#amber\">Amber<\/a>, <a href=\"#emerald\">Emerald<\/a>, <a href=\"#onyx\">Onyx<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<h3>Why this order<\/h3>\n<p>The social format opens each season, when the field is largest and everyone still has a Crown available. The spectacle format lands on Songkran and December, the two highest-attendance months. The shortest format lands on May and September, the hottest and the wettest. The traditional format decides every Crown, because the season title should be settled on the game serious players consider the real test.<\/p>\n<p>It also means operations can plan: March, July and November need the most court hours; April, August and December need the counters and camera setup.<\/p>\n<p>See also: <a href=\"#painite\">Painite<\/a>, the annual invitational that fuses two of the four.<\/p>","x":null},{"i":"team-deathmatch","t":"Team deathmatch","c":"Formats","s":"","l":"Four players make six pairs, and the pairs are the team's lives.","h":"<p>Played at the opening edition of each season: <a href=\"#kunzite\">Kunzite<\/a>, <a href=\"#peridot\">Peridot<\/a>, <a href=\"#moonstone\">Moonstone<\/a>.<\/p>\n<h3>The idea<\/h3>\n<p>Four players make a team. Those four form <strong>six pairs<\/strong> — every possible combination. The six pairs are the team's lives. When all six are gone, the team is out.<\/p>\n<p>With players A, B, C and D the pairs are <strong>AB · AC · AD · BC · BD · CD<\/strong>, so every player appears in exactly three and no pair repeats.<\/p>\n<p>One strong pair can carry a team a long way. But a team winning through its best pairing is leaning on the same bodies over and over, so depth and fatigue are built into the structure without needing a rule for either.<\/p>\n<h3>Lives<\/h3>\n<p><strong>Each pair has four lives.<\/strong> A pair loses one when it is sided out. Side-out scoring throughout.<\/p>\n<ul><li>24 lives per team<\/li>\n<li>48 side-outs across a full match<\/li>\n<li>12 side-outs per individual player — roughly one standard game's worth of serving<\/li><\/ul>\n<p>A pair at zero lives is eliminated and cannot return.<\/p>\n<h3>Structure<\/h3>\n<p>Each team fields its six pairs against the opposing six, and pairs play in sequence until all six matchups have been contested. Surviving pairs are then reordered by their team, and cycles continue until one team has no pairs left. The team with pairs remaining wins.<\/p>\n<p>The losing pair rotates off and the winner stays on, so a pair on a run is visibly dominant and the rally that finally breaks the streak is the one everyone remembers.<\/p>\n<p>Round robin then elimination rounds, as with every edition. The team is the competing unit, and all four players on the winning team are credited with the edition win for <a href=\"#titles\">Crown and Master<\/a> purposes.<\/p>\n<h3>Timing<\/h3>\n<p>Longer than the other three formats, which is appropriate for a season opener — but March, July and November need more court hours budgeted than the other months.<\/p>\n<h3>Still open<\/h3>\n<p><strong>The rotation trigger.<\/strong> Does a sided-out pair leave immediately, or stay until all four lives are spent? This is the biggest open question in the format and it changes match length substantially. Immediate rotation gives the Smash Bros. feel; staying lets a strong pair dominate uninterrupted.<\/p>\n<p><strong>Matchup selection.<\/strong> Blind simultaneous reveal, or does the second team respond to what the first puts out? Blind reveal makes pairing order a real strategic layer.<\/p>\n<p><strong>Time-limit tiebreak.<\/strong> With no point total, a match with both teams alive has no natural tiebreak. Either add a running count used only for this, or award it on surviving lives.<\/p>\n<p><strong>Team continuity.<\/strong> Fixed across a season, or re-formed each edition? Fixed builds identity and rivalries and gives sponsors something to name. This affects registration design.<\/p>\n<p>Run a full mock match with a stopwatch before publishing. Every question above resolves faster by playing it once than by arguing on paper.<\/p>","x":null},{"i":"rally-length","t":"Rally-length scoring","c":"Formats","s":"","l":"The longer the rally you win, the more it is worth. The spectacle format.","h":"<p>Played at the second edition of each season: <a href=\"#citrine\">Citrine<\/a>, <a href=\"#aquamarine\">Aquamarine<\/a>, <a href=\"#amethyst\">Amethyst<\/a>.<\/p>\n<p>Rally scoring, with points awarded by how long the rally lasted. Longer rally won, more points.<\/p>\n<h3>Why it must be rally scoring<\/h3>\n<p>Under side-out, stalling only costs you your own serve and the payout only applies to the serving team, so the receiving team has no reason to extend anything. Rally scoring is the only version where the incentive applies to both sides.<\/p>\n<h3>Counting<\/h3>\n<p><strong>Net crossings, not paddle touches.<\/strong> In live play these are the same number anyway — every shot that stays in play crosses the net exactly once — and crossings are easier to see and harder to dispute.<\/p>\n<p><strong>Capped.<\/strong> Without a cap, one freak rally decides a match and the rest stops mattering. A cap also removes the reward for extending a rally past the top band, which is where farming would start.<\/p>\n<p><strong>Staffed.<\/strong> One dedicated counter per court, calling the number aloud at the end of each rally so both teams hear it before play resumes. Testing showed counting in your head and entering it at the rally's end beats clicking during play, because operating a device splits attention away from watching. For a live display, use two people: one watches and calls, one drives the board.<\/p>\n<h3>The counter is the content<\/h3>\n<p>A courtside number climbing through a twenty-crossing rally is the single best content asset in the series. It produces crowd reaction on camera; a counter edited on afterwards produces a much flatter video. Put a fixed camera on the format court from day one, even if nothing else is filmed.<\/p>\n<h3>Longest Rally of the Season<\/h3>\n<p>Because the cap removes the incentive to chase very long rallies, a separate uncapped record title preserves the chase. It also gives every edition a highlight that does not depend on who won, and it is a natural sponsor asset.<\/p>\n<p>See <a href=\"#shot-counting\">Shot counting<\/a> for the automation work.<\/p>","x":null},{"i":"rally-11","t":"Rally to 11, best of three","c":"Formats","s":"","l":"The short, fast format. Win by serve at 10–10.","h":"<p>Played at the third edition of each season: <a href=\"#ruby\">Ruby<\/a>, <a href=\"#sapphire\">Sapphire<\/a>, <a href=\"#zircon\">Zircon<\/a>.<\/p>\n<p>Rally scoring, games to 11, best of three.<\/p>\n<p><strong>At 10–10 the game is won by serve.<\/strong> A receiving team winning the rally scores nothing and only gains serve. This caps game length while keeping tension, which is smarter than win-by-two.<\/p>\n<p>It lands on the hottest and wettest months of the year by design. May and September both need matches that finish fast.<\/p>","x":null},{"i":"side-out","t":"Side-out to 11","c":"Formats","s":"","l":"Standard, unmodified, and it decides every Crown.","h":"<p>Played at the closing edition of each season: <a href=\"#amber\">Amber<\/a>, <a href=\"#emerald\">Emerald<\/a>, <a href=\"#onyx\">Onyx<\/a>.<\/p>\n<p>Standard side-out scoring, games to 11. No modifications.<\/p>\n<p>It is the longest and most traditional of the four formats, and it decides every <a href=\"#titles\">Crown<\/a> — because the season title should be settled on the game serious players consider the real test.<\/p>","x":null},{"i":"painite","t":"Painite","c":"Formats","s":"","l":"One invitational a year, for that year's podium finishers. Rally length is the damage it does.","h":"<p>Painite was for decades the rarest mineral known on Earth, with only a handful of specimens in existence. The event sits outside the twelve editions and outside the season structure. One event, once a year.<\/p>\n<h3>The format<\/h3>\n<p>Painite fuses the two most distinctive formats in the series: <a href=\"#team-deathmatch\">Team deathmatch<\/a> and <a href=\"#rally-length\">Rally-length scoring<\/a>. In the monthly editions these are separate events; here they combine into one mechanic.<\/p>\n<p><strong>A rally's length is the damage it does.<\/strong><\/p>\n<p>Rally scoring throughout: every rally has a loser, and the losing pair takes damage equal to the <em>exact number of net crossings<\/em>. One net crossing, one life. A four-crossing rally costs four lives; a twenty-crossing rally costs twenty. No cap, no banding — the number on the counter is the damage.<\/p>\n<h3>Why this inverts the problem<\/h3>\n<p>This is the opposite of ordinary rally-length scoring, and it is better. Nobody is rewarded for extending a rally — the loser is <em>punished<\/em> for it.<\/p>\n<p>So a pair unsure of winning wants the rally over quickly, and only extends when confident. There is no reason to stall, no reason to farm length, and no way to game the counter. The pressure sits entirely on the pair that is losing control of the point, and a long rally is genuinely dangerous to both sides while everyone on court watches the number climb.<\/p>\n<h3>Teams and lives<\/h3>\n<p>Four players, six pairs, as in <a href=\"#team-deathmatch\">Team deathmatch<\/a>. Each pair starts with lives set from the measured average rally length — roughly four times it, so a team absorbs about 24 rallies of damage and a match runs about 48. A single extraordinary rally can wipe a pair outright, which is intentional.<\/p>\n<p>The life count is the number most likely to need correcting. Count net crossings across thirty real rallies at the highest level available and set it from the actual average.<\/p>\n<h3>Rotation<\/h3>\n<p>King of the court: the losing pair rotates off, the winning pair stays on. A pair that keeps winning keeps playing while the opposing team cycles through its pairs looking for someone who can break the streak. Whether a streak needs capping is open — decide by playing it.<\/p>\n<h3>Qualification<\/h3>\n<p><strong>Invitational.<\/strong> Entry requires having placed at an edition during that year. That makes every edition placing a qualification rather than only an unlock, and guarantees the field is made entirely of that year's podium finishers.<\/p>\n<h3>Standing<\/h3>\n<p>Painite does <em>not<\/em> count toward Crown, Master, Full Spectrum or the Diamond. It sits outside the season structure and has its own trophy; folding it in would distort a system built around three seasons of four. What it has instead is its own collection — the rarest in the catalogue.<\/p>\n<h3>Placement<\/h3>\n<p>Proposed: between <a href=\"#onyx\">Onyx<\/a> and <a href=\"#kunzite\">Kunzite<\/a>, at the turn of the year. Onyx closes the competitive year, every title is settled, and the full field of that year's qualifiers exists. Painite then sits in the gap before Kunzite opens the new one.<\/p>","x":null},{"i":"titles","t":"Titles","c":"Formats","s":"","l":"Crown, Master, Full Spectrum and the Diamond.","h":"<table><thead><tr><th>Title<\/th><th>How it is earned<\/th><\/tr><\/thead><tbody>\n<tr><th>Crown<\/th><td>All four editions of one season, in the same year. Summer Crown, Rain Crown, Winter Crown.<\/td><\/tr>\n<tr><th>Master<\/th><td>All four of one season, across any number of years. Summer Master, Rain Master, Winter Master.<\/td><\/tr>\n<tr><th>Full Spectrum<\/th><td>All three Crowns in a single year.<\/td><\/tr>\n<tr><th>The Diamond<\/th><td>All twelve editions over a career.<\/td><\/tr>\n<tr><th><a href=\"#painite\">Painite<\/a><\/th><td>One invitational a year, open only to that year's podium finishers. Does not count toward the above.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Crown against Master<\/h3>\n<p>Crown is dominance in one year. Master is mastery over time. Because the four editions of a season use four different <a href=\"#formats-index\">formats<\/a>, either means winning across four different tests — traditional, rally, endurance and team.<\/p>\n<h3>The Diamond<\/h3>\n<p>Diamond is deliberately <em>not<\/em> one of the twelve. It is the colourless stone that contains every colour, for the player who has taken them all. Pulling it out of the rotation is what lets it mean that — spent on a month it would be one edition among twelve.<\/p>\n<p>A diamond does split white light into spectral colours, which is the &ldquo;fire&rdquo; you see in a cut stone. It is not the most dispersive gem — sphene, demantoid and zircon all disperse more — so do not claim that in copy. The part that matters is true: the stone has no colour of its own yet shows all of them.<\/p>\n<h3>Triple Crown<\/h3>\n<p>Left untouched. It keeps its existing pickleball meaning of men's, women's and mixed, which is why the seasonal system never uses it.<\/p>\n<h3>Accepted unevenness<\/h3>\n<p>The team format means one of the four Crown legs is won as one of four players rather than one of two. This is accepted: a Crown means versatility across formats, not uniformity of difficulty.<\/p>","x":null},{"i":"earned-access","t":"Earned access","c":"Kit","s":"","l":"Apparel cannot be bought. Placing at an edition unlocks that edition's collection.","h":"<p>Not membership tiers. <strong>Earned unlocks<\/strong> — winning is the only way in, and different achievements open different doors. Two players who have both won can have completely different purchasing access depending on what they accomplished, so what somebody owns becomes a visible record of what they did.<\/p>\n<p><em>Every achievement can become a key to something.<\/em><\/p>\n<h3>The four items<\/h3>\n<p>Four garments per stone, designed once and produced in twelve colourways. Jacket, cap and shirt are settled; the fourth is open.<\/p>\n<h3>What a placing unlocks<\/h3>\n<p>Podium placing sets the <strong>metal trim<\/strong>, and every placing unlocks all four items in that metal.<\/p>\n<table><thead><tr><th>Placing<\/th><th>Access<\/th><\/tr><\/thead><tbody>\n<tr><td>Bronze<\/td><td>All four items, bronze trim<\/td><\/tr>\n<tr><td>Silver<\/td><td>All four items, silver trim<\/td><\/tr>\n<tr><td>Gold<\/td><td>All four items, gold trim<\/td><\/tr>\n<\/tbody><\/table>\n<p>This was a deliberate reversal of an earlier draft that withheld items from lower placings. Most entrants are not athletes, and if the good pieces are reserved for the top bracket then the majority of people who win something can never own the thing that says so. A bronze at 3.0 and a bronze at open level own the same object: the shared ground is the placing, not the level.<\/p>\n<h3>The division mark<\/h3>\n<p>A small separate mark showing division — 3.0, 3.5, 4.0, Open — which marks <strong>the current year's winners only<\/strong>. Past winners keep permanent access to the line and buy the current design unmarked.<\/p>\n<p>That does two things. It gives champions a reason to compete again, since winning Ruby once gets you Ruby forever but winning it again gets you the marked version. And it makes the annual sale to past winners honest, because everyone knows what they are buying.<\/p>\n<p>Rules for the mark: separate position from the stone mark, smaller and subordinate — kept separate it is four marks, merged with the stone marks it becomes forty-eight. Open must read as clearly the strongest of the four rather than merely a fourth variant. No text, because the moment a number sits beside it, it becomes a label rather than insignia.<\/p>\n<h3>What a garment says<\/h3>\n<p>Three pieces of information, three separate visual elements, none multiplying the others: the colourway and <a href=\"#the-marks\">stone mark<\/a> say which stone, the metal trim says which placing, the division mark says which division this year. A red shirt with gold trim and an Open mark reads as Ruby, gold, Open.<\/p>\n<h3>Minimal execution<\/h3>\n<p>The garment is plain: one colour, one small mark, no graphics and no large prints. The value is in the fact that it cannot be bought, not in how it looks — a loud graphic argues for itself, a plain garment with a small mark does not need to. It also ages better, which matters when the point is that people keep it.<\/p>\n<p>The year belongs hidden, inside the collar on a woven label. Discoverable by the wearer, not announced to the room.<\/p>\n<p>The risk: minimal only works if execution is good. A cheap blank with a printed logo looks like a giveaway.<\/p>\n<h3>Still a framework<\/h3>\n<p>The architecture above the edition layer is sketched, not decided. Season and stone are <em>horizontal<\/em>; Crown and above are <em>vertical<\/em> — different axes, not rungs. A Ruby jacket and a Crown paddle should not be comparable objects. One suggestion worth testing: organise by kind of object rather than prestige, so editions get apparel, Crown and Master get equipment, and Full Spectrum and the Diamond stop being catalogue items altogether in favour of a commissioned piece specified with the player.<\/p>\n<p>See also <a href=\"#production\">Production and the refresh<\/a>, <a href=\"#the-marks\">The twelve marks<\/a>, <a href=\"#medals\">Medals<\/a>, <a href=\"#the-website\">The website<\/a>.<\/p>","x":null},{"i":"the-marks","t":"The twelve marks","c":"Kit","s":"","l":"Insignia from facet geometry, not logos. One colour, no sparkle, legible at 15mm.","h":"<p>Insignia, not logos. The reference is military badging: fixed positions, composable, legible at a glance to anyone who knows the system and meaningless to everyone else. A stranger sees a pattern; a player sees exactly which edition somebody won.<\/p>\n<h3>Where the geometry comes from<\/h3>\n<p>Each mark derives from that stone's <strong>real crystal structure or characteristic cut<\/strong>, seen from directly above or in profile — the flat geometric figure underneath, not a drawing of a gem and not a sparkle.<\/p>\n<p>This constraint is what makes twelve marks feel inevitable rather than arbitrary, and it produces genuine differentiation for free, because these stones really do have different structures.<\/p>\n<h3>Hard constraints<\/h3>\n<ul><li><strong>One colour on one background.<\/strong> No gradients, no transparency, no sparkle. Colour is carried by the palette elsewhere; the mark must survive in black on white.<\/li>\n<li><strong>Legible at 15mm embroidered and at two metres printed.<\/strong> Test both before delivering.<\/li>\n<li>No text, no numerals, no literal gem illustrations.<\/li>\n<li>Consistent optical weight, so no mark disappears next to another.<\/li><\/ul>\n<h3>How the twelve separate<\/h3>\n<p>Seven are unique by silhouette before any styling decision:<\/p>\n<table><thead><tr><th>Stone<\/th><th>Structure<\/th><th>Distinct because<\/th><\/tr><\/thead><tbody>\n<tr><td><a href=\"#zircon\">Zircon<\/a><\/td><td>Tetragonal — a square prism<\/td><td>The only four-fold mark, where almost everything else is six-fold<\/td><\/tr>\n<tr><td><a href=\"#emerald\">Emerald<\/a><\/td><td>The step cut it gave its name to<\/td><td>The only rectangle<\/td><\/tr>\n<tr><td><a href=\"#amber\">Amber<\/a><\/td><td>Amorphous — no crystal lattice at all<\/td><td>The only mark with no straight lines<\/td><\/tr>\n<tr><td><a href=\"#onyx\">Onyx<\/a><\/td><td>Cryptocrystalline, straight parallel banding<\/td><td>The only banded solid<\/td><\/tr>\n<tr><td><a href=\"#moonstone\">Moonstone<\/a><\/td><td>A domed cabochon with adularescence<\/td><td>Curved outline, no faceting, an off-centre arc<\/td><\/tr>\n<tr><td><a href=\"#peridot\">Peridot<\/a><\/td><td>Strong double refraction<\/td><td>Every line drawn twice, slightly offset<\/td><\/tr>\n<tr><td><a href=\"#kunzite\">Kunzite<\/a><\/td><td>Monoclinic, long prismatic, striated<\/td><td>Thinnest and tallest, lightest stroke weight<\/td><\/tr>\n<\/tbody><\/table>\n<p>The five hexagonal stones carry the real risk and separate on their interiors: <strong><a href=\"#citrine\">Citrine<\/a><\/strong> single, open and radial; <strong><a href=\"#ruby\">Ruby<\/a><\/strong> single, dense, heaviest weight; <strong><a href=\"#sapphire\">Sapphire<\/a><\/strong> single, concentric, layered; <strong><a href=\"#aquamarine\">Aquamarine<\/a><\/strong> elongated and most open; <strong><a href=\"#amethyst\">Amethyst<\/a><\/strong> clustered.<\/p>\n<p>Ruby and Sapphire share the hexagonal base because they are the same mineral, which is a hidden accuracy worth having. Citrine and Amethyst are also the same mineral and separate as one point against many — which is genuinely how the two occur.<\/p>\n<h3>Process<\/h3>\n<p><strong>Draw all twelve as one batch,<\/strong> before any product work. Drawn one at a time across a year they drift and the family resemblance disappears. The differentiation test: print all twelve at 15mm in one colour, shuffle them, and have somebody who has seen the set once identify each. If any two are confused, they are not distinct enough.<\/p>\n<p><strong>Do not source from<\/strong> tā moko or other culturally specific tattoo traditions. The principle is right; the visual language is not ours to take. Thai ornament — ลายไทย, yantra design — has the same quality of composed, meaningful, non-literal form, used as sensibility rather than as a pattern library.<\/p>","x":null},{"i":"medals","t":"Medals","c":"Kit","s":"","l":"Real stones set into them, which is also the strongest sponsor conversation in the project.","h":"<p>Set an actual gem in each medal. A medal with a real stone does not go in a drawer, and somebody chasing a <a href=\"#titles\">Crown<\/a> is collecting four real gems rather than four discs.<\/p>\n<table><thead><tr><th>Tier<\/th><th>Stones<\/th><th>Cost<\/th><\/tr><\/thead><tbody>\n<tr><td>Cheap and easy<\/td><td>Amber, Amethyst, Onyx, Citrine, Peridot<\/td><td>A 6–8mm cabochon at Bangkok wholesale costs tens of baht<\/td><\/tr>\n<tr><td>Moderate<\/td><td>Aquamarine, Zircon, Moonstone, Kunzite<\/td><td>Low hundreds of baht in small calibrated sizes<\/td><\/tr>\n<tr><td>Viable with commercial-grade material<\/td><td>Ruby, Sapphire, Emerald<\/td><td>Chanthaburi has volume in exactly this<\/td><\/tr>\n<\/tbody><\/table>\n<p>Two honest approaches where cost bites: real stones for champions with enamel or coloured glass elsewhere on the podium, or lab-created stones stated openly. Lab stones are chemically identical and nobody serious objects.<\/p>\n<p><strong>This is probably the strongest sponsor conversation available.<\/strong> A gem house supplying twelve months of stones gets a concrete story rather than a logo on a banner. Price it with a Chanthaburi setter early.<\/p>\n<p>Six of the twelve — Ruby, Sapphire, Emerald, Zircon, Moonstone and Amethyst — have some claim to นพรัตน์ or Thai trade provenance. Worth verifying with a Thai gemologist, and pitching as <em>anchored in<\/em> the tradition rather than <em>based on<\/em> it.<\/p>","x":null},{"i":"production","t":"Production and the refresh","c":"Kit","s":"","l":"Print on demand, staggered release, and an annual colourway refresh that is the real ongoing design job.","h":"<h3>Print on demand for everything gated<\/h3>\n<p>Locked items have tiny populations by design, so holding stock is the worst possible model. Make each piece when it is ordered. It costs more per unit and takes longer to arrive, but there is no inventory risk and it allows far more variety than stock economics would.<\/p>\n<h3>Stagger the release<\/h3>\n<p>Each edition's collection appears in the month of that edition. Twelve small launches instead of one enormous one, spreading the work across the year and giving each month a commercial moment.<\/p>\n<h3>The annual refresh<\/h3>\n<p><strong>This is the ongoing design job.<\/strong> The champion population only grows, so in a few years there will be hundreds of past winners with permanent access and nothing new to buy. A fresh design each year gives every one of them something, every year, without anybody having to win again — recurring revenue from a group that has already proven it will spend.<\/p>\n<p>Rules for the refresh: same four garments, same twelve <a href=\"#the-marks\">marks<\/a>, only colourway and detailing change, timed to February so the new range lands with the new season in March. Without that constraint, a new designer will want to redesign the garments and the collection stops looking like a collection.<\/p>\n<p>Hire for a retained relationship, not a one-off commission. The system gets built in year one; the refresh runs every year after. It is the football-kit model: the badge never changes, the shirt changes every season.<\/p>\n<h3>Design load<\/h3>\n<p>The catalogue looks enormous. The design work behind it is not:<\/p>\n<ul><li>4 garment designs<\/li><li>12 stone marks<\/li><li>12 palettes<\/li><li>3 metal accents<\/li><li>4 division marks<\/li><li>1 colourway refresh per year<\/li><\/ul>\n<p>Everything else is combination.<\/p>\n<h3>Sequencing<\/h3>\n<p><strong>Do not launch the shop in year one.<\/strong> A store where every collection has one or two holders looks empty rather than exclusive. Run the first year as a normal series with good open merchandise, record everything, and open the gated catalogue in year two with a full year of winners behind it. That also buys time to get the twelve marks drawn properly rather than rushing them for a March launch.<\/p>\n<p><strong>Build the holder records from event one.<\/strong> Not the website — just the data. Edition, year, division, placing, names as they will appear publicly. Trivial now, impossible to reconstruct in three years.<\/p>","x":null},{"i":"the-website","t":"The website","c":"Kit","s":"","l":"Collection pages link to results pages. Results are the only place names live.","h":"<p><strong>No separate holder list.<\/strong> A collection page names the events that unlock it and links directly to those results pages. Results are the only place names live, and everything else points at them.<\/p>\n<ul><li><strong>Link explicitly.<\/strong> If somebody has to search the archive, verification stops being real.<\/li>\n<li><strong>Keep results URLs permanent.<\/strong> The 2026 page must still work in 2034 at the same address — a hosting decision to make now, not after a rebuild breaks every link.<\/li>\n<li><strong>Locked pages should be browsable, not hidden.<\/strong> Somebody who has not won Onyx should see the Onyx collection and be unable to buy it. Hiding it removes the aspiration; showing it is the whole incentive.<\/li><\/ul>\n<h3>Scarcity is knowable in advance<\/h3>\n<p>The calendar does the maths. Onyx Open is won once a year, forever, which tells somebody what a piece will be worth in ten years rather than just today. Make it visible with a line on each collection page — <em>awarded once per year, to the Onyx Open champion<\/em> — rather than a counter to maintain.<\/p>\n<h3>PDPA<\/h3>\n<p>Names appear on results pages, so the entry form needs a specific consent tick: name, division, edition and year may be published on the site. Opt-out available with results withheld by request, and separate parental consent for minors, with first name and initial worth considering for under-18s.<\/p>\n<p>Worth a Thai lawyer reviewing the form once. It covers every event for years.<\/p>","x":null},{"i":"world","t":"The world","c":"Wo
