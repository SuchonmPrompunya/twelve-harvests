rld","s":"","l":"A fiction built on the same twelve stones. It shares them with the tournament and nothing else.","h":"<p>The tournament and the story are <strong>not the same world<\/strong>. They share the twelve stones and nothing else.<\/p>\n<table><thead><tr><th><\/th><th>The tournament<\/th><th>The story<\/th><\/tr><\/thead><tbody>\n<tr><th>Where<\/th><td>Thailand, real<\/td><td>An invented country<\/td><\/tr>\n<tr><th>Seasons<\/th><td>Three, real Thai ones<\/td><td>Whatever the story needs<\/td><\/tr>\n<tr><th>Calendar<\/th><td>Twelve editions, one a month<\/td><td>The stones need not sit in months at all<\/td><\/tr>\n<tr><th>Festivals<\/th><td>Real Thai ones<\/td><td>Its own<\/td><\/tr>\n<\/tbody><\/table>\n<p>Nothing in the story has to line up with the tournament. <a href=\"#ruby\">Ruby<\/a> need not be May; there need not be three seasons, or twelve regions, or a neat one-stone-per-month arrangement. The tidiness of the tournament calendar is a decision an organisation made in the real world, not a fact the story has to explain or honour.<\/p>\n<p>That matters because twelve stones, twelve months and twelve nations all lining up is too neat to believe in a real world. In the tournament it is fine, because somebody chose it. In the story it should not be assumed at all.<\/p>\n<h3>In the fiction<\/h3>\n<p><a href=\"#spectra\">Spectra<\/a> is the sport. <a href=\"#guardians\">Guardians<\/a> are what the land becomes. <a href=\"#looms-and-guides\">Looms and Guides<\/a> make a harvest possible, <a href=\"#the-harvest\">The harvest<\/a> is how a stone is won, and <a href=\"#stones\">Stones<\/a> run everything afterwards. <a href=\"#weapons\">Weapons and the law<\/a> explains why anybody plays at all, and <a href=\"#the-harvest-economy\">The harvest economy<\/a> explains who profits. <a href=\"#the-counting\">The Counting<\/a> is how twelve nations became the twelve, and <a href=\"#the-unchosen\">The unchosen player<\/a> is the story itself.<\/p>\n<h3>Tone<\/h3>\n<p>Crafted, not manufactured. Workshops, makers, weaving, gem cutting and metalwork — closer to craft and folklore than science fiction. Southeast Asian register: monsoon-belt geography, tropical wildlife, regional craft traditions. But the place is invented, and no land maps onto a real ethnic group or borrows a living tradition's sacred material.<\/p>","x":null},{"i":"spectra","t":"Spectra","c":"World","s":"","l":"The name of the sport inside the fiction. Never pickleball.","h":"<p><strong>Spectra is the sport.<\/strong> Inside the world it is the only name used: a Spectra court, a Spectra player, a Spectra match, Spectra doubles.<\/p>\n<p>Harvesting uses Spectra. A <a href=\"#looms-and-guides\">Loom<\/a> teaches a <a href=\"#guardians\">guardian<\/a> the rules of Spectra, and the harvesters defeat it in a Spectra doubles match. The twelve stone powers are part of Spectra play, not additions to it.<\/p>\n<p><strong>Never write &ldquo;pickleball&rdquo; in the fiction<\/strong> — not in narration, not in dialogue, not as an aside explaining what Spectra resembles. The word does not exist in that world, and a reader will understand what they are looking at without being told.<\/p>\n<p>The real-world series is a pickleball series. That is a fact about the business, not about the world.<\/p>\n<h3>What the game actually is<\/h3>\n<p>The constitution is tiny: <strong>two sides, divided by something, and one bounce.<\/strong><\/p>\n<p>Everything else is whatever the garden gives you — see <a href=\"#the-harvest\">The harvest<\/a>. That is also exactly the right amount of invariant to cover tennis, padel and pickleball, because those three already only share about that much. Everything that distinguishes them is court furniture.<\/p>\n<p>There is a real precedent, which makes it feel researched rather than invented: every surviving real tennis court is different. Hampton Court and Falkland Palace are not the same dimensions, the penthouses and tambours vary by venue, and the game accommodates it. Players learn the room. Village football codes worked the same way before anyone wrote them down — shared deep rules, local everything else.<\/p>","x":null},{"i":"guardians","t":"Guardians","c":"World","s":"","l":"The land's accumulated energy and memory, taking form with a raw gem at its heart.","h":"<p>The world builds up energy. Sometimes it erupts as a volcano; sometimes it becomes a <strong>guardian<\/strong> — the land's accumulated energy and memory taking form, with a raw gem at its heart. Memory gives it its shape and style; energy gives it its strength.<\/p>\n<p>A guardian is not a species and cannot be driven extinct by losing a single harvest. If one is lost, the land can eventually build enough energy to form another.<\/p>\n<h3>Mirroring is intrinsic<\/h3>\n<p>A guardian mirrors what it is shown. This exists before any <a href=\"#looms-and-guides\">Loom<\/a> and cannot be removed. Attack one and it mirrors the violence, releasing everything at once like a volcano — <strong>weapons never work on guardians.<\/strong> Play with one and it plays back.<\/p>\n<p>An altered or illegal Loom can teach different rules, but it cannot remove mirroring. Teach a guardian a different game and it plays that game back; teach it to fight and it fights back. Which is why changing the rules is no easy route to overpowering them.<\/p>\n<h3>Animal forms, and the moral engine<\/h3>\n<p>Guardians take the shapes of creatures from their own land. <strong>This is the world's moral engine and must be kept.<\/strong><\/p>\n<p>What the land remembers depends on what actually lives there. As animals and environments disappear, the guardian forms associated with them grow rarer, then stop appearing altogether. <em>A form lost from the wild is eventually lost from the harvest.<\/em><\/p>\n<p>Protecting wildlife and landscape therefore preserves the forms guardians can take — conservation and the sport's own future are the same problem. Old guardian stones may hold creatures that no longer appear anywhere in the wild, which makes them irreplaceable in a way no grade or rarity can express.<\/p>\n<p><a href=\"#zircon-nation\">Zircon<\/a> carries most of this weight: it sits on the oldest ground, so its land remembers longest, and forms appear there that exist nowhere else. Its fear is the thaw.<\/p>\n<h3>Signs and tracking<\/h3>\n<p>Each land leaves traces before a guardian forms: hot ground in Ruby, still water in Sapphire, frost in Zircon, light at night on the Lantern Lake. Bigger signs mean bigger guardians. Trackers read the signs for a living, and detectors sense energy build-up.<\/p>\n<p>A wild guardian is abstract and cannot be touched, fought or played until a Loom gives it form.<\/p>\n<h3>Dispersing one<\/h3>\n<p>A wild guardian need not be harvested. One forming somewhere unwanted can be dispersed before a Loom gives it playable form. The energy is neither collected nor destroyed — it returns to the wider land and may gather elsewhere.<\/p>\n<p>Ownership follows the land: a guardian forming on private property belongs to the landowner to deal with, and guardians on public land are a public resource.<\/p>","x":null},{"i":"looms-and-guides","t":"Looms and Guides","c":"World","s":"","l":"Both weave prediction. One makes a harvest possible; the other talks.","h":"<p>Both weave prediction. The Loom weaves memory and energy into form; the Guide weaves words. They work on the same principle — guessing what comes next — and this shared basis is deliberate. They are one family of craft, not two unrelated inventions.<\/p>\n<p>Both are built by skilled makers in workshops, from many empty <a href=\"#stones\">Stones<\/a>. They look woven and handmade, closer to craft than to machines.<\/p>\n<h3>The Loom<\/h3>\n<p>Set up near a wild <a href=\"#guardians\">guardian<\/a>, it gives the guardian a body and teaches it the rules. It guesses the guardian's next move from the land's memory, which is why guardians have tendencies players can learn to read.<\/p>\n<p>A Loom does <em>not<\/em> create two guardians. It gives one guardian <strong>two projected bodies<\/strong> so it can play doubles. Both are expressions of the same being, sharing energy and memory.<\/p>\n<p>A Loom is built with stones from the land it harvests in, so a Ruby Loom works on Ruby guardians — and a Ruby Loom cannot raise a lake shore. Device quality matters: cheap or damaged Looms teach the rules badly, which makes cracking a forming gem far more likely.<\/p>\n<p><strong>The Loom does not own the court.<\/strong> Its job is the guardian; the garden comes from the stone and the land, and nobody made it. So the houses own the Looms but not the court. Nobody owns the court, and it is the only limit on them — see <a href=\"#the-harvest-economy\">The harvest economy<\/a>.<\/p>\n<h3>The Guide<\/h3>\n<p>A small handheld device with an <strong>Amber<\/strong> at its core. It has learned from so many words that it guesses the most likely next one and weaves them into sentences. It answers questions, reads guardian signs, and records the guardians you have faced.<\/p>\n<p>Amber is the right stone for it and not an arbitrary choice. Amber is resin that has held its contents for millions of years — Holding on court, keeping food from spoiling in daily life, and in a Guide holding an enormous weight of past speech. All three are the same property. <em>A Guide is a stone that remembers.<\/em><\/p>\n<p>Sapphire was considered and rejected: it already carries the Reading power on court and the judgement stone in society, and giving it the Guides as well would make one stone quietly the most important thing in the world.<\/p>\n<p><strong>The resemblance to a real language model is intentional.<\/strong> Do not hide it, do not apologise for it, and do not invent coy alternative names. It is this world's version of the same idea, built from stones and craft instead of silicon. Describe it once and keep it in the background.<\/p>\n<p><a href=\"#amber-nation\">Amber<\/a> makes the Guides every other kingdom depends on, which is why it is quietly the most powerful nation in the world and nobody thinks of it that way.<\/p>","x":null},{"i":"the-harvest","t":"The harvest","c":"World","s":"","l":"Touch the stone and a garden opens with a court in it. Win, and two stones form.","h":"<p>Touch the gem and the energy that has been building there lets go, and what it makes is a <strong>garden with a court in it<\/strong>. It is the same pressure that makes a volcano, released the other way: volcano or garden.<\/p>\n<p>It will probably look like the land around it, because the energy came from there. The exception is the interesting part: the land remembers further back than whatever is currently growing on it, so a harvest in dry scrub that opens into wetland is showing you what that ground used to be. Spawn a garden full of creatures nobody has seen alive and you are standing in a landscape that is gone, for as long as the harvest lasts.<\/p>\n<p>That gives scholars and conservationists a reason to care about harvests that has nothing to do with money, and it makes the strange ones valuable — most harvests give a slightly heightened version of where you are standing, and occasionally one opens somewhere else entirely.<\/p>\n<h3>What you know walking in<\/h3>\n<p><strong>Two sides, divided by something. One bounce.<\/strong> That is the whole constitution.<\/p>\n<p>Everything else is whatever the garden gives you: what the divider is made of, how tall it stands, whether it has gaps, where out begins and how gradually, how big the court is, whether there are walls, how the score works, when it stops.<\/p>\n<p>Out is not a line but a <strong>gradient<\/strong> — where the ground changes, where the flowers thin, where the frost gets too slick to stand on. Deep out is obvious and the edge is genuinely arguable, and you find out from the score. Which means something is keeping score, and that something is the Loom. It does not explain itself, and there is no appeal.<\/p>\n<p>Dividers are whatever the land gave: a line of standing stones with gaps you can hit <em>through<\/em> as well as over, a fissure venting heat, moored poles on a sandbar, a terrace wall, mist thick enough that out is invisible. <a href=\"#onyx-nation\">Onyx<\/a> is the only kingdom whose divider is built rather than grown or found — of course it is.<\/p>\n<h3>Your paddle<\/h3>\n<p><strong>Your own stone unfolds into your paddle.<\/strong> So the paddle is not a channel for the power, it <em>is<\/em> the power: Ruby's Weight is not an effect applied to a neutral paddle, the paddle is Ruby.<\/p>\n<p>Your cut determines its shape. A brilliant cut spawns a wide busy face, a step cut something narrow and precise, a cabochon something thick and forgiving. A borrowed stone spawns a paddle that does not fit your hand — the loyalty percentage made physical, a grip slightly wrong and a balance point an inch off. You can see somebody playing a stone they did not win.<\/p>\n<p>It also means there is no equipment market. No paddle brands, no gear arms race, no sponsorship category. The only equipment is the stone.<\/p>\n<h3>Outcomes<\/h3>\n<table><thead><tr><th>Result<\/th><th>What happens<\/th><\/tr><\/thead><tbody>\n<tr><td>Win<\/td><td>Two stones form, one per partner. Only one holds the guardian.<\/td><\/tr>\n<tr><td>Lose<\/td><td>The energy escapes and forms somewhere else.<\/td><\/tr>\n<tr><td>Push too hard<\/td><td>The gem cracks. If it breaks, the guardian is gone forever.<\/td><\/tr>\n<\/tbody><\/table>\n<p>Cracks warn first, so players can see the danger and choose whether to stop. Real gem toughness sets the risk: ruby and sapphire are tough, emerald and zircon brittle.<\/p>\n<h3>Why two stones form<\/h3>\n<p>A successful doubles harvest crystallises one stone per living player. The guardian remains one being and enters only one of them; the other is an <strong>empty stone<\/strong> — real land energy crystallised into a gem, with no guardian inside. That is why both partners receive something when only one receives the guardian.<\/p>\n<h3>How a guardian chooses<\/h3>\n<p><strong>Guardians tend toward the weaker partner, and nobody knows why.<\/strong> It is a tendency, not a rule, and style and personality may also matter.<\/p>\n<p>The logic people propose: a guardian wants to be used, and a strong player already has a strong main stone, so a new guardian would sit unused where a weaker player will make it their main. Nobody can confirm it.<\/p>\n<p>People have recognised the pattern for generations without understanding it, which has produced sandbagging, superstition, players hiding their ability, and stronger harvesters deliberately partnering with weaker ones. None of it guarantees anything.<\/p>\n<h3>Who counts as a player<\/h3>\n<p>There is no supernatural caste. A player is a living person participating in the game, and <strong>the test is the Loom<\/strong>: if it has placed you on the court, you are a player. Trackers, Loom operators, owners and spectators are not, however much they contributed or how close they stand.<\/p>\n<p>That closes the obvious loopholes. A harvest is always doubles — the Loom gives the guardian two bodies for two players and cannot be made to produce more — so nobody can be added to claim a share, and nobody can harvest by proxy.<\/p>\n<p>In principle anyone can learn to play and become a harvester. In practice it requires access to guardians, trackers, the correct Loom, and enough skill to win without damaging the forming gem.<\/p>","x":null},{"i":"stones","t":"Stones","c":"World","s":"","l":"A stone cuts itself to whoever receives it. Grade times loyalty sets what it can do.","h":"<p>A stone cuts itself to whoever receives it, so no two are ever alike. The stone brings its origin, grade and inclusions; the person brings the cut, and a stone can re-cut if its owner changes deeply.<\/p>\n<p>Cuts shape power: a brilliant cut scatters it into many small effects, a step cut is precise and direct, a cabochon is steady and long-lasting. Inclusions give each stone one quirk no other stone has. Grades run from cloudy to flawless.<\/p>\n<table><thead><tr><th><\/th><th>Guardian stone<\/th><th>Empty stone<\/th><\/tr><\/thead><tbody>\n<tr><th>Holds a guardian<\/th><td>Yes<\/td><td>No<\/td><\/tr>\n<tr><th>Power<\/th><td>Full<\/td><td>Raw only<\/td><\/tr>\n<tr><th>Unique technique<\/th><td>Yes<\/td><td>No<\/td><\/tr>\n<tr><th>Can reach flawless<\/th><td>Yes<\/td><td>No<\/td><\/tr>\n<tr><th>Main uses<\/th><td>Competing<\/td><td>Industry, feeding other stones, cheaper play<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Powers<\/h3>\n<p>The stone type sets the <em>kind<\/em> of power; each player develops their own technique. Conditions a player sets on themselves make a technique stronger — the harder the condition, the stronger the power. Flawless is the peak: player and stone in perfect sync, and the guardian emerges on court. Short, and costly.<\/p>\n<p><strong>Power always goes through the ball, never at a person.<\/strong> See <a href=\"#weapons\">Weapons and the law<\/a>.<\/p>\n<h3>Grade and loyalty<\/h3>\n<p>Real power is grade times a percentage, and the percentage is a ceiling familiarity has to earn. A stone gives everything to the hand that won and selected it, less to any other hand, and least when it is not selected at all — a guardian is loyal to whoever beat it and only half cooperates with anyone else, and a stone that is not selected has a sleeping guardian.<\/p>\n<p><strong>Grade beats loyalty.<\/strong> A fraction of a flawless stone can beat all of a cloudy one, which is why weaker players often use strong stones others harvested — and why <em>bought stone<\/em> is an insult. That tension between what the culture honours and what actually wins is deliberate.<\/p>\n<p>One main stone at a time, and you can switch. A new stone starts well below its ceiling and time with it raises output, like breaking in a paddle; familiarity fades with disuse. Tournaments allow one to three stones, harvested by you or not.<\/p>\n<h3>Decay and feeding<\/h3>\n<p><strong>Use is what costs a stone, not time.<\/strong><\/p>\n<p>A stone left alone fades so slowly it will outlast its owner. Heirlooms are ordinary, and old guardian stones can hold creature forms that no longer appear in the wild. A stone in use is another matter: ordinary stones powering everyday life have modest, predictable upkeep, while a guardian stone driven hard in competition burns through energy fast.<\/p>\n<p>Feeding transfers energy from other stones, which are used up in the process. The same type transfers best — Ruby into Ruby works fully, other types lose some. Feeding replaces lost energy but <em>never<\/em> improves grade. A cloudy stone cannot become flawless.<\/p>\n<p>So the pressure falls on competitors, not everyone. An active career means permanently buying fuel from the people who control supply, and a player who cannot afford it watches their output fall while their stone is still perfectly good. Stepping back from competition is also stepping out of that dependence — which makes retirement a real escape rather than a slow decline, and gives the houses a reason to push people back onto the court.<\/p>\n<h3>How many stones there are<\/h3>\n<p><strong>There are many stones. Twelve happen to matter.<\/strong><\/p>\n<p>Dozens occur across the country, most doing small unglamorous jobs — one that keeps a lamp wick from fouling, one that stops rope rotting, one that only works underwater. Cheap, local, and nobody builds a career on them.<\/p>\n<p>Twelve became economically indispensable, the way gold, silver, copper and iron became money and infrastructure while hundreds of other minerals stayed obscure. Ruby heats the forges, Peridot feeds the country, Amber preserves it and powers its Guides, Aquamarine moves everything, Onyx builds what must not fall.<\/p>\n<p>The twelve are <em>not<\/em> a natural law. They are the current answer to an economic question. The number has changed — there have been more and fewer — and stones have risen from worthless to essential and fallen back, which people know. That removes the coincidence: twelve stones, twelve months and twelve nations lining up is otherwise too neat to believe.<\/p>\n<p>Deposits follow the land, not borders. Regions blur and overlap, some places yield two or three stones, and <strong>most places produce nothing at all<\/strong> — cities, worked farmland, anywhere the land's memory has been flattened. Most people live nowhere in particular and simply buy what they need.<\/p>","x":null},{"i":"weapons","t":"Weapons and the law","c":"World","s":"","l":"Why a civilisation with gemstone power plays a game instead of fighting.","h":"<p><strong>A body releases only a little of a stone's power. A weapon releases all of it. The weakest person with a stone weapon beats the strongest stone holder. Always.<\/strong><\/p>\n<h3>All stone weapons are lethal. There are no tiers.<\/h3>\n<p>Grade, loyalty, guardian stones, empty stones — none of it scales a weapon's output. A weapon is a weapon, the way a gun is a gun. Any stone in a weapon kills anyone holding a stone in their hand.<\/p>\n<p>This is deliberate. Weapons are a <strong>sealed door, not a back room<\/strong>:<\/p>\n<ul><li>No weapon-versus-weapon matchups, because that would rebuild the combat system the rule exists to prevent.<\/li>\n<li>No interesting armed encounters. Armed encounters are simply over.<\/li>\n<li>No arms race, no weapon techniques, no weapon-grade market.<\/li><\/ul>\n<p>Weapons should be boring. Their entire narrative function is to be the thing that is not allowed, so that power has nowhere to go but the court.<\/p>\n<h3>The central logic<\/h3>\n<p>This chain explains why a civilisation with gemstone power plays <a href=\"#spectra\">Spectra<\/a>. It should be legible in the world without being lectured about.<\/p>\n<blockquote><p><strong>Gemstones create power.<br>Weapons make that power dangerous.<br>Law controls weapons.<br>Spectra gives people a legal way to use and compete with power.<\/strong><\/p><\/blockquote>\n<p>It holds because of the rule that sits under everything: <strong>power affects play, never players.<\/strong><\/p>\n<p>Stone powers act on the ball and the play around it. They do not transfer supernatural force into another person's body. A Ruby holder can produce an extraordinary Ruby-powered shot; they cannot point a hand at somebody and blast them. A ball can hurt someone the ordinary physical way a ball can — it cannot become a magical projectile.<\/p>\n<p>A weapon is different, which is why possession and use of stone weapons sit under ordinary law, in the same conceptual category as any society's most tightly controlled instruments of force.<\/p>\n<p>The equilibrium that produces: <strong>if you want to exercise extraordinary gemstone power legally, you play.<\/strong> That is what makes the sport make sense inside the civilisation, rather than only because the story happens to be about a sport.<\/p>\n<h3>Why powers moved to sport<\/h3>\n<p>Powers once won fights. Weapons made that impossible, so the court became the one place powers still matter. And players stay essential because weapons cannot harvest — only players can win stones from guardians.<\/p>","x":null},{"i":"the-harvest-economy","t":"The harvest economy","c":"World","s":"","l":"A closed loop, three parties, and the world's central political fault line.","h":"<h3>The closed loop<\/h3>\n<p>Harvests produce empty stones. Makers consume empty stones to build <a href=\"#looms-and-guides\">Looms<\/a>. Looms make harvests possible.<\/p>\n<p>The system eats its own output, which means demand never ends and whoever controls Looms controls access to everything.<\/p>\n<h3>Three parties to every harvest<\/h3>\n<p><strong>The landowner.<\/strong> Guardians form where they form. Private land means the landowner decides whether a harvest happens at all, and takes a share.<\/p>\n<p><strong>The house.<\/strong> Looms are land-specific — a Ruby Loom only works on Ruby guardians — so each of the twelve lands has its own workshops, makers and Loom tradition. These are the houses. They own the Looms, employ the trackers, and hold the relationships with landowners.<\/p>\n<p><strong>The harvesters.<\/strong> Two living players. They take all the physical risk and are the only people who can complete the work.<\/p>\n<h3>The standard contract<\/h3>\n<p><strong>The house takes the empty stone. The harvesters keep the guardian stone.<\/strong><\/p>\n<p>This is elegant because it matches the harvest exactly — one guardian stone, one empty stone, and the house needs empty stones to build more Looms. It is also brutal, because nobody knows which partner will be chosen until it is over. The chosen partner walks away with a guardian; the other walks away with nothing.<\/p>\n<p>Variations exist: cheaper houses on worse land take a smaller share, some let harvesters keep the empty stone and charge a fee instead, and independents who own or rent their own Loom keep both stones but carry land access, upkeep and tracker costs themselves.<\/p>\n<h3>Kinds of harvester<\/h3>\n<ul><li><strong>House harvesters<\/strong> — salaried, stable, low share. Reliable work, little upside.<\/li>\n<li><strong>Contract harvesters<\/strong> — paid per harvest, higher share, no security.<\/li>\n<li><strong>Independents<\/strong> — own or rent a Loom, keep everything, fund everything. Rare and precarious.<\/li>\n<li><strong>Poachers<\/strong> — harvesting on land they have no claim to, with unlicensed or altered Looms. A cheap Loom teaches the rules badly, which makes cracking a gem far more likely.<\/li><\/ul>\n<h3>Where the pressure comes from<\/h3>\n<p><strong>Houses want scarcity.<\/strong> Too many stones and prices fall. A house that knows where a guardian is forming has every reason to wait, and can disperse one it does not want harvested — the energy simply returns to the land.<\/p>\n<p><strong>Decay makes competitors customers.<\/strong> Use is what drains a stone, so the pressure falls on the people who play. See <a href=\"#stones\">Stones<\/a>.<\/p>\n<p><strong>The divide.<\/strong> Houses own the means; harvesters take the risk of a cracked gem, a wasted season, a career that never produces a guardian. This is the world's central political fault line and the natural source of its conflict.<\/p>\n<p><strong>Twelve houses, twelve lands.<\/strong> Because Looms are land-specific, no single house can control everything. Each land has its own power centre, its own traditions and its own quarrels with the others.<\/p>\n<p><a href=\"#peridot-nation\">Peridot<\/a> is the only nation where harvesters own the means — a cooperative, in a world where every other country's harvesters work for somebody. That makes it the natural centre of any conflict about the divide.<\/p>","x":null},{"i":"the-counting","t":"The Counting","c":"World","s":"","l":"A twelve-day gathering six hundred years ago. Twelve is just how many were still standing at the end.","h":"<p>Before the Counting nobody agrees how many stones mattered. <a href=\"#amber-nation\">Amber<\/a>'s records say nine. <a href=\"#sapphire-nation\">Sapphire<\/a>'s say fourteen. A fragment kept in <a href=\"#emerald-nation\">Emerald<\/a> lists seventeen, and three of those names mean nothing to anyone now.<\/p>\n<p>What is agreed: there was a gathering, it lasted twelve days, and at the end of it there was a list.<\/p>\n<p>Sapphire convened it and wrote the record — which is why the record is in Sapphire's hand, and why nobody entirely trusts it. <a href=\"#citrine-nation\">Citrine<\/a> paid for it, which Citrine has never stopped mentioning and nobody else has ever stopped resenting. The delegations stayed in <a href=\"#amethyst-nation\">Amethyst<\/a>, because delegations always stay in Amethyst.<\/p>\n<p><strong>Nobody set out to found twelve.<\/strong> Twelve is just how many kingdoms were still standing at the end of it with a stone and a player.<\/p>\n<p>Years are counted from the Counting. It is now the six hundred and forty-first — except in <a href=\"#zircon-nation\">Zircon<\/a>, which does not date its years from it and will tell you which year it actually is.<\/p>\n<h3>What each one did<\/h3>\n<table><tbody><tr><th><a href=\"#kunzite-nation\">Kunzite<\/a><\/th><td>Sent a different delegation on each of the twelve days.<\/td><\/tr><tr><th><a href=\"#citrine-nation\">Citrine<\/a><\/th><td>Funded the Counting and has never let anyone forget. The word for sponsor in three kingdoms is a Citrine loanword.<\/td><\/tr><tr><th><a href=\"#ruby-nation\">Ruby<\/a><\/th><td>Arrived first, and has mentioned it every year since.<\/td><\/tr><tr><th><a href=\"#amber-nation\">Amber<\/a><\/th><td>Kept the only complete record of all twelve days, and has never let anyone read it.<\/td><\/tr><tr><th><a href=\"#peridot-nation\">Peridot<\/a><\/th><td>Sent farmers, because it was planting season and the fields don't wait for a gathering. They nearly didn't make the list. Bring it up and watch what happens.<\/td><\/tr><tr><th><a href=\"#aquamarine-nation\">Aquamarine<\/a><\/th><td>Arrived four days late because the channels moved, argued for a day and a half, and got on anyway.<\/td><\/tr><tr><th><a href=\"#sapphire-nation\">Sapphire<\/a><\/th><td>Convened the gathering, kept the minutes, and is still being accused of it. The record is in Sapphire's hand, which is why nobody entirely trusts it.<\/td><\/tr><tr><th><a href=\"#emerald-nation\">Emerald<\/a><\/th><td>Attended as physicians, not as players. Nobody can explain how they ended up on the list, and Emerald has never offered.<\/td><\/tr><tr><th><a href=\"#moonstone-nation\">Moonstone<\/a><\/th><td>Attended as a rite rather than a contest and did not appear to be competing at any point. They are on the list.<\/td><\/tr><tr><th><a href=\"#amethyst-nation\">Amethyst<\/a><\/th><td>Hosted every delegation and argued for nothing. Nobody can recall Amethyst asking for a place. Amethyst has a place.<\/td><\/tr><tr><th><a href=\"#zircon-nation\">Zircon<\/a><\/th><td>Did not come. Was listed anyway — in absentia, by a show of hands, on the eleventh day. Has never acknowledged the list, does not date its years from it, and will tell you which year it actually is if you ask.<\/td><\/tr><tr><th><a href=\"#onyx-nation\">Onyx<\/a><\/th><td>Arrived on the appointed day, in formation, and considers the matter closed.<\/td><\/tr><\/tbody><\/table>\n<h3>Referenced, never explained<\/h3>\n<p><em>There were thirteen for the first eighty years.<\/em><\/p>\n<p>The kingdom that was underwater that season and sent nobody. The one that sent a champion who refused to play. Whatever the games were before this one — nobody teaches their names. And the eleventh day, which Amber's record apparently covers and Sapphire's does not.<\/p>\n<h3>Why it matters for the fandom<\/h3>\n<p>Choosing a kingdom is not choosing a colour. It is taking a side in a six-hundred-year-old argument about whether the list is legitimate — and every kingdom gets a virtue and a chip on its shoulder, which is what makes a house pick feel like a personality claim rather than a merch choice. See <a href=\"#nations-index\">The twelve nations<\/a>.<\/p>","x":null},{"i":"the-unchosen","t":"The unchosen player","c":"World","s":"","l":"A player no guardian has ever chosen, whose failure is becoming valuable to other people.","h":"<p><em>Every gem chooses someone. Never him.<\/em><\/p>\n<p>By every rule he should have been chosen, many times over. He never is. He owns a bag of empty stones and not one guardian.<\/p>\n<p>Every partner he has harvested with received the guardian instead, and all of them became top harvesters. None of them practise with him now.<\/p>\n<h3>How the pattern develops<\/h3>\n<p>At first people simply see him as unlucky or weak. As the number of harvests grows, the pattern becomes statistically and socially remarkable and difficult to dismiss.<\/p>\n<p>Then it becomes <em>valuable<\/em>. Players may actively want him as a harvesting partner, because partnering with him seems to guarantee the guardian will choose them. His failure becomes economically valuable to other people — which gives some of them a reason not to want him to improve, or to discover why guardians refuse him.<\/p>\n<p>His reputation develops along a line: <strong>unlucky → joke → superstition → valuable partner → anomaly.<\/strong><\/p>\n<h3>The mystery should stay one<\/h3>\n<p>Why guardians refuse him is the central mystery, and it should not be documented.<\/p>\n<p>The lesson is Tolkien's. Explanation does not just reveal machinery, it changes the register — &ldquo;servant of the Secret Fire&rdquo; is liturgy, and the same facts restated as an org chart are unusable. Tolkien's own depth is historical and linguistic rather than mechanical: genealogies, dated events, languages, place names with etymologies. He never resolved the cosmology, and the more he tried to nail down, the more it broke.<\/p>\n<p>So: <strong>the game can be systems; the guardians have to be myth.<\/strong> If the answer turns out to be a mechanism — some flaw in his resonance, something a <a href=\"#looms-and-guides\">Guide<\/a> could detect — it deflates on contact. If it is a <em>meaning<\/em> — something about what being chosen costs, or what the land remembers that he does not — it survives being explained.<\/p>","x":null},{"i":"nations-index","t":"The twelve nations","c":"Nations","s":"","l":"Twelve countries, each famous for one stone — and each with a grievance about how that happened.","h":"<p>Twelve countries with their own borders, histories and governments. Not regions of one state, and not twelve tribes of one people.<\/p>\n<p><strong>But the number twelve belongs to the stones, not to the map.<\/strong> There are more than twelve countries. Twelve stones became economically indispensable and twelve nations became famous for producing them — two separate facts that happen to produce the same number, the way &ldquo;the oil states&rdquo; is a real category without meaning there are exactly as many oil states as uses for oil.<\/p>\n<ul><li><strong>There are other countries.<\/strong> Places with no significant deposit, which buy everything they use. Most of the world lives in them.<\/li>\n<li><strong>The fit is imperfect.<\/strong> Some of the twelve produce two or three stones. Some share a deposit that straddles a border, which is permanent trouble.<\/li>\n<li><strong>Deposits follow geology, not borders.<\/strong> Nobody drew these lines around the stones. The stones were already there, and the nations grew where the wealth was or conquered their way to it.<\/li>\n<li><strong>The twelve are not equals.<\/strong> Some are large and old, some small and rich only because of what lies under them. Nothing requires them to be balanced.<\/li><\/ul>\n<p>They became the twelve at <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<table class=\"ed\"><thead><tr><th><\/th><th>Nation<\/th><th>They say<\/th><\/tr><\/thead><tbody><tr><td><span class=\"sw\" style=\"background:#D9A3C4\"><\/span><\/td><td><a href=\"#kunzite-nation\">Kunzite<\/a><span class=\"tiny\">The Flowering Scrub<\/span><\/td><td>&ldquo;Nothing's decided yet.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#E0A417\"><\/span><\/td><td><a href=\"#citrine-nation\">Citrine<\/a><span class=\"tiny\">The Salt Markets<\/span><\/td><td>&ldquo;Somebody had to pay for it.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#C0202E\"><\/span><\/td><td><a href=\"#ruby-nation\">Ruby<\/a><span class=\"tiny\">The Ember Valley<\/span><\/td><td>&ldquo;We got there first.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#C97B18\"><\/span><\/td><td><a href=\"#amber-nation\">Amber<\/a><span class=\"tiny\">The Resin Forest<\/span><\/td><td>&ldquo;We have the only complete record.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#9CC441\"><\/span><\/td><td><a href=\"#peridot-nation\">Peridot<\/a><span class=\"tiny\">The Terraces<\/span><\/td><td>&ldquo;The work came first.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#7FC9C9\"><\/span><\/td><td><a href=\"#aquamarine-nation\">Aquamarine<\/a><span class=\"tiny\">The Shifting Delta<\/span><\/td><td>&ldquo;We argued our way in.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#1D5FA8\"><\/span><\/td><td><a href=\"#sapphire-nation\">Sapphire<\/a><span class=\"tiny\">The Storm Coast<\/span><\/td><td>&ldquo;It was lawful, and I'm tired of being asked.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#0E7A4E\"><\/span><\/td><td><a href=\"#emerald-nation\">Emerald<\/a><span class=\"tiny\">The Flooded Basin<\/span><\/td><td>&ldquo;Nobody's explained it and we're not going to.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#DCE3EC\"><\/span><\/td><td><a href=\"#moonstone-nation\">Moonstone<\/a><span class=\"tiny\">The Lantern Lake<\/span><\/td><td>&ldquo;We weren't competing.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#6B4B9E\"><\/span><\/td><td><a href=\"#amethyst-nation\">Amethyst<\/a><span class=\"tiny\">The Violet Ridges<\/span><\/td><td>&ldquo;I never asked for a place.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#6FB3D9\"><\/span><\/td><td><a href=\"#zircon-nation\">Zircon<\/a><span class=\"tiny\">The Frost Peaks<\/span><\/td><td>&ldquo;The list is illegitimate.&rdquo;<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#2A2A2E\"><\/span><\/td><td><a href=\"#onyx-nation\">Onyx<\/a><span class=\"tiny\">The Black Cliffs<\/span><\/td><td>&ldquo;The matter is closed.&rdquo;<\/td><\/tr><\/tbody><\/table>\n<h3>On the typings<\/h3>\n<p>The OPS string on each nation is shorthand, not a claim — a compact way to carry a coaching tradition so that anyone fluent unpacks the same thing. It types the <em>environment<\/em>, never the people in it. Somebody with Si–Ti cognition born into an Fe–Se country still has Si–Ti cognition; they simply grew up somewhere that throws festivals at them. And going against the grain is not exclusion: the Si person in a festival culture is the one who builds the same float every year and keeps the record of how it was done last time.<\/p>\n<p>Causation runs <strong>geography → constraint → institutions → habits → default style.<\/strong> A nation with a six-week growing season does not develop a conserving culture because it is Si/Fi; it becomes Si/Fi because getting it wrong once kills people. Culture also lags geography — institutions outlive the conditions that produced them, and a great deal of national character is behaviour that made sense two centuries ago. Adoption is a majority, never a totality: perhaps two-thirds, with the rest an ordinary long tail nobody finds strange.<\/p>\n<p>Two pairs worth noting. <strong><a href=\"#ruby-nation\">Ruby<\/a> MM-Si/Te and <a href=\"#onyx-nation\">Onyx<\/a> MM-Te/Si<\/strong> are identical in every coin except lead order — same functions, same modality, same animals, same dominance — which is exactly why their rivalry never resolves, and why they bookend the competitive year. And <strong><a href=\"#amber-nation\">Amber<\/a> FF-Si/Ti and <a href=\"#zircon-nation\">Zircon<\/a> FM-Si/Fi<\/strong> are both Si-lead archivists with savior Sleep and Consume, split on dominance: Amber gathers and distributes, which is why it makes the Guides everyone uses, while Zircon gathers and never sends.<\/p>\n<h3>Rules<\/h3>\n<p><strong>Landscapes, not real ethnic groups.<\/strong> No nation maps onto an actual Thai hill tribe, minority or community. These are invented peoples defined by terrain and economy. Each borrows from a real historical <em>institution<\/em> — a salt-monopoly trading republic, an assembly-run irrigation cooperative, a neutral banking canton, a garrison state holding a single pass — never from a people or a living culture's sacred material. Borrow the structure, invent the surface, blend at least two sources per nation, and if a reader could name the real source, change something.<\/p>","x":null},{"i":"kunzite-nation","t":"Kunzite","c":"Nations","s":"The Flowering Scrub","l":"The Flowering Scrub","h":"<p class=\"said-big\">&ldquo;Nothing's decided yet.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#kunzite\">Kunzite<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Waking<\/strong> — The ball accelerates after the bounce. Soft off the paddle, fast off the court.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>MF-Ne/Fi-CP/S(B) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Sent a different delegation on each of the twelve days. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>A land that flowers violently for a few weeks and is brown the rest of the year. Nothing here rewards a long plan, because the conditions never hold long enough for one to pay off. Seed stock is speculative by nature: you back next season's crop before you know what next season is. Boom and bust, over and over, until improvisation became the only sane posture.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Dry scrub plain that floods with flowers for a few weeks a year, then goes brown again.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Seed-growing and nurseries. They start what everyone else transplants.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Annual councils that dissolve every year. Nothing is permanent by design.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Everything is owed a beginning. Nothing is judged by its first year.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Nothing finished. Buildings half-raised, repurposed, abandoned when the idea moves on. No monuments, because a monument is a commitment.<\/td><\/tr>\n<tr><th>The house<\/th><td>Many tiny houses, constantly failing and reforming. Cheapest entry in the country, highest churn.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Naive. Promising. Never finishes anything.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Never amounting to anything. Beginning forever.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Small birds and butterflies — fast, brief. Harvested casually and constantly.<\/td><\/tr>\n<tr><th>Festival<\/th><td>First Flower. The week the scrub blooms, and everyone begins something.<\/td><\/tr>\n<tr><th>Custom<\/th><td>You don't say what your trade is until you're twenty.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Thrifted and layered, nothing matching on purpose. Faded floral, patchwork, a fit that's never the same twice.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Si person becomes the only one who remembers what the festival was in previous years, and eventually the only record that it happened at all.<\/p>\n<h3>What they teach<\/h3>\n<p>Whatever creates points goes. No shot is correct in advance and no pattern should appear twice. A beginner is not given a technique, they are given permission. An error is repeating yourself.<\/p>\n<p><strong>What they never train.<\/strong> Blast last, so nothing is ever called, drilled or agreed between partners. Nothing gets grooved either, so under real pressure there is no shot they can rely on.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#amber-nation\">Amber<\/a>. Amber calls Kunzite wasteful. Kunzite calls Amber a graveyard.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#kunzite\">the Kunzite edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#D9A3C4"},{"i":"citrine-nation","t":"Citrine","c":"Nations","s":"The Salt Markets","l":"The Salt Markets","h":"<p class=\"said-big\">&ldquo;Somebody had to pay for it.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#citrine\">Citrine<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Velocity<\/strong> — Raw speed, flat and immediate. No time to set your feet.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>MM-Te/Se-PB/S(C) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Funded the Counting and has never let anyone forget. The word for sponsor in three kingdoms is a Citrine loanword. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Salt flats and no shade. Nothing grows, so everything must be bought, which means everything must first be sold. A nation that cannot feed itself becomes a nation that trades or dies, and centuries of that make the ledger the only moral document.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Open salt flats and sun-baked market towns. Glare off white ground, no shade anywhere.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Trade, markets, money. They store sunlight in stones and sell light and heat.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Merchant guilds. Wealth votes.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Light is borrowed and must be repaid. Debt is sacred.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Warehouses, market halls, weighbridges. Everything scaled for volume and stripped of ornament, because ornament is not load-bearing.<\/td><\/tr>\n<tr><th>The house<\/th><td>Openly commercial. Harvest rights are auctioned to the highest bidder. The most transparent house in the country and the most brutal.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Dazzling and greedy. Everything has a price.<\/td><\/tr>\n<tr><th>Fear<\/th><td>A market that stops. Being poor again.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Golden cats and sunbirds. Treated as assets.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Long Market. The country's largest trade fair.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Every gift must be repaid with interest.<\/td><\/tr>\n<tr><th>Dress<\/th><td>The only kingdom that wants logos. Gold hardware, chains, rings, sunglasses, visible branding. Loud and unembarrassed.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Fi person becomes the craftsman who refuses to scale, charges more than makes sense, and is quietly regarded as the real thing.<\/p>\n<h3>What they teach<\/h3>\n<p>The scoreboard is the only honest thing on this court. Take what is in front of you and take it now — pace, pressure, volume. Coaching is entirely by number, and a player is whatever their numbers say this month. An error is passivity: a ball you could have taken and let go is worse than a ball you took and missed.<\/p>\n<p><strong>What they never train.<\/strong> Consume last. They scout nobody, prepare for nothing, and never notice that an opponent who studied them has an edge.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#peridot-nation\">Peridot<\/a>. Citrine sets the price of the grain Peridot grows.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#citrine\">the Citrine edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#E0A417"},{"i":"ruby-nation","t":"Ruby","c":"Nations","s":"The Ember Valley","l":"The Ember Valley","h":"<p class=\"said-big\">&ldquo;We got there first.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#ruby\">Ruby<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Weight<\/strong> — The ball arrives heavy. It jars the paddle back on contact, regardless of its speed.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>MM-Si/Te-BS/C(P) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Arrived first, and has mentioned it every year since. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Volcanic ground, warm underfoot, and a fuel supply that made smelting possible before anyone else could manage it. A monopoly held long enough stops being an advantage and becomes an identity. When the method is the whole national wealth, changing the method is treason with extra steps.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>A volcanic valley of black rock. The ground is warm underfoot. Old lava fields, deep mines.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Forges, smelting, metalwork, gem cutting.<\/td><\/tr>\n<tr><th>Governance<\/th><td>One forge-master's line, inherited.<\/td><\/tr>\n<tr><th>Belief<\/th><td>What is made in fire is true. Endurance sanctifies.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Heavy, unchanged, blackened. Forges built on the footprint of older forges. Nothing has been redesigned in living memory and nobody considers this a problem.<\/td><\/tr>\n<tr><th>The house<\/th><td>One old hereditary house. Arrogant, and makes the best Looms in the country.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Proud, hot-tempered, and the best in the world at one thing.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Cold forges. Being surpassed.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Gaur and water buffalo — heavy animals. Near-veneration.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Banking of the Fires. The one day a year every forge goes out.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Nobody speaks during a forging.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Heavy workwear. Canvas, leather aprons, scorched hems, rolled sleeves. Nothing new — everything inherited and repaired.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Ne person becomes the heretic. They are either driven out or, thirty years later, the new tradition.<\/p>\n<h3>What they teach<\/h3>\n<p>This is the method; hit it harder. Technique is inherited, not invented: one form, drilled until it is heavy, taught the way it was taught to the person teaching it. The senior partner calls everything and calls it loudly. An error is deviation, even a deviation that worked.<\/p>\n<p><strong>What they never train.<\/strong> Play last. No improvisation, nothing off-script. A good new idea registers as an insult before it registers as an idea.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#onyx-nation\">Onyx<\/a>. Both claim to be the strongest land, and their powers are exact opposites.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#ruby\">the Ruby edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#C0202E"},{"i":"amber-nation","t":"Amber","c":"Nations","s":"The Resin Forest","l":"The Resin Forest","h":"<p class=\"said-big\">&ldquo;We have the only complete record.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#amber\">Amber<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Holding<\/strong> — The ball keeps whatever state it was given. It does not bleed speed, and it resists spin the opponent tries to put on it.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FF-Si/Ti-SC/B(P) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Kept the only complete record of all twelve days, and has never let anyone read it. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Slow-growing forest where the resource takes generations to mature. You cannot rush amber and you cannot plant your way out of a bad decade. A nation whose wealth arrives on a hundred-year cycle learns to think in hundred-year terms, and to write everything down because the person who needs the information has not been born yet.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Dry deciduous forest of very old trees. Resin, slow growth, deep shade.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Preservation — curing, drying, storing — and making the Guides, which take Amber cores.<\/td><\/tr>\n<tr><th>Governance<\/th><td>A council of elders. The oldest decide, and slowly.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Nothing that is kept is truly lost.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Deep interiors. Storehouses, archives, cold rooms, everything labelled and nothing discarded. The buildings go downward and backward rather than upward.<\/td><\/tr>\n<tr><th>The house<\/th><td>Makers rather than owners. They build Looms and Guides for all twelve lands, which gives them leverage over everyone.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Slow, hoarding, and quietly the most important land in the country.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Fire. Losing everything stored at once.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Pangolin and slow loris — ancient, slow creatures. Never harvested lightly, and several forms are nearly gone.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Sealing. Everything to be kept for the year is closed up together.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Nothing is thrown away, ever. Houses are full of stored things.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Long coats, many pockets, patched and relayered. Dusty scholar. Everything repaired rather than replaced.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Se person becomes the one who actually goes out and fetches things, and is indispensable in a way nobody will say aloud.<\/p>\n<h3>What they teach<\/h3>\n<p>We already know what does not work. Play as elimination: remove every option that has failed and whatever remains is the shot. Training is watching, recording and cataloguing, and a young player spends more time reading than hitting. An error is playing a shot whose failure is already documented.<\/p>\n<p><strong>What they never train.<\/strong> Play last. They cannot lift tempo when they need to, and they are painfully slow to accept anything the record does not yet cover.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#zircon-nation\">Zircon<\/a>. Rival preservers, with an old argument about who really keeps the country fed.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#amber\">the Amber edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#C97B18"},{"i":"peridot-nation","t":"Peridot","c":"Nations","s":"The Terraces","l":"The Terraces","h":"<p class=\"said-big\">&ldquo;The work came first.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#peridot\">Peridot<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Compounding<\/strong> — Effects grow across a rally. Each exchange adds a little. Rewards long points and punishes anyone who cannot end one.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FM-Fe/Si-BP/S(C) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Sent farmers, because it was planting season and the fields don't wait for a gathering. They nearly didn't make the list. Bring it up and watch what happens. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Terraced irrigation. One channel serves many fields, and a terrace above you can ruin a terrace below you without meaning to. Cooperation here is not a value, it is hydraulics — the physical layout makes unilateral action impossible, so consensus became the only functioning technology.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Terraced river valleys, flooded green for half the year.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Rice, at national scale. The country's grain.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Watershed assemblies. Everyone who shares water has a vote.<\/td><\/tr>\n<tr><th>Belief<\/th><td>What grows slowly grows right. Patience is the only real strength.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Communal and terraced. Shared halls, shared channels, everything built by many hands over many seasons. Few private structures of any size.<\/td><\/tr>\n<tr><th>The house<\/th><td>A cooperative. Harvesters hold shares. The only land where harvesters have real power.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Dull, patient, and much richer than they look.<\/td><\/tr>\n<tr><th>Fear<\/th><td>A lost season.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Frogs, herons, field creatures. Harvested cooperatively.<\/td><\/tr>\n<tr><th>Festival<\/th><td>Transplanting. The whole land in the fields on the same day.<\/td><\/tr>\n<tr><th>Custom<\/th><td>No one eats before the fields have been fed.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Matching kit, because nobody here is singular. Rolled trousers, wide hats, mud to the knee.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>A Ti person quietly redesigns the irrigation and lets the assembly take the credit, because that is the only way it gets adopted.<\/p>\n<h3>What they teach<\/h3>\n<p>Nobody plays alone. The pair is the unit, not the player: court coverage is shared, calls are constant, and the partnership is drilled harder than any individual shot. They enter everything — every draw, every format, every year. An error is silence, or taking a ball that was your partner's.<\/p>\n<p><strong>What they never train.<\/strong> Consume last — the tournament-addict pattern. They compete constantly, they are genuinely good at competing, and they never develop. No study, no film, no absorbing what better players do. They plateau and keep entering.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#citrine-nation\">Citrine<\/a>. Citrine sets the price of what Peridot grows.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#peridot\">the Peridot edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#9CC441"},{"i":"aquamarine-nation","t":"Aquamarine","c":"Nations","s":"The Shifting Delta","l":"The Shifting Delta","h":"<p class=\"said-big\">&ldquo;We argued our way in.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#aquamarine\">Aquamarine<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Flow<\/strong> — The ball curves smoothly and visibly in flight, and the player moves the same way.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>MF-Se/Ti-CP/S(B) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Arrived four days late because the channels moved, argued for a day and a half, and got on anyway. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>A delta whose channels move. A village sited correctly this decade is stranded the next, and a chart is out of date before it is finished. Permanence is a bet on geography that the geography keeps winning, so nobody takes it. What survives is knowledge held in a person rather than written down.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>A braided delta of shifting channels. Villages float and move.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Shipping and river piloting. They move everything everyone else produces.<\/td><\/tr>\n<tr><th>Governance<\/th><td>No fixed capital. Authority travels with the convoys, held by the pilots' guild.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Water finds a way. Resistance is a failure of imagination.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Almost nothing permanent. Floating villages, boats, structures that can be moved before the channel shifts.<\/td><\/tr>\n<tr><th>The house<\/th><td>Mobile houses on boats. Hard to regulate, harder to tax.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Charming and slippery. Never where you left them.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Still water. A closed channel. Being stuck.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Otters and river dolphins. Treated as neighbours.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Convoy. Every boat in the delta runs at once.<\/td><\/tr>\n<tr><th>Custom<\/th><td>They never say goodbye. They say <em>downstream<\/em>.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Light, loose, quick-dry. Everything rolls up or sheds. Nothing you'd mind losing to water.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Fe person becomes the one everyone actually talks to — the informal diplomat in a nation with no diplomats.<\/p>\n<h3>What they teach<\/h3>\n<p>The plan is whatever the water is doing. No game plan is taught, because no game plan survives contact: watch for four points, find what is actually in front of you, then raise the tempo. Skill is private craft and every player's technique is slightly their own. An error is committing early.<\/p>\n<p><strong>What they never train.<\/strong> Blast last. Nothing is announced, nothing is rehearsed with a partner, and against an opponent they genuinely cannot read they have nothing to fall back on.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#sapphire-nation\">Sapphire<\/a>. Sapphire licenses the water Aquamarine lives on.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#aquamarine\">the Aquamarine edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#7FC9C9"},{"i":"sapphire-nation","t":"Sapphire","c":"Nations","s":"The Storm Coast","l":"The Storm Coast","h":"<p class=\"said-big\">&ldquo;It was lawful, and I'm tired of being asked.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#sapphire\">Sapphire<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Reading<\/strong> — Not a ball effect. You perceive the opponent's shot earlier than you should.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FF-Ti/Ni-SC/B(P) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Convened the gathering, kept the minutes, and is still being accused of it. The record is in Sapphire's hand, which is why nobody entirely trusts it. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Deep harbours on a storm coast, which made it the place where foreign ships had to shelter and foreign disputes had to be settled. A nation that adjudicates other people's quarrels for a living cannot afford to be seen taking sides, so procedure became the export and impartiality became the product.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Storm coast with deep natural harbours. The wettest place in the country.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Law and water. They supply the country's judges and its clean water.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Magistrates appointed by examination. The most formal government in the country.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Clear judgement is a duty, not a gift.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Formal, geometric, stone, built to a plan that was argued over for a decade. Every public building states its purpose in its shape.<\/td><\/tr>\n<tr><th>The house<\/th><td>Licensed, audited, heavily regulated. The fairest house and the slowest.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Incorruptible, sanctimonious, no sense of humour.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Being publicly wrong. A judgement that kills someone.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Sea eagles and monitor lizards. Licensed harvests only.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Open Court. Any citizen may bring any grievance, against anyone.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Judgements are read aloud outdoors, in the rain.<\/td><\/tr>\n<tr><th>Dress<\/th><td>The most dressed kingdom. Tailored, waterproof, high collars, pressed. Sober and correct.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Fe person becomes the advocate who wins on sympathy, is enormously effective, and is resented for it by everyone who lost to them.<\/p>\n<h3>What they teach<\/h3>\n<p>Every point has one correct solution. The rally is a problem with an answer, and training is analysis: position, geometry, percentages, the specific patterns of the specific opponent. They arrive knowing what you do on the third shot. An error is playing a shot you cannot justify afterwards.<\/p>\n<p><strong>What they never train.<\/strong> Play last. They cannot simply out-hit anyone, and against genuine chaos they keep solving the wrong problem correctly.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#amethyst-nation\">Amethyst<\/a>. Sapphire cannot see inside Amethyst's houses, and cannot prove why.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#sapphire\">the Sapphire edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#1D5FA8"},{"i":"emerald-nation","t":"Emerald","c":"Nations","s":"The Flooded Basin","l":"The Flooded Basin","h":"<p class=\"said-big\">&ldquo;Nobody's explained it and we're not going to.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#emerald\">Emerald<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Cutting<\/strong> — The ball dies on the bounce. Almost no rebound.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FM-Te/Ni-BS/C(P) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Attended as physicians, not as players. Nobody can explain how they ended up on the list, and Emerald has never offered. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>A flooded basin where everything grows, including the diseases. Endemic fever made medicine a survival trade rather than a profession, and centuries of treating more patients than there were physicians made triage the national habit of mind — applied to everything, not only to the sick.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>A flooded jungle basin. Dense, tangled, everything grows over everything.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Medicine, herbs, surgery.<\/td><\/tr>\n<tr><th>Governance<\/th><td>The physicians' college holds civic authority.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Cutting is care. What is removed lets the rest live.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Wards, teaching halls, dispensaries. Functional, but designed around a purpose measured in decades rather than in use.<\/td><\/tr>\n<tr><th>The house<\/th><td>Controlled by the physicians' college. You need a qualification to harvest.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Cold and necessary. They decide who lives.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Cutting the wrong thing.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Pythons, civets, forest cats. Harvested clinically.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Cutting. Harvest day, and the day the college takes new students.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Physicians own no property. The land keeps them.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Clinical. Plain, austere, aprons and rolled sleeves. No ornament at all — ornament is something you own, and they own nothing.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Fi person becomes the physician who will not let a patient go, and is both the nation's conscience and its most inconvenient citizen.<\/p>\n<h3>What they teach<\/h3>\n<p>A long rally is a mistake you already made. Diagnose in three shots, then end it. Everything is triage: identify the weakness, apply the treatment, do not linger. Points are meant to be short and the shortness is the skill. An error is extending a point you could have closed.<\/p>\n<p><strong>What they never train.<\/strong> Play last, and a read committed to early. If the diagnosis was wrong they have already acted on it, and they lose fast without ever testing the alternative.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#moonstone-nation\">Moonstone<\/a>. Medicine against devotion, and who decides how a person dies.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#emerald\">the Emerald edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#0E7A4E"},{"i":"moonstone-nation","t":"Moonstone","c":"Nations","s":"The Lantern Lake","l":"The Lantern Lake","h":"<p class=\"said-big\">&ldquo;We weren't competing.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#moonstone\">Moonstone<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Float<\/strong> — The ball hangs, briefly losing weight in the air. Lobs and resets follow from this.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FF-Ni/Fe-BP/S(C) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Attended as a rite rather than a contest and did not appear to be competing at any point. They are on the list. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>A caldera lake under near-permanent mist, where for half the year you cannot see the far shore. Light was not decoration but infrastructure, and lamp-keeping was a public duty before it was a religious one. A society that must coordinate in poor visibility develops ritual, because ritual is how you know what everyone else is doing without being able to see them.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>A high lake in an old caldera, usually under mist. Formally Adularia; everyone calls it the Lantern Lake.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Lamps, lighting, glass. Night work of every kind.<\/td><\/tr>\n<tr><th>Governance<\/th><td>A lay order that keeps the lamps. Religious and civil at once.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Light must be carried through the dark. No one should walk at night alone.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Everything shaped for meaning and for being seen together after dark. Lamps set into walls, courtyards oriented on the lake, structures whose function is to be looked at from across the water.<\/td><\/tr>\n<tr><th>The house<\/th><td>The lamp order owns the Looms. Harvesting is treated as sacred duty, not business.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Devout, otherworldly, useless at anything practical.<\/td><\/tr>\n<tr><th>Fear<\/th><td>The lake going dark. One night with no lamps.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Owls, moths, fireflies. Ceremonial night harvests.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Floating. Lanterns on the lake.<\/td><\/tr>\n<tr><th>Custom<\/th><td>No light indoors except lamp-stone. Darkness is respected.<\/td><\/tr>\n<tr><th>Dress<\/th><td>All white, layered and flowing. Things that catch light. Pale linen, veils, a lantern in hand.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>A Te person becomes the one who actually runs the logistics of the festival, and everyone is glad of them without quite regarding it as sacred work.<\/p>\n<h3>What they teach<\/h3>\n<p>We prepared for this; play it as prepared. The match is a rehearsed performance, executed as written, in front of everyone, because being watched is part of it. There is a right way to play and it is beautiful. An error is improvising — breaking form is worse than losing.<\/p>\n<p><strong>What they never train.<\/strong> Consume last. They never scout, so the plan is built on their own idea of the opponent rather than the opponent. When the idea is wrong there is no second plan.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#amethyst-nation\">Amethyst<\/a>. Both own the night, in opposite ways.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#moonstone\">the Moonstone edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#DCE3EC"},{"i":"amethyst-nation","t":"Amethyst","c":"Nations","s":"The Violet Ridges","l":"The Violet Ridges","h":"<p class=\"said-big\">&ldquo;I never asked for a place.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#amethyst\">Amethyst<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Deception<\/strong> — The spin is concealed. The ball breaks the opposite way to what the swing showed.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FF-Fe/Ni-BP/C(S) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Hosted every delegation and argued for nothing. Nobody can recall Amethyst asking for a place. Amethyst has a place. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>Cloud forest ridges with no defensible border and nothing worth invading for. Survival came from being useful to everyone and threatening to no one, which over centuries became a deliberate industry: neutrality, discretion, and a place where rivals could both stay without meeting. Opacity is not a character flaw here, it is the national defence.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>Cloud forest ridges. Long violet dusks that last an hour.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Hospitality. Rest-houses, entertainment, recovery. The country goes there to stop.<\/td><\/tr>\n<tr><th>Governance<\/th><td>A decorative court with a figurehead. Real power sits wherever the houses are, and nobody is certain where that is.<\/td><\/tr>\n<tr><th>Belief<\/th><td>Rest is sacred. A mind must be allowed to close.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Rest-houses, screens, layered interiors, approaches that turn twice before arriving. Nothing displays its ownership and nothing is built to be understood from outside.<\/td><\/tr>\n<tr><th>The house<\/th><td>Ownership is opaque. Nobody is certain who holds the Looms, and it is rumoured they hold houses in other lands too.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Beautiful and untrustworthy. Everyone's second home.<\/td><\/tr>\n<tr><th>Fear<\/th><td>Being seen clearly.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Bats and dusk creatures. Harvesting is entertainment, with spectators.<\/td><\/tr>\n<tr><th>Festival<\/th><td>The Long Night. The country's great celebration, and nobody sleeps.<\/td><\/tr>\n<tr><th>Custom<\/th><td>Guests are never asked their name.<\/td><\/tr>\n<tr><th>Dress<\/th><td>The most expensive-looking kingdom. Rich fabric, long lines, layers that conceal. Beautiful and unreadable.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>A Ti person becomes the one who asks who owns this, and is politely, warmly, endlessly not answered.<\/p>\n<h3>What they teach<\/h3>\n<p>You do not have to win the point to beat them. The opponent is the surface being played, not the ball: rhythm, tempo, body language, what you show and when you show it. They will lose points deliberately to establish a pattern they intend to break three games later. An error is revealing yourself.<\/p>\n<p><strong>What they never train.<\/strong> Sleep last. No conservation at all — they perform until they are empty. And an opponent who simply does not read them has nothing to be managed.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#sapphire-nation\">Sapphire<\/a>. Sapphire keeps trying to audit them.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#amethyst\">the Amethyst edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#6B4B9E"},{"i":"zircon-nation","t":"Zircon","c":"Nations","s":"The Frost Peaks","l":"The Frost Peaks","h":"<p class=\"said-big\">&ldquo;The list is illegitimate.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#zircon\">Zircon<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>Drain<\/strong> — Robs the opponent's pace. A returned Zircon ball comes off their paddle slow and heavy.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>FM-Si/Fi-SC/P(B) · energy dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Did not come. Was listed anyway — in absentia, by a show of hands, on the eleventh day. Has never acknowledged the list, does not date its years from it, and will tell you which year it actually is if you ask. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>A six-week growing season at altitude. Getting it wrong once kills people, and there is no second attempt within the same year. Caution was rewarded for a thousand years until it became law, then custom, then simply correct. Outsiders were historically a net drain in a place with no surplus, and the closure long outlived the scarcity that justified it.<\/p>\n<h3>The country<\/h3>\n<table><tbody>\n<tr><th>Terrain<\/th><td>The highest peaks. Frost, thin air, bare rock, the oldest ground in the country.<\/td><\/tr>\n<tr><th>Livelihood<\/th><td>Cold storage, and mining the oldest stone. Amber keeps things shelf-stable; Zircon keeps them fresh.<\/td><\/tr>\n<tr><th>Governance<\/th><td>Clan heads and precedent. The most conservative place in the country.<\/td><\/tr>\n<tr><th>Belief<\/th><td>The land is older than all of us. We are guests on it.<\/td><\/tr>\n<tr><th>Built form<\/th><td>Stone cut into the mountain, unchanged for centuries. Thick walls, small openings, buildings that assume the weather will win eventually and plan to be there anyway.<\/td><\/tr>\n<tr><th>The house<\/th><td>Closed to outsiders entirely. Clans harvest their own land and sell almost nothing.<\/td><\/tr>\n<tr><th>Reputation<\/th><td>Closed, ancient and rude.<\/td><\/tr>\n<tr><th>Fear<\/th><td>The thaw. The land warming, and the old forms lost forever.<\/td><\/tr>\n<tr><th>Guardians<\/th><td>Serow, mountain goats, the highest creatures. Some forms exist nowhere else, and clans refuse to harvest certain forms at all.<\/td><\/tr>\n<tr><th>Festival<\/th><td>First Frost. The clans count what survived.<\/td><\/tr>\n<tr><th>Custom<\/th><td>The dead are not buried. They are carried up and left to the cold.<\/td><\/tr>\n<tr><th>Dress<\/th><td>Furs, wool, bound layers, hoods. Nothing decorative. Everything built to outlast whoever is wearing it.<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Against the grain<\/h3>\n<p>An Ne person leaves. This is the only nation where the against-the-grain answer is usually emigration, and everyone knows it.<\/p>\n<h3>What they teach<\/h3>\n<p>Nobody beats you if you do not lose. Every shot is chosen for survivability, points are long by design and getting longer is the plan, and training is attrition: legs, patience, cold, and the certainty that the other player will break first. An error is trying to win a point early.<\/p>\n<p><strong>What they never train.<\/strong> Blast last. Nothing is communicated to anyone, including a partner. And the record says what the record says, so they cannot adapt to something the record has not seen.<\/p>\n<h3>Oldest grudge<\/h3>\n<p><a href=\"#onyx-nation\">Onyx<\/a>. Mountain neighbours, permanently arguing over the pass.<\/p>\n<h3>See also<\/h3>\n<p><a href=\"#nations-index\">The twelve nations<\/a> · <a href=\"#zircon\">the Zircon edition<\/a> · <a href=\"#the-counting\">The Counting<\/a> · <a href=\"#the-harvest-economy\">The harvest economy<\/a><\/p>","x":"#6FB3D9"},{"i":"onyx-nation","t":"Onyx","c":"Nations","s":"The Black Cliffs","l":"The Black Cliffs","h":"<p class=\"said-big\">&ldquo;The matter is closed.&rdquo;<\/p>\n<table><tbody>\n<tr><th>Stone<\/th><td><a href=\"#onyx\">Onyx<\/a><\/td><\/tr>\n<tr><th>Power<\/th><td><strong>The Wall<\/strong> — Absorbs force. Power shots die against an Onyx defence rather than being returned.<\/td><\/tr>\n<tr><th>Coaching tradition<\/th><td><code>MM-Te/Si-BS/C(P) · info dominant<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>At the Counting<\/h3>\n<p>Arrived on the appointed day, in formation, and considers the matter closed. See <a href=\"#the-counting\">The Counting<\/a>.<\/p>\n<h3>What forced it<\/h3>\n<p>The only pass into the north. A nation that exists because of a chokepoint is a nation permanently organised around holding it, and everything else — la
